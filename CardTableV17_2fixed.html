.pot-badge{background:rgba(212,168,67,.15);color:var(--gold2);border:1px solid rgba(212,168,67,.35);border-radius:999px;padding:.1rem .55rem;font-weight:600;font-size:.7rem;}
.suit-badge{display:inline-flex;align-items:center;gap:.3rem;background:rgba(4,12,8,.65);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:.18rem .7rem;font-weight:600;font-size:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.dealer-label{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(251,247,237,.45);text-align:center;padding:.15rem .6rem;}

/* presence — a player who's gone quiet mid-turn */
.away-badge{align-self:center;font-size:.72rem;color:#f2c078;background:rgba(230,160,60,.12);border:1px solid rgba(230,160,60,.3);border-radius:999px;padding:.25rem .75rem;margin:.2rem auto 0;text-align:center;flex-shrink:0;animation:away-pulse 2s ease-in-out infinite;}
@keyframes away-pulse{0%,100%{opacity:.7;}50%{opacity:1;}}
.away-skip-btn{align-self:center;font-size:.74rem;font-weight:600;color:#f2c078;background:rgba(230,160,60,.16);border:1px solid rgba(230,160,60,.45);border-radius:999px;padding:.35rem .9rem;margin:.2rem auto 0;flex-shrink:0;cursor:pointer;transition:background .18s;}
.away-skip-btn:hover{background:rgba(230,160,60,.28);}
.away-skip-btn:focus-visible{outline:2px solid #f2c078;outline-offset:2px;}

/* ════════ THE FELT TABLE ════════ */
.felt-table{
  margin:.3rem .85rem;
  flex:1;min-height:200px;max-height:48vh;
  position:relative;overflow:hidden;
  border-radius:30px;

  /* Rich felt gradient + slow ambient light drift — colors come from the Felt & Frame theme vars */
  background:
    radial-gradient(circle 320px at 30% 30%,rgba(var(--rim-bright-rgb),.055),transparent 70%),
    radial-gradient(ellipse 85% 70% at 50% 44%,var(--felt-a) 0%,var(--felt-b) 45%,var(--felt-c) 100%);
  background-size:220% 220%,100% 100%;
  animation:felt-drift 22s ease-in-out infinite;

  /* SIGNATURE: casino-grade 5-ring rim, tinted by the theme's rim color */
  box-shadow:
    inset 0 0 0 1px rgba(var(--rim-bright-rgb),.1),
    0 0 0 1px rgba(var(--rim-bright-rgb),.06),
    0 0 0 5px rgba(8,12,18,.98),
    0 0 0 8px rgba(var(--rim-rgb),.65),
    0 0 0 9.5px rgba(var(--rim-bright-rgb),.3),
    0 0 0 12px rgba(90,60,10,.9),
    0 0 0 14px rgba(var(--rim-rgb),.12),
    inset 0 2px 16px rgba(255,255,255,.04),
    inset 0 0 80px rgba(0,0,0,.55),
    0 24px 60px rgba(0,0,0,.75);

  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;
}

/* felt texture */
.felt-table::after{content:'';position:absolute;inset:0;border-radius:30px;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(0,0,0,.018) 4px,rgba(0,0,0,.018) 5px),
    repeating-linear-gradient(90deg,transparent,transparent 4px,rgba(0,0,0,.018) 4px,rgba(0,0,0,.018) 5px);}

/* SIGNATURE: ambient turn glow on table */
.felt-table.my-turn::before{
  content:'';position:absolute;inset:-1px;border-radius:30px;
  background:transparent;
  box-shadow:inset 0 0 60px rgba(var(--rim-rgb),.12);
  animation:table-glow 2.5s ease-in-out infinite;
  pointer-events:none;z-index:0;
}
/* A well-worn table gains a slight warm patina rather than looking identical on game 1 and game
   200 -- a filter() so it layers over every felt color and every game uniformly, not per-theme
   color literals that would need hand-tuning 4 themes × 3 tiers. */
body[data-table-age="1"] .felt-table{filter:sepia(.06) saturate(1.08) contrast(1.02);}
body[data-table-age="2"] .felt-table{filter:sepia(.12) saturate(1.14) contrast(1.04) brightness(.98);}
body[data-table-age="3"] .felt-table{filter:sepia(.18) saturate(1.2) contrast(1.06) brightness(.96);}
@keyframes table-glow{0%,100%{box-shadow:inset 0 0 40px rgba(var(--rim-rgb),.08);}50%{box-shadow:inset 0 0 80px rgba(var(--rim-rgb),.18);}}
@keyframes felt-drift{0%,100%{background-position:20% 25%,0 0;}50%{background-position:78% 68%,0 0;}}

/* game-specific atmospheres — same identity, different mood */
.game-poker .felt-table{background:
  radial-gradient(circle 320px at 30% 30%,rgba(240,204,96,.04),transparent 70%),
  radial-gradient(ellipse 85% 70% at 50% 44%,#123322 0%,#081c14 45%,#02100b 100%);
  background-size:220% 220%,100% 100%;}
.game-blackjack .felt-table{background:
  radial-gradient(circle 320px at 30% 30%,rgba(240,204,96,.06),transparent 70%),
  radial-gradient(ellipse 85% 70% at 50% 44%,#5a1f28 0%,#2c0e14 45%,#160709 100%);
  background-size:220% 220%,100% 100%;}
.game-battle .felt-table{background:
  radial-gradient(circle 320px at 30% 30%,rgba(180,200,220,.05),transparent 70%),
  radial-gradient(ellipse 85% 70% at 50% 44%,#1a3a48 0%,#0e2430 45%,#061318 100%);
  background-size:220% 220%,100% 100%;}
.game-yahtzee .felt-table{background:
  radial-gradient(circle 320px at 30% 30%,rgba(var(--rim-bright-rgb),.06),transparent 70%),
  radial-gradient(ellipse 85% 70% at 50% 44%,#3a2c10 0%,#211809 45%,#120c04 100%);
  background-size:220% 220%,100% 100%;}
.game-roulette .felt-table{background:
  radial-gradient(circle 380px at 50% 20%,rgba(240,204,96,.05),transparent 70%),
  radial-gradient(ellipse 90% 75% at 50% 40%,#123d2b 0%,#0a2418 45%,#04120c 100%);
  background-size:220% 220%,100% 100%;}

/* ════════ YAHTZEE ════════ */
.y-standings-strip{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;padding:.5rem .85rem .5rem;flex-shrink:0;position:relative;z-index:1;}
.y-standing-pill{display:inline-flex;align-items:center;gap:.35rem;background:rgba(4,12,8,.5);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:.22rem .7rem;font-size:.72rem;font-weight:600;color:var(--paper3);transition:all .25s;}
.y-standing-pill .av-img{width:1.1rem;height:1.1rem;border-radius:50%;object-fit:cover;}
.y-standing-pill.active{background:rgba(212,168,67,.18);border-color:rgba(212,168,67,.5);color:var(--gold2);box-shadow:0 0 0 1px rgba(212,168,67,.15),0 2px 10px rgba(212,168,67,.15);}
.y-margin{text-align:center;font-size:.7rem;font-weight:600;color:var(--gold2);opacity:.85;padding:.2rem 0 .6rem;flex-shrink:0;position:relative;z-index:1;}
.y-margin-av{width:1.1em;height:1.1em;border-radius:50%;vertical-align:-.2em;object-fit:cover;}

.dice-tray{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;z-index:1;transition:opacity .25s;}
.dice-tray.locked{opacity:.45;pointer-events:none;}
.die{
  width:3.4rem;height:3.4rem;border-radius:.7rem;border:none;cursor:pointer;
  background:linear-gradient(155deg,#fdfbf3 0%,#ece4cf 100%);
  box-shadow:0 3px 0 #b8ab89,0 6px 14px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.8);
  display:grid;grid-template-rows:repeat(3,1fr);grid-template-columns:repeat(3,1fr);
  padding:.45rem;gap:0;transition:transform .18s var(--ease-spring),box-shadow .18s;
  position:relative;
}
.die:hover:not(:disabled){transform:translateY(-2px);}
.die:active:not(:disabled){transform:translateY(1px) scale(.96);}
.die:focus-visible{outline:2px solid var(--v13-gold,var(--gold2));outline-offset:4px;}
.die .pip{width:.5rem;height:.5rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a3a1e,#1a1206 75%);justify-self:center;align-self:center;}
.die.held{
  background:linear-gradient(155deg,var(--gold2) 0%,var(--gold) 100%);
  box-shadow:0 3px 0 var(--gold3),0 6px 16px rgba(212,168,67,.4),inset 0 1px 1px rgba(255,255,255,.9);
  transform:translateY(-7px);
}
.die.held .pip{background:radial-gradient(circle at 35% 30%,#5c3d08,#2b1c02 75%);}
.die.held:hover:not(:disabled){transform:translateY(-9px);}
.die.just-rolled{animation:die-roll .45s cubic-bezier(.36,.2,.4,1.4);}
.die-lock{position:absolute;top:-.45rem;right:-.45rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#1a1000;font-size:.68rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.45),0 0 0 1.5px var(--gold2);}
@keyframes die-roll{0%{transform:rotate(0) scale(1);}30%{transform:rotate(-18deg) scale(1.08);}60%{transform:rotate(14deg) scale(1.05);}100%{transform:rotate(0) scale(1);}}
.y-hint{font-size:.74rem;color:var(--paper3);text-align:center;z-index:1;min-height:1.1em;}

.y-scorecard{flex:1;min-height:0;overflow-y:auto;margin:0 .85rem .85rem;display:flex;flex-direction:column;gap:.15rem;padding-right:.2rem;}
.ysc-section-lbl{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(251,247,237,.4);padding:.6rem 0 .2rem;flex-shrink:0;}
.ysc-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem .7rem;border-radius:.55rem;flex-shrink:0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);}
.ysc-name{font-size:.82rem;color:var(--paper2);}
.ysc-val{font-weight:700;font-variant-numeric:tabular-nums;color:var(--paper3);}
.ysc-row.pending{opacity:.45;}
.ysc-row.open{cursor:pointer;background:rgba(212,168,67,.09);border-color:rgba(212,168,67,.35);}
.ysc-row.open:hover{background:rgba(212,168,67,.16);}
.ysc-row.open .ysc-val{color:var(--gold2);}
.ysc-row.open:focus-visible{outline:2px solid var(--v13-gold,var(--gold2));outline-offset:2px;}
.ysc-row.readonly{cursor:default;}
.ysc-row.readonly:hover{background:rgba(212,168,67,.09);}
.ysc-row.filled{background:rgba(255,255,255,.05);}
.ysc-row.filled .ysc-name{color:var(--paper3);}
.ysc-row.filled .ysc-val{color:var(--paper1);}
.ysc-row.bonus-row{background:transparent;border:none;padding:.3rem .7rem;flex-direction:column;align-items:stretch;gap:.35rem;}
.ysc-row.bonus-row .ysc-name,.ysc-row.bonus-row .ysc-val{font-size:.7rem;color:rgba(251,247,237,.5);}
.ysc-bonus-toprow{display:flex;align-items:center;justify-content:space-between;}
.ysc-bonus-bar{height:.35rem;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;}
.ysc-bonus-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#a87828,#f0cc60);transition:width .3s ease;}
.ysc-bonus-fill.full{background:linear-gradient(90deg,#3ecf8e,#8bf0c0);}
.ysc-row.total-row{margin-top:.3rem;background:rgba(242,201,76,.14);border-color:rgba(242,201,76,.4);}
.ysc-row.total-row .ysc-name{font-family:var(--serif);font-weight:700;color:var(--gold2);}
.ysc-row.total-row .ysc-val{font-size:1.1rem;color:var(--gold2);}

/* ════════ ROULETTE ════════ */
.roul-history-strip{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;padding:.5rem .85rem 0;flex-shrink:0;overflow-x:auto;}
.roul-hist-empty{font-size:.7rem;color:var(--paper3);}
.roul-hist-num{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;font-size:.68rem;font-weight:700;color:#fbf7ed;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.roul-hist-green{background:#0e6b3a;}
.roul-hist-red{background:#a3273e;}
.roul-hist-black{background:#1c1c1c;border:1px solid rgba(255,255,255,.15);}
.roul-player-strip{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;padding:.4rem .85rem 0;flex-shrink:0;}
.roul-player-pill{display:inline-flex;align-items:center;gap:.3rem;background:rgba(4,12,8,.5);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:.22rem .7rem;font-size:.68rem;font-weight:600;color:var(--paper3);cursor:pointer;transition:all .2s;}
.roul-player-pill .av-img{width:1.1rem;height:1.1rem;border-radius:50%;object-fit:cover;}
.roul-player-pill.active{background:rgba(212,168,67,.18);border-color:rgba(212,168,67,.5);color:var(--gold2);box-shadow:0 0 0 1px rgba(212,168,67,.15);}
.roul-pill-dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px rgba(0,0,0,.35);flex:0 0 auto;}
.roul-pill-away{opacity:.75;animation:roul-away-fade 1.6s ease-in-out infinite;}
@keyframes roul-away-fade{0%,100%{opacity:.4;}50%{opacity:.9;}}
.roul-pill-chips{opacity:.7;}
.roul-pill-bet{color:var(--gold2);}

.roul-grid{display:grid;grid-template-columns:48px repeat(12,44px) 56px;grid-template-rows:repeat(3,46px) 42px 42px;gap:3px;margin:0 auto;width:max-content;position:relative;z-index:1;
  padding:10px;border-radius:14px;background:linear-gradient(160deg,rgba(0,0,0,.35),rgba(0,0,0,.15));box-shadow:inset 0 2px 10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(212,168,67,.15);}
.roul-zero,.roul-cell,.roul-colbet,.roul-dozen,.roul-outside{border:none;cursor:pointer;position:relative;transition:filter .15s,transform .1s;font-family:var(--sans);}
.roul-zero:active,.roul-cell:active,.roul-colbet:active,.roul-dozen:active,.roul-outside:active{transform:scale(.94);}
.roul-zero:hover,.roul-cell:hover,.roul-colbet:hover,.roul-dozen:hover,.roul-outside:hover{filter:brightness(1.28);}
.roul-zero:focus-visible,.roul-cell:focus-visible,.roul-colbet:focus-visible,.roul-dozen:focus-visible,.roul-outside:focus-visible{outline:2px solid var(--gold2);outline-offset:1px;z-index:2;}
.roul-zero{background:linear-gradient(160deg,#1c8a52,#0c3a26);color:#fbf7ed;border-radius:10px 4px 4px 10px;font-weight:700;font-size:1.15rem;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.4);}
.roul-cell{color:#fbf7ed;font-weight:700;font-size:.92rem;border-radius:5px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.2),inset 0 -3px 6px rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.35);}
.roul-red{background:linear-gradient(160deg,#cc3752,#7a1626);}
.roul-black{background:linear-gradient(160deg,#333333,#0a0a0a);}
.roul-colbet{border-radius:4px 10px 10px 4px;background:linear-gradient(160deg,rgba(212,168,67,.16),rgba(212,168,67,.05));color:var(--gold2);font-size:.64rem;font-weight:700;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.1),inset 0 0 0 1px rgba(212,168,67,.25);}
.roul-dozen,.roul-outside{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:var(--paper2);font-size:.72rem;font-weight:700;border-radius:5px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.12),inset 0 -2px 5px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.06);}
.roul-outside-red{color:#f2879a;}
.roul-outside-black{color:#e5e0d5;}
.roul-chip-badges{position:absolute;bottom:2px;right:2px;left:2px;display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;pointer-events:none;}
.roul-chip-badge-p{background:var(--pc);color:#fff;font-size:.64rem;font-weight:800;border-radius:999px;padding:2px 5px;min-width:14px;line-height:1.35;text-align:center;text-shadow:0 1px 1px rgba(0,0,0,.55);box-shadow:0 1px 4px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.35);}
.roul-spin-status{position:absolute;top:.5rem;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:.45rem;background:rgba(4,10,8,.82);border:1px solid rgba(255,214,120,.35);color:#ffd678;font-weight:700;font-size:.82rem;letter-spacing:.02em;padding:.32rem .8rem;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none;}
.roul-spin-dot{width:.5rem;height:.5rem;border-radius:50%;background:#ffd678;animation:roul-dot-pulse .8s ease-in-out infinite;}
@keyframes roul-dot-pulse{0%,100%{opacity:.4;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
.roul-cell.roul-highlight,.roul-zero.roul-highlight{z-index:3;box-shadow:0 0 0 3px #ffd678,0 0 18px 4px rgba(255,214,120,.75),inset 0 1px 2px rgba(255,255,255,.35);animation:roul-highlight-pulse .5s ease-out;transform:scale(1.08);}
@keyframes roul-highlight-pulse{0%{transform:scale(1);}55%{transform:scale(1.16);}100%{transform:scale(1.08);}}
.roul-spin-text{font-family:var(--serif);color:var(--gold2);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;}
@media(max-width:480px){
  .roul-grid{grid-template-columns:22px repeat(12,18px) 26px;grid-template-rows:repeat(3,32px) 28px 28px;gap:2px;padding:5px;}
  .roul-zero{font-size:.72rem;}
  .roul-cell{font-size:.62rem;}
  .roul-colbet{font-size:.46rem;}
  .roul-dozen,.roul-outside{font-size:.5rem;}
  .roul-chip-badge-p{font-size:.42rem;padding:0 3px;min-width:9px;}
}
@media(max-width:340px){
  .roul-grid{grid-template-columns:18px repeat(12,15px) 22px;grid-template-rows:repeat(3,28px) 24px 24px;gap:1px;padding:4px;}
  .roul-zero{font-size:.6rem;}
  .roul-cell{font-size:.52rem;}
  .roul-colbet{font-size:.4rem;}
  .roul-dozen,.roul-outside{font-size:.42rem;}
}

.roul-controls{display:flex;flex-direction:column;gap:.5rem;padding:.5rem .85rem .3rem;flex-shrink:0;}
.roul-chip-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:center;}
.roul-chip-lbl{font-size:.68rem;color:var(--paper3);}
.roul-chip-pick{
  width:2.75rem;height:2.75rem;border-radius:50%;cursor:pointer;font-weight:800;font-size:.78rem;
  color:#fbf7ed;position:relative;transition:transform .18s,box-shadow .18s;
  border:2px dashed rgba(255,255,255,.4);
  box-shadow:inset 0 0 0 4px rgba(8,10,8,.85),inset 0 2px 3px rgba(255,255,255,.15),0 3px 6px rgba(0,0,0,.5);
}
.roul-chip-pick[data-val="1"]{background:radial-gradient(circle at 35% 30%,#5a5a5a,#222);}
.roul-chip-pick[data-val="5"]{background:radial-gradient(circle at 35% 30%,#d6455f,#7a1626);}
.roul-chip-pick[data-val="25"]{background:radial-gradient(circle at 35% 30%,#3fae6e,#0e5c34);}
.roul-chip-pick[data-val="100"]{background:radial-gradient(circle at 35% 30%,#2a2a2a,#050505);border-color:rgba(212,168,67,.5);}
.roul-chip-pick:hover{transform:translateY(-3px) scale(1.05);}
.roul-chip-pick.active{border-color:var(--gold2);box-shadow:inset 0 0 0 4px rgba(8,10,8,.85),inset 0 2px 3px rgba(255,255,255,.2),0 0 0 3px rgba(212,168,67,.35),0 6px 14px rgba(212,168,67,.35);transform:translateY(-3px);}
.roul-my-bet{margin-left:auto;font-size:.72rem;color:var(--paper3);}
.roul-my-bet b{color:var(--gold2);}
.roul-action-row{display:flex;gap:.5rem;align-items:center;}
.roul-action-row .btn-full{flex:1;}

/* community cards row (poker) */
.community-row{display:flex;gap:.5rem;z-index:1;flex-shrink:0;}
.community-slot{opacity:.25;transition:opacity .4s;perspective:900px;}
.community-slot.revealed{opacity:1;}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;}
.flip-inner.flip-static{transform:rotateY(180deg);}
.flip-inner.flip-reveal{animation:flip-reveal .55s var(--ease-spring) both;}
@keyframes flip-reveal{from{transform:rotateY(0);}to{transform:rotateY(180deg);}}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.flip-face.flip-front{transform:rotateY(180deg);}

/* blackjack */
.bj-player-row{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:.55rem .7rem;transition:border-color .2s,background .2s;}
.bj-player-row.active{border-color:rgba(212,168,67,.55);background:rgba(212,168,67,.08);box-shadow:0 0 0 1px rgba(212,168,67,.2);}
.bj-player-head{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:500;color:var(--paper);}
.bj-bet{font-size:.7rem;color:var(--gold2);}
.bj-player-cards{display:flex;margin-top:.35rem;}
.bj-card{margin-left:-1.1rem;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3));}
.bj-card:first-child{margin-left:0;}
.bj-player-foot{display:flex;align-items:center;gap:.5rem;margin-top:.3rem;}
.bj-total{font-family:var(--serif);font-weight:700;color:var(--gold2);font-size:.95rem;}
.bj-status{font-size:.68rem;padding:.12rem .5rem;border-radius:999px;background:rgba(255,255,255,.08);color:var(--paper3);}
.bj-status.win{background:rgba(34,197,94,.18);color:#86efac;}
.bj-status.lose{background:rgba(239,68,68,.18);color:#fca5a5;}
.bj-status.push{background:rgba(212,168,67,.15);color:var(--gold2);}

.pile-row{display:flex;gap:3rem;z-index:1;flex-shrink:0;}
.table-pile{display:flex;flex-direction:column;align-items:center;gap:.45rem;}
.table-pile-lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;color:rgba(248,240,224,.38);}

/* draw pile wrapper */
.draw-wrap{position:relative;cursor:pointer;}
.draw-wrap:hover>div{filter:brightness(1.15);}
.draw-badge{position:absolute;bottom:-.5rem;right:-.5rem;background:var(--gold);color:#1a1000;font-size:.68rem;font-weight:700;font-variant-numeric:tabular-nums;border-radius:999px;min-width:1.45rem;height:1.45rem;display:flex;align-items:center;justify-content:center;padding:0 .3rem;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.draw-badge.hot{background:var(--red);color:#fff;}

/* discard pile */
.disc-pile{position:relative;}
/* disc-pile children use inline styles */
.jack-suit-badge{position:absolute;bottom:-.5rem;left:-.5rem;background:rgba(4,12,8,.92);border:1px solid rgba(240,204,96,.55);border-radius:999px;min-width:1.6rem;height:1.6rem;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 12px rgba(240,204,96,.25);animation:playable-pulse 2.2s ease-in-out infinite;z-index:2;}

/* pot display */
.pot-display{
  background:rgba(8,12,18,.65);border:1px solid rgba(212,168,67,.3);
  border-radius:20px;padding:.4rem 1rem;
  font-family:var(--serif);font-size:1rem;font-weight:700;
  color:var(--gold2);z-index:1;text-align:center;
  display:flex;align-items:center;gap:.5rem;
}
.pot-label{font-size:.62rem;font-family:var(--sans);color:var(--paper3);text-transform:uppercase;letter-spacing:.1em;}

/* ════════ CARDS ════════ */
/* playing-card: all styles are inline for Safari compatibility */
.playing-card{
  transition:transform .18s var(--ease-spring),box-shadow .18s;
}

/* card back */
.card-back-el{
  border-radius:inherit;
  background:
    repeating-linear-gradient(45deg,rgba(212,168,67,.16) 0,rgba(212,168,67,.16) 2px,transparent 2px,transparent 11px),
    repeating-linear-gradient(-45deg,rgba(212,168,67,.16) 0,rgba(212,168,67,.16) 2px,transparent 2px,transparent 11px),
    linear-gradient(145deg,#0a3020,#1a6040,#0a3020);
  border:2px solid rgba(212,168,67,.75);
  position:absolute;inset:0;
}
.card-back-el::after{content:'';position:absolute;inset:5px;border-radius:calc(inherit - 3px);border:1px solid rgba(212,168,67,.35);}
.card-back-el .spade-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(212,168,67,.2);font-family:serif;}

/* ════════ HAND ════════ */
.hand-region{flex-shrink:0;}
.hand-meta{display:flex;align-items:center;justify-content:space-between;padding:.12rem 1.1rem .38rem;}
.hand-who{font-family:var(--serif);font-size:.95rem;font-weight:700;color:var(--paper);}
.hand-cnt{font-size:.75rem;color:var(--paper3);}
.hand-scroll{display:flex;align-items:flex-end;padding:.5rem 1.5rem .9rem;gap:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.hand-scroll::-webkit-scrollbar{display:none;}

.hc{appearance:none;border:none;background:none;padding:0;margin-left:-.85rem;flex-shrink:0;cursor:pointer;transition:transform .2s var(--ease-spring);scroll-snap-align:center;position:relative;will-change:transform;-webkit-tap-highlight-color:transparent;touch-action:pan-x;}
.hc.dragging{transition:none!important;z-index:50;cursor:grabbing;}
.hc:first-child{margin-left:0;}
.hc:hover{transform:translateY(-18px) scale(1.03);}
.hc.selected{transform:translateY(-24px) scale(1.04);}
.hc.selected span{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px;}
.hc.shake{animation:shake .38s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);}}

/* card throw animation */
@keyframes card-throw{
  0%{transform:translateY(0) scale(1) rotate(0deg);}
  30%{transform:translateY(-60px) scale(1.1) rotate(-5deg);}
  100%{transform:translateY(0) scale(1) rotate(0deg);}
}
.card-throw{animation:card-throw .4s var(--ease-smooth);}

/* card dealing into hand -- a real flick off the deck (bigger throw distance, sideways drift, more
   rotation) rather than a small fade-and-rise. --ease-spring already overshoots past 100% before
   settling, so the "bounce on landing" comes free from the existing easing curve. */
@keyframes card-deal-in{
  0%{opacity:0;transform:translateY(90px) translateX(-18px) scale(.55) rotate(-24deg);}
  50%{opacity:1;}
  100%{opacity:1;transform:none;}
}
.hc.deal-in,.bj-card.deal-in{animation:card-deal-in .6s var(--ease-spring) both;}

/* beginner mode: playable-card hint */
.hc.playable::after{content:'';position:absolute;inset:-4px;border-radius:14px;pointer-events:none;box-shadow:0 0 0 2px rgba(216,189,122,.5),0 0 16px rgba(216,189,122,.32);animation:playable-pulse 2.2s ease-in-out infinite;}
@keyframes playable-pulse{0%,100%{opacity:.5;}50%{opacity:1;}}

/* ════════ POKER BETTING ════════ */
.poker-actions{
  display:flex;flex-direction:column;gap:.5rem;
  padding:.3rem 1rem;flex-shrink:0;
}
.poker-action-row{display:flex;gap:.5rem;justify-content:center;}
.chips-display{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  font-family:var(--serif);font-size:.88rem;color:var(--gold2);
  padding:.1rem 0;
}
.chip{display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;border-radius:50%;font-weight:700;font-size:.68rem;border:2px solid rgba(255,255,255,.3);}
.chip-w{background:#e5e7eb;color:#111;}
.chip-r{background:#ef4444;color:white;}
.chip-b{background:#3b82f6;color:white;}
.chip-g{background:#22c55e;color:white;}
.chip-k{background:#1f2937;color:white;border-color:rgba(255,255,255,.4);}
.bet-input-row{display:flex;gap:.5rem;align-items:center;}
.bet-inp{flex:1;background:rgba(8,12,18,.7);border:1px solid rgba(212,168,67,.35);border-radius:10px;color:var(--gold2);padding:.5rem .8rem;font-size:.95rem;font-family:var(--serif);font-weight:700;text-align:center;}
.bet-inp:focus{outline:none;border-color:var(--gold2);}

.hint-strip{padding:.15rem 1.1rem;min-height:1.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hint-txt{font-size:.78rem;color:var(--paper3);text-align:center;}
.hint-err{background:rgba(200,16,46,.12);border:1px solid rgba(200,16,46,.28);border-radius:9px;padding:.38rem .85rem;font-size:.78rem;color:#f87090;text-align:center;}
.hint-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.28);border-radius:9px;padding:.38rem .85rem;font-size:.78rem;color:#86efac;text-align:center;}

.react-strip{display:flex;gap:.32rem;justify-content:center;padding:.3rem .8rem .5rem;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.react-strip::-webkit-scrollbar{display:none;}
.rb{width:2.75rem;height:2.75rem;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;
  background:radial-gradient(circle at 35% 30%,rgba(212,168,67,.14),rgba(255,255,255,.02));
  border:1px solid rgba(212,168,67,.16);border-radius:50%;cursor:pointer;opacity:.85;
  box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .14s,opacity .14s,background .14s,border-color .14s;}
.rb:hover{opacity:1;background:rgba(212,168,67,.18);border-color:rgba(212,168,67,.42);transform:translateY(-2px);}
.rb:active{transform:scale(.88);}
.float-r{position:absolute;font-size:2.4rem;animation:float-up 3.2s ease forwards;pointer-events:none;z-index:20;}
.float-r.storm{font-size:3.2rem;filter:drop-shadow(0 0 14px rgba(240,204,96,.85));animation:float-up-storm 3.2s ease forwards;}
/* Hold full opacity/size through most of the animation rather than fading almost immediately — a
   reaction on the other player's device already has sync latency eating into how long they have to
   notice it, so the visible window needs to be generous, not just the total duration. */
@keyframes float-up-storm{0%{opacity:1;transform:translateY(0) scale(.8) rotate(0deg);}10%{opacity:1;transform:translateY(-12px) scale(1.4) rotate(-6deg);}65%{opacity:1;transform:translateY(-85px) scale(1.25) rotate(-2deg);}100%{opacity:0;transform:translateY(-135px) scale(1.1) rotate(6deg);}}
@keyframes float-up{0%{opacity:1;transform:translateY(0) scale(.8);}10%{opacity:1;transform:translateY(-10px) scale(1.2);}65%{opacity:1;transform:translateY(-70px) scale(1.05);}100%{opacity:0;transform:translateY(-115px);}}

/* ─── TABLE TALK: emoji reactions + short messages, visible to everyone at the table ─── */
.rb.talk-toggle{opacity:.85;}
.rb.talk-toggle.on{opacity:1;background:rgba(212,168,67,.18);}
.talk-compose{display:flex;align-items:center;gap:.45rem;padding:.1rem .8rem .45rem;flex-shrink:0;animation:talk-compose-in .2s var(--ease-smooth) both;}
@keyframes talk-compose-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.talk-inp{flex:1;min-width:0;background:rgba(8,12,18,.55);border:1px solid rgba(212,168,67,.3);border-radius:999px;color:var(--paper);padding:.5rem .9rem;font-size:.85rem;font-family:var(--sans);}
.talk-inp:focus{outline:none;border-color:var(--gold);}
.talk-inp::placeholder{color:rgba(255,255,255,.28);}
.talk-send-btn{flex-shrink:0;width:2.2rem;height:2.2rem;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(160deg,#f0cc60,#d4a843 60%,#a87828);color:#1a1000;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.4);transition:transform .12s;}
.talk-send-btn:active{transform:scale(.9);}
.talk-bubbles{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;gap:.3rem;align-items:center;z-index:25;pointer-events:none;max-width:88%;}
.talk-bubble{display:flex;align-items:center;gap:.4rem;background:rgba(9,16,12,.94);border:1px solid rgba(212,168,67,.45);border-radius:999px;padding:.28rem .8rem .28rem .28rem;font-size:.76rem;color:var(--paper);box-shadow:0 8px 20px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;animation:talk-pop .3s var(--ease-spring) both,talk-fade .4s ease 3.6s forwards;}
.talk-bubble-av{width:1.5em;height:1.5em;border-radius:50%;overflow:hidden;flex-shrink:0;display:inline-flex;}
.talk-bubble-name{font-weight:600;color:var(--gold2);flex-shrink:0;}
.talk-bubble-txt{overflow:hidden;text-overflow:ellipsis;}
@keyframes talk-pop{0%{opacity:0;transform:scale(.7) translateY(-8px);}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes talk-fade{to{opacity:0;transform:translateY(-8px);}}
@media(prefers-reduced-motion:reduce){.talk-bubble,.talk-compose{animation:none!important;}}

.your-turn-banner{position:fixed;top:13%;left:50%;transform:translateX(-50%);z-index:90;padding:.6rem 1.5rem;border-radius:999px;background:linear-gradient(160deg,#f0cc60,#d4a843,#a87828);color:#1a1000;font-family:var(--serif);font-weight:800;font-size:1.05rem;letter-spacing:.08em;box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);animation:your-turn-in .4s var(--ease-spring) both;pointer-events:none;white-space:nowrap;}
.your-turn-banner.hide{animation:your-turn-out .4s ease both;}
@keyframes your-turn-in{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.9);}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}
@keyframes your-turn-out{to{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.94);}}

.yahtzee-banner{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:95;padding:1rem 2.2rem;border-radius:20px;text-align:center;background:linear-gradient(160deg,#f0cc60,#d4a843,#a87828);color:#1a1000;box-shadow:0 16px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);animation:your-turn-in .4s var(--ease-spring) both;pointer-events:none;}
.yahtzee-banner.hide{animation:your-turn-out .4s ease both;}
.yb-text{font-family:var(--serif);font-weight:800;font-size:1.7rem;letter-spacing:.05em;white-space:nowrap;}
.yb-sub{font-size:.74rem;font-weight:600;letter-spacing:.03em;margin-top:.2rem;opacity:.8;white-space:nowrap;}

/* ─── ACHIEVEMENT UNLOCKS — a proper "unlocked!" moment, distinct from the plain toast ─── */
.achievement-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9500;
  display:flex;align-items:center;gap:.8rem;max-width:min(90vw,380px);
  padding:.85rem 1.3rem .85rem 1rem;border-radius:16px;
  background:linear-gradient(155deg,rgba(20,36,27,.97),rgba(6,12,9,.98));
  border:1px solid rgba(234,208,138,.5);
  box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 40px -10px rgba(234,208,138,.5),inset 0 1px 0 rgba(255,235,190,.1);
  animation:ach-in .55s var(--ease-spring) both;pointer-events:none;}
.achievement-toast.hide{animation:ach-out .5s ease both;}
.ach-icon{font-size:2.1rem;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(234,208,138,.6));animation:ach-icon-spin .7s ease .15s both;}
.ach-body{min-width:0;text-align:left;}
.ach-eyebrow{font-size:.58rem;text-transform:uppercase;letter-spacing:.16em;color:var(--gold2);opacity:.9;}
.ach-name{font-family:var(--serif);font-size:1.05rem;font-weight:700;color:var(--paper);margin-top:.1rem;line-height:1.15;}
.ach-desc{font-size:.72rem;color:var(--paper3);margin-top:.1rem;}
.ach-cta{font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;color:var(--gold2);opacity:.8;margin-top:.35rem;}
@keyframes ach-in{0%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.85);}60%{transform:translateX(-50%) translateY(4px) scale(1.03);}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}}
@keyframes ach-out{to{opacity:0;transform:translateX(-50%) translateY(-18px) scale(.92);}}
@keyframes ach-icon-spin{from{transform:rotate(-25deg) scale(.6);}to{transform:rotate(0) scale(1);}}
@media(prefers-reduced-motion:reduce){.achievement-toast,.achievement-toast.hide,.ach-icon{animation:none!important;}}

/* ════════ HAND STRENGTH INDICATOR ════════ */
.hand-strength{
  text-align:center;font-family:var(--serif);font-size:.8rem;
  color:var(--gold2);padding:.1rem 0;flex-shrink:0;
  min-height:1.2rem;letter-spacing:.04em;
  animation:hs-in .3s var(--ease-spring) both;
}
@keyframes hs-in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ════════ OVERLAYS ════════ */
#overlay-root .ov{position:fixed;inset:0;background:rgba(4,6,10,.9);display:flex;align-items:center;justify-content:center;padding:1.4rem;z-index:200;backdrop-filter:blur(14px);animation:ov-in .2s ease both;}
@keyframes ov-in{from{opacity:0;}to{opacity:1;}}
#overlay-root .ov-box{background:linear-gradient(160deg,var(--bg3),var(--bg2));border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:1.9rem;max-width:28rem;width:100%;box-shadow:0 32px 80px rgba(0,0,0,.9),0 0 0 1px rgba(212,168,67,.08);display:flex;flex-direction:column;gap:1rem;animation:ov-box-in .28s var(--ease-spring) both;}
@keyframes ov-box-in{from{transform:scale(.88) translateY(14px);}to{transform:none;}}
.ov-title{font-family:var(--serif);font-size:1.45rem;font-weight:700;color:var(--paper);}
.ov-sub{font-size:.88rem;color:var(--paper3);line-height:1.55;}

.suit-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}
.suit-cho{display:flex;flex-direction:column;align-items:center;gap:.38rem;padding:1.25rem .5rem;border-radius:15px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-size:2.3rem;transition:all .18s;}
.suit-cho:hover{background:rgba(255,255,255,.1);border-color:var(--gold);transform:translateY(-3px);}
.suit-cho.red{color:#C8102E;}
.suit-cho.black{color:#e8e8e8;}
.suit-lbl{font-size:.68rem;color:var(--paper3);text-transform:capitalize;font-family:var(--sans);}

.mau-icon{font-size:3rem;text-align:center;}
.mau-ttl{font-family:var(--serif);font-size:2.2rem;font-weight:700;text-align:center;color:var(--gold2);}
.timer-track{width:100%;height:.5rem;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--gold2),var(--red));animation:timer-down linear forwards;transform-origin:left;}
@keyframes timer-down{from{transform:scaleX(1);}to{transform:scaleX(0);}}

.rules-list{display:flex;flex-direction:column;gap:.65rem;font-size:.88rem;color:var(--paper3);line-height:1.55;}
.rules-list b{color:var(--paper);}
.quit-btns{display:flex;flex-direction:column;gap:.5rem;}

/* poker showdown */
.showdown-grid{display:flex;flex-direction:column;gap:.55rem;}
.showdown-row{display:flex;align-items:center;gap:.65rem;padding:.6rem .8rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;}
.showdown-row.winner{background:rgba(212,168,67,.12);border-color:rgba(212,168,67,.4);}
.sd-av{font-size:1.5rem;}
.sd-name{flex:1;font-weight:500;}
.sd-hand{font-size:.7rem;color:var(--gold2);font-family:var(--serif);}
.sd-chips{font-weight:600;color:var(--green-acc);font-variant-numeric:tabular-nums;}

/* draw replacement (five-card draw) */
.draw-select-hint{text-align:center;font-size:.8rem;color:var(--gold2);padding:.2rem 0;flex-shrink:0;}

/* ════════ RESULTS ════════ */
#s-roundend,#s-matchend{overflow-y:auto;background:var(--bg);}
.res-body{flex:1;padding:1.2rem 1.1rem 2.5rem;display:flex;flex-direction:column;gap:1.3rem;overflow-y:auto;}
/* Classic flexbox pitfall: a flex-column with overflow-y:auto still lets default flex-shrink:1
   children shrink (clipping/overlapping their own content) instead of the container scrolling.
   Found while testing on a short/narrow viewport, where the winner banner's own title and capture
   button were being compressed past the banner's visible edge. Every direct child should keep its
   natural height and let .res-body scroll instead. */
.res-body>*{flex-shrink:0;}
.winner-banner{--acc:#c9a45c;position:relative;overflow:hidden;background:rgba(14,64,40,.45);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:22px;padding:1.8rem;text-align:center;
  box-shadow:0 0 44px -18px color-mix(in srgb,var(--acc) 65%,transparent);transition:box-shadow .3s,border-color .3s;}
.winner-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%);}
.wb-trophy{margin-bottom:.5rem;animation:win-pop .6s var(--ease-spring) both;}
.snap-btn{margin-top:1rem;background:rgba(212,168,67,.12);border:1px solid rgba(212,168,67,.4);color:var(--gold2);border-radius:999px;padding:.5rem 1.15rem;font-size:.78rem;font-family:var(--sans);cursor:pointer;transition:background .15s,transform .12s;}
.snap-btn:hover{background:rgba(212,168,67,.2);}
.snap-btn:active{transform:scale(.96);}
.wb-trophy .icon-svg{width:3.2rem;height:3.2rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
@keyframes win-pop{0%{transform:scale(.3) rotate(-12deg);opacity:0;}65%{transform:scale(1.2) rotate(3deg);opacity:1;}100%{transform:none;opacity:1;}}
.wb-title{font-family:var(--serif);font-size:clamp(1.4rem,6vw,2.1rem);font-weight:700;color:var(--paper);}
.wb-sub{font-size:.8rem;color:var(--paper3);margin-top:.4rem;}
.moments-empty{padding:3rem 1rem;text-align:center;}

/* ─── WALL OF FAME — framed win portraits, replacing the old plain moments list ─── */
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:1.1rem;max-width:920px;}
.frame-card{position:relative;border-radius:6px;padding:9px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 22px rgba(0,0,0,.35);
  transition:transform .18s,box-shadow .18s;}
.frame-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.45);}
.frame-card::before{content:'';position:absolute;inset:4px;border:1px solid var(--acc,#c9a45c);border-radius:3px;opacity:.5;pointer-events:none;}
.frame-portrait{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--acc,#c9a45c) 30%,transparent),transparent 72%),var(--felt3);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
.frame-av{width:100%;height:100%;object-fit:cover;}
.frame-game-badge{position:absolute;top:6px;right:6px;width:1.7rem;height:1.7rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.82rem;
  background:rgba(6,10,8,.72);border:1px solid var(--acc,#c9a45c);backdrop-filter:blur(4px);}
.frame-photo-tag{position:absolute;bottom:6px;left:6px;width:1.5rem;height:1.5rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:.72rem;
  background:rgba(6,10,8,.72);border:1px solid var(--acc,#c9a45c);backdrop-filter:blur(4px);}
.frame-plaque{margin-top:.65rem;text-align:center;padding:0 .1rem;}
.frame-name{font-family:var(--serif);font-size:.94rem;font-weight:600;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.frame-moment{font-size:.7rem;color:var(--paper2);margin-top:.18rem;line-height:1.4;min-height:2.1em;}
.frame-meta{font-size:.58rem;text-transform:uppercase;letter-spacing:.09em;color:var(--acc,var(--gold2));margin-top:.4rem;opacity:.9;}
/* ─── HOUSE LEGENDS — a small hall of fame above the family roster ─── */
.legends-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.6rem;}
.legend-badge{position:relative;width:9.2rem;flex-shrink:0;text-align:center;padding:1.1rem .8rem .9rem;
  border-radius:16px;border:1px solid rgba(234,208,138,.22);
  background:radial-gradient(120% 160% at 50% -10%,rgba(212,168,67,.14),transparent 65%),linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  box-shadow:0 10px 22px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);}
.legend-icon{font-size:1.3rem;margin-bottom:.4rem;}
.legend-av{width:2.6rem;height:2.6rem;margin:0 auto .55rem;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold3);}
.legend-title{font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold2);opacity:.9;}
.legend-name{font-family:var(--serif);font-size:1rem;color:var(--paper);margin-top:.25rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend-sub{font-size:.66rem;color:var(--paper3);margin-top:.2rem;}
.rivalry-card{padding:.9rem 1.1rem 1rem;margin-bottom:1.6rem;border-radius:16px;border:1px solid rgba(234,208,138,.22);
  background:radial-gradient(120% 160% at 50% -10%,rgba(212,168,67,.14),transparent 65%),linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  box-shadow:0 10px 22px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);}
.rivalry-label{font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;color:var(--gold2);opacity:.9;text-align:center;margin-bottom:.5rem;}
.rivalry-row{display:flex;align-items:center;gap:.6rem;}
.rivalry-side{flex:1;text-align:center;min-width:0;}
.rivalry-av{width:2.8rem;height:2.8rem;margin:0 auto .35rem;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold3);}
.rivalry-name{font-family:var(--serif);font-size:.9rem;color:var(--paper);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rivalry-score{font-size:1.5rem;font-weight:700;color:var(--paper);margin-top:.1rem;}
.rivalry-vs{font-size:.68rem;color:var(--paper3);flex-shrink:0;font-family:var(--serif);}
.rivalry-sub{text-align:center;font-size:.68rem;color:var(--gold2);margin-top:.65rem;}
/* ═══ TROPHY ROOM ═══ */
.trophy-summary{display:flex;align-items:center;gap:1.1rem;padding:1rem 1.2rem;margin-bottom:1.7rem;max-width:620px;
  border-radius:18px;border:1px solid rgba(234,208,138,.22);
  background:radial-gradient(120% 180% at 50% -20%,rgba(212,168,67,.16),transparent 65%),linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  box-shadow:0 10px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);}
.trophy-ring{position:relative;width:4.4rem;height:4.4rem;flex-shrink:0;display:grid;place-items:center;}
.trophy-ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.trophy-ring-track{fill:none;stroke:rgba(255,255,255,.09);stroke-width:5;}
.trophy-ring-fill{fill:none;stroke:url(#trophyGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);}
.trophy-ring-pct{font-family:var(--serif);font-size:1rem;font-weight:700;color:var(--gold2);}
.trophy-summary-body{min-width:0;}
.trophy-summary-title{font-family:var(--serif);font-size:1.05rem;color:var(--paper);font-weight:600;}
.trophy-summary-sub{font-size:.74rem;color:var(--paper3);margin-top:.2rem;}
.trophy-summary-next{font-size:.72rem;color:var(--gold2);margin-top:.45rem;}
.trophy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.85rem;max-width:960px;padding-bottom:1.5rem;}
.trophy-card{position:relative;overflow:hidden;padding:1rem .9rem .9rem;border-radius:16px;text-align:center;

/* ═════════ V13 SIGNATURE CARD & TABLE SYSTEM ═════════ */

.v13-seat .v13-av{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a5c48,#16281d);border:1.5px solid #caa057;font-size:18px}

}

'use strict';

/* ── ERROR DISPLAY ── */
window.onerror=function(msg,src,line,col,err){
  if(msg==='Script error.'||!line||line===0)return true;
  // Suppress ALL cross-origin/external script errors — only show our own
  if(!src||src==='')return true;

  if(line===0)return true;
  if(msg==='Script error.'||!line)return true;

  d.textContent='ERROR L'+line+': '+msg+(err?' | '+err.stack:'');
  document.body.appendChild(d);
  return false;
};
window.onunhandledrejection=function(e){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;top:0;left:0;right:0;background:#880000;color:white;padding:12px;font-size:13px;font-family:monospace;z-index:9999;word-break:break-all;';
  d.textContent='PROMISE ERROR: '+(e.reason&&e.reason.message?e.reason.message:e.reason);
  document.body.appendChild(d);
};

/* ═══════ SUPABASE ═══════ */
const SB_URL='https://bibxhrqxbecaukmschbe.supabase.co';
const SB_KEY='sb_publishable_2ZKsf4Yozk4v-QjXfCixMQ_0WpbjJ_h';
let _sb=null,_ch=null,_poll=null,_awayTick=null,_lts=0,_onlineBusy=false;
const _seenTalk=new Set(); // ids of table-talk entries (reactions/messages) already animated, so onSrv diffing never replays one twice
const SB=()=>{
  if(typeof supabase==='undefined')return null;
  try{return _sb||(_sb=supabase.createClient(SB_URL,SB_KEY));}catch(e){return null;}
};
const dbRead=async id=>{
  const sb=SB();if(!sb)return null;
  try{const{data,error}=await sb.from('card_rooms').select('state').eq('id',id).single();return error?null:data?.state||null;}
  catch(e){return null;}
};
const dbWrite=async(id,s)=>{
  const sb=SB();if(!sb){toast('⚠️ Online mode unavailable');return false;}
  s._ts=s._ts||Date.now();
  try{const{error}=await sb.from('card_rooms').upsert({id,state:s,updated_at:new Date().toISOString()});if(error){toast('⚠️ Sync error');return false;}return true;}
  catch(e){toast('⚠️ Network error');return false;}
};
// Optimistic-concurrency write: only lands if the row's state._ts still matches what this client
// read before mutating. Every other online game is turn-gated (only the current player ever
// writes), so a plain read-mutate-write is safe there — Roulette is the one exception, where any
// seated player can bet at any moment with no serialization at all, so two players betting within
// the same round-trip window would otherwise silently clobber each other's chip deduction/bet.
// Returns true if the write landed, false if someone else wrote first (caller should re-read and retry).
const dbWriteIfUnchanged=async(id,expectedTs,s)=>{
  const sb=SB();if(!sb){toast('⚠️ Online mode unavailable');return false;}
  s._ts=Date.now();
  try{
    const{data,error}=await sb.from('card_rooms').update({state:s,updated_at:new Date().toISOString()}).eq('id',id).eq('state->>_ts',String(expectedTs)).select('id');
    if(error){toast('⚠️ Sync error');return false;}
    return!!(data&&data.length);
  }catch(e){return false;}
};
// ═══ PRESENCE — who's actually still at the table ═══
// Supabase's presence channel is ephemeral (never written to the persisted room row): each client
// announces itself once subscribed, the server drops a client from the presence set automatically
// within ~30s of it going away (tab closed, phone locked, wifi died), and every client gets a live
// 'sync' event with the current set. That's exactly "is this player still here" without polluting
// game state with heartbeat writes, and without needing any server-side code of our own.
let _presentPids=new Set(),_absentSince={};
function isPlayerAbsent(pid,graceMs){
  if(!pid||pid===G.myPid)return false; // never flag yourself
  const since=_absentSince[pid];
  return since!=null&&(Date.now()-since)>=(graceMs||0);
}
function _onPresenceSync(){
  const sb=SB();if(!sb||!_ch)return;
  const state=_ch.presenceState();
  _presentPids=new Set(Object.values(state).flat().map(m=>m.pid));
  const roomPids=(G.srv?.players||[]).map(p=>p.id);
  roomPids.forEach(pid=>{
    if(pid===G.myPid)return;
    if(_presentPids.has(pid))delete _absentSince[pid];
    else if(_absentSince[pid]==null)_absentSince[pid]=Date.now();
  });
  render();
}
function dbSub(id,cb){
  const sb=SB();
  const onState=s=>{if(s&&s._ts!==_lts){_lts=s._ts;cb(s);}};
  _presentPids=new Set();_absentSince={};
  if(sb){
    if(_ch)sb.removeChannel(_ch);
    _ch=sb.channel('r:'+id)
      .on('postgres_changes',{event:'*',schema:'public',table:'card_rooms',filter:`id=eq.${id}`},()=>dbRead(id).then(onState))
      .on('presence',{event:'sync'},_onPresenceSync)
      .subscribe(status=>{if(status==='SUBSCRIBED')_ch.track({pid:G.myPid});});
  }
  if(_poll)clearInterval(_poll);
  _poll=setInterval(()=>dbRead(id).then(onState),1500);
  // The away badge/skip-button thresholds are time-based (AWAY_HINT_MS/AWAY_SKIP_MS), so they need
  // their own tick to advance on screen even when nothing else about the game state has changed —
  // otherwise a player who's merely gone quiet (no new state to trigger a render) would stay stuck
  // showing "may be away" long past the point the skip button should have appeared.
  if(_awayTick)clearInterval(_awayTick);
  _awayTick=setInterval(()=>{if(Object.keys(_absentSince).length)render();oRoulCheckStuckSpin();},4000);
}
function stopSync(){if(_ch)SB().removeChannel(_ch);if(_poll)clearInterval(_poll);if(_awayTick)clearInterval(_awayTick);_ch=_poll=_awayTick=null;_presentPids=new Set();_absentSince={};localStorage.removeItem('ct_online_session');}
// Remembers just enough to silently rejoin the same seat after a refresh, tab close, or the app
// being reopened from the home screen — without this, a dropped connection mid-game meant losing
// your spot and having to rejoin as a brand-new player. Cleared automatically by stopSync() whenever
// the player deliberately leaves (home, quit, new game), so it never outlives the session it's for.
function saveOnlineSession(){
  if(!G.roomId||!G.myPid)return;
  localStorage.setItem('ct_online_session',JSON.stringify({roomId:G.roomId,myPid:G.myPid,myName:G.myName,myAvatar:G.myAvatar,isHost:G.isHost}));
}
function resumeOnlineSession(){
  const raw=localStorage.getItem('ct_online_session');
  if(!raw)return Promise.resolve(false);
  let sess=null;try{sess=JSON.parse(raw);}catch(e){}
  if(!sess?.roomId||!sess?.myPid){localStorage.removeItem('ct_online_session');return Promise.resolve(false);}
  const ready=typeof supabase==='undefined'?new Promise(res=>loadSupabase(res)):Promise.resolve();
  return ready.then(()=>dbRead(sess.roomId)).then(state=>{
    if(!state||!(state.players||[]).some(p=>p.id===sess.myPid)){
      localStorage.removeItem('ct_online_session');
      return false;
    }
    G.roomId=sess.roomId;G.myPid=sess.myPid;G.myName=sess.myName||G.myName;G.myAvatar=sess.myAvatar||G.myAvatar;G.isHost=!!sess.isHost;G.isOnline=true;G.selGame=state.gameId||G.selGame;
    // Seed G.srv with a clone of the incoming state itself (not left null) so onSrv's own before/after
    // diffing sees "nothing changed" on this first call and skips replaying win fanfare, confetti,
    // history entries, or "your turn" notifications that already happened before the refresh.
    G.srv={...state};
    dbSub(sess.roomId,onSrv);
    onSrv(state);
    render();
    return true;
  }).catch(()=>false);
}
// Two stages: a quiet "may be away" hint once someone's been gone a little while, then an actual
// skip button once it's been long enough that waiting on them is genuinely blocking the table.
const AWAY_HINT_MS=12000,AWAY_SKIP_MS=20000;
function awayIndicatorHTML(pid,pname){
  if(!G.isOnline||!pid||pid===G.myPid)return'';
  if(isPlayerAbsent(pid,AWAY_SKIP_MS))return`<button class="away-skip-btn" data-a="force-skip" aria-label="Skip ${esc(pname)}'s turn — they seem to have disconnected">⏭ ${esc(pname)} seems away — Skip their turn</button>`;
  if(isPlayerAbsent(pid,AWAY_HINT_MS))return`<div class="away-badge">💤 ${esc(pname)} may be away…</div>`;
  return'';
}
// Performs the least-disruptive legal action on behalf of whoever's turn it currently is, once
// they've been confirmed absent long enough — mirrors each game's own online action functions so
// the table can keep moving instead of hanging on a player who closed their tab or lost signal.
// Any other present player can trigger this; it deliberately does NOT check isMyTurn().
async function oForceSkipCurrentPlayer(){
  if(_onlineBusy)return;
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state||state.winner)return;
    const p=state.players[state.curIdx];if(!p||p.id===G.myPid)return;
    if(!isPlayerAbsent(p.id,AWAY_SKIP_MS)){toast('Still waiting — give them a moment.');return;}
    state.lastAct=esc(p.name)+' was skipped (away too long).';
    let runout=false,allDone=false;
    if(state.gameId==='texas'||state.gameId==='fivecard'){
      p.folded=true;SFX.fold();
      const remain=state.players.filter(pl=>!pl.folded);
      if(remain.length===1){
        const winner=remain[0];
        winner.chips+=state.pot;winner.roundsWon=(winner.roundsWon||0)+1;
        state.winner=winner.id;state.winnerName=winner.name;state.winnerAv=winner.avatar;
        state.roundResult=buildPokerResult([winner],state.players,state.pot);
      } else {
        runout=oPokerAdvanceAfterAction(state);
      }
    } else if(state.gameId==='blackjack'){
      if(!p.bjDone){p.bjDone=true;allDone=oBjAdvanceTurn(state);}
    } else if(state.gameId==='yahtzee'){
      if(!state.yrolls){state.ydice=state.ydice.map(()=>rnd(1,6));state.yrolls=1;state.yLastRolled=[0,1,2,3,4];}
      const openCats=Y_CATS.filter(c=>p.scorecard[c]===null);
      if(openCats.length){
        let bestCat=openCats[0],bestScore=-1;
        openCats.forEach(c=>{const s=yScoreForCategory(c,state.ydice,p.scorecard);if(s>bestScore){bestScore=s;bestCat=c;}});
        if(yIsBonusYahtzee(state.ydice,p.scorecard))p.scorecard.yahtzeeBonus=(p.scorecard.yahtzeeBonus||0)+100;
        p.scorecard[bestCat]=yScoreForCategory(bestCat,state.ydice,p.scorecard);
      }
      oYAdvanceTurn(state);
    } else if(state.gameId==='maumau'){
      // mauPend/needsSuit are set on the pending player mid-turn (after they've already played a
      // card) and don't advance curIdx themselves, so the normal drawPend/skip8Pend/draw-a-card
      // fallback below would silently make the absent player draw an EXTRA card on top of
      // whichever pending state they left dangling, without ever actually clearing it — the next
      // player would then see a stale "call Mau!" banner or suit-pick prompt meant for someone
      // else. Handle those two cases first, mirroring the same-player penalty each already applies
      // when it times out on its own (oMauTimeoutCheck / oResolveMau), just triggered by someone
      // else once they've been away long enough to force-skip.
      if(state.mauPend&&state.mauPend.pid===p.id){
        const label=state.mauPend.label;
        state.mauPend=null;
        oDrawN(state,p,2);
        state.lastAct=p.avatar+' '+esc(p.name)+' forgot to call '+label+'! +2 cards.';
        oAdvance(state,null);
      } else if(state.needsSuit){
        state.curSuit=(state.discard[state.discard.length-1]||{}).suit||state.curSuit||SUITS[0];
        state.needsSuit=false;
        oResolveMau(state,p,true);
      } else if(state.drawPend>0){oDrawN(state,p,state.drawPend);state.drawPend=0;oAdvance(state,null);}
      else if(state.skip8Pend){state.skip8Pend=false;oAdvance(state,null);}
      else{oDrawN(state,p,1);oAdvance(state,null);}
    } else if(state.gameId==='uno'){
      // Same shape as the maumau branch above: a pending "call Uno!" or unpicked wild color must be
      // resolved before falling back to a plain forced draw, or it'd leave a stale prompt for the
      // next player.
      if(state.mauPend&&state.mauPend.pid===p.id){
        const label=state.mauPend.label;
        const pendCard=state.mauPend.card;
        state.mauPend=null;
        oDrawN(state,p,2);
        state.lastAct=p.avatar+' '+esc(p.name)+' forgot to call '+label+'! +2 cards.';
        if(pendCard)oUnoAdvance(state,pendCard);else oAdvance(state,null);
      } else if(state.needsSuit){
        const top=state.discard[state.discard.length-1];
        state.curSuit=state.curSuit||UNO_COLORS[0];
        state.needsSuit=false;
        if(top)oUnoResolve(state,p,top);
      } else {
        oDrawN(state,p,1);
        oAdvance(state,null);
      }
    } else {
      return; // no per-turn action to force (e.g. Battle — both players can act whenever)
    }
    state._ts=Date.now();onSrv(state);
    await dbWrite(G.roomId,state);
    if(runout&&!state.winner)setTimeout(()=>oPokerRunoutStep(),900);
    if(allDone)setTimeout(()=>oBjDealerPlay(),500);
  } finally { _onlineBusy=false; }
}

let _ac=null;
function tone(f,d,t='sine'){if(!G.snd)return;try{_ac=_ac||new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();const o=_ac.createOscillator(),g=_ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.065;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+(d||.12));o.stop(_ac.currentTime+(d||.12)+.02);}catch(e){}}
// Ambient Lounge — a very quiet, deliberately simple room-tone bed (soft filtered noise, no pitched
// content) that plays while you're actually at the table. Kept to noise-only on purpose: a synthesized
// pad/drone risks sounding subtly off-key with no way for me to proof-listen to it; filtered noise at
// low volume can't sound "wrong" the way an out-of-tune chord can. Shares the SFX system's AudioContext.
let _ambNodes=null;
function startAmbient(){
  if(_ambNodes||!G.snd||!G.ambientOn)return;
  try{
    _ac=_ac||new(window.AudioContext||window.webkitAudioContext)();
    if(_ac.state==='suspended')_ac.resume();
    const ac=_ac;
    const len=ac.sampleRate*2;
    const buffer=ac.createBuffer(1,len,ac.sampleRate);
    const data=buffer.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){const white=Math.random()*2-1;last=(last+.02*white)/1.02;data[i]=last*3.2;}
    const src=ac.createBufferSource();src.buffer=buffer;src.loop=true;
    const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=360;
    const gain=ac.createGain();gain.gain.value=0;
    src.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    src.start();
    gain.gain.linearRampToValueAtTime(.032,ac.currentTime+2.2);
    _ambNodes={src,filter,gain};
  }catch(e){_ambNodes=null;}
}
function stopAmbient(){
  if(!_ambNodes)return;
  const nodes=_ambNodes;_ambNodes=null;
  try{
    nodes.gain.gain.linearRampToValueAtTime(0,_ac.currentTime+.8);
    setTimeout(()=>{try{nodes.src.stop();nodes.src.disconnect();nodes.filter.disconnect();nodes.gain.disconnect();}catch(e){}},900);
  }catch(e){}
}
// Ambient tension — the lounge bed swells brighter/louder for a few seconds at genuinely high-stakes
// moments (a final Yahtzee roll, an all-in, the dealer's reveal, a Battle war) then eases back to the
// quiet baseline. Purely a filter-cutoff + gain ramp on the SAME noise bed already playing, so it can
// never introduce a wrong note the way a synthesized swell could — it only ever gets brighter or dimmer.
// A no-op whenever ambient isn't already running, so it stays strictly opt-in via the lounge toggle.
function pulseTension(){
  if(!_ambNodes)return;
  try{
    const{filter,gain}=_ambNodes;
    const now=_ac.currentTime;
    filter.frequency.cancelScheduledValues(now);gain.gain.cancelScheduledValues(now);
    filter.frequency.setValueAtTime(filter.frequency.value,now);gain.gain.setValueAtTime(gain.gain.value,now);
    filter.frequency.linearRampToValueAtTime(980,now+.35);gain.gain.linearRampToValueAtTime(.062,now+.35);
    filter.frequency.linearRampToValueAtTime(360,now+3.4);gain.gain.linearRampToValueAtTime(.032,now+3.4);
  }catch(e){}
}

/* ═══════ DECK ENGINE ═══════ */
function buildDeck(n,gameId){n=n||1;gameId=gameId||'';var ranks=gameId==='maumau'?['7','8','9','10','J','Q','K','A']:RANKS;var d=[];for(var k=0;k<n;k++)SUITS.forEach(function(s){ranks.forEach(function(r){d.push({id:r+s+Math.random().toString(36).slice(2,5),suit:s,rank:r});});});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function cardVal(c){
  // Mau Mau German scoring: J=20, A/K/Q=10, 2-10=face value
  if(c.rank==='J')return 20;
  if(['A','K','Q'].includes(c.rank))return 10;
  return+c.rank;
}
// Standard 108-card Uno deck: 4 colors × (one 0, two each of 1–9, two each of Skip/Reverse/Draw
// Two) = 100 colored cards, plus 4 Wild + 4 Wild Draw Four = 108. Cards are {color,value} rather
// than {suit,rank} — a deliberately different shape from the playing-card deck above so the two
// games' card logic never accidentally cross-reads the wrong field.
const UNO_COLORS=['red','yellow','green','blue'];
function buildUnoDeck(){
  const d=[];
  const mk=(color,value)=>d.push({id:color+value+Math.random().toString(36).slice(2,6),color,value});
  UNO_COLORS.forEach(c=>{
    mk(c,'0');
    for(let n=1;n<=9;n++){mk(c,String(n));mk(c,String(n));}
    ['skip','reverse','draw2'].forEach(v=>{mk(c,v);mk(c,v);});
  });
  for(let i=0;i<4;i++){mk('black','wild');mk('black','wild4');}
  return d;
}
function unoCardVal(c){
  // Official Uno scoring, used for round-end tallies: number cards = face value, action cards = 20,
  // wilds = 50.
  if(c.color==='black')return 50;
  if(['skip','reverse','draw2'].includes(c.value))return 20;
  return+c.value;
}
function unoIsAction(c){return['skip','reverse','draw2','wild','wild4'].includes(c.value);}
function unoCardLabel(c){
  const names={skip:'Skip',reverse:'Reverse',draw2:'Draw Two',wild:'Wild',wild4:'Wild Draw Four'};
  const label=names[c.value]||c.value;
  return c.color==='black'?label:`${c.color[0].toUpperCase()+c.color.slice(1)} ${label}`;
}

/* ═══════ POKER HAND EVALUATOR ═══════ */
function evalHand(cards){
  // Takes 5-7 cards, returns best 5-card hand strength
  if(cards.length<5)return{rank:0,name:'High Card',best:cards};
  const combos=cards.length===5?[cards]:getCombos(cards,5);
  let best=null,bestScore=0;
  for(const c of combos){const s=score5(c);if(s>bestScore){bestScore=s;best=c;}}
  return{score:bestScore,name:handName(bestScore),best};
}
function getCombos(arr,k){
  if(k===0)return[[]];if(arr.length===k)return[arr];
  const[h,...t]=arr;return[...getCombos(t,k-1).map(c=>[h,...c]),...getCombos(t,k)];
}
function score5(cards){
  const vals=cards.map(c=>RANK_VAL[c.rank]).sort((a,b)=>b-a);
  const suits=cards.map(c=>c.suit);
  const flush=suits.every(s=>s===suits[0]);
  const uniq=[...new Set(vals)];
  const counts=uniq.map(v=>vals.filter(x=>x===v).length).sort((a,b)=>b-a);
  // straight check
  let straight=false,highV=vals[0];
  if(uniq.length===5&&vals[0]-vals[4]===4)straight=true;
  // A-2-3-4-5 wheel
  if(vals.join()===`14,5,4,3,2`){straight=true;highV=5;}
  const [c1,c2]=counts;
  let rank=0;
  if(flush&&straight)rank=highV===14&&vals[1]===13?9:8;
  else if(c1===4)rank=7;
  else if(c1===3&&c2===2)rank=6;
  else if(flush)rank=5;
  else if(straight)rank=4;
  else if(c1===3)rank=3;
  else if(c1===2&&c2===2)rank=2;
  else if(c1===2)rank=1;
  // Tiebreaker: for a straight (or straight flush), only the top card matters — order by highV,
  // using the wheel's already-corrected highV=5 so A-2-3-4-5 sorts as the *lowest* straight, not the highest.
  // Otherwise, order by group (pair/trips/quads value first, then kickers) so e.g. a pair of Kings
  // outranks a pair of Queens with a bigger kicker, and a full house compares by its triple's rank first.
  const orderedVals=straight?[highV,highV-1,highV-2,highV-3,highV-4]
    :uniq.map(v=>({v,c:vals.filter(x=>x===v).length})).sort((a,b)=>b.c-a.c||b.v-a.v).flatMap(g=>Array(g.c).fill(g.v));
  return rank*10000000+orderedVals.reduce((s,v,i)=>s+v*Math.pow(15,4-i),0);
}
function handName(score){
  const r=Math.floor(score/10000000);
  return['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush','Royal Flush'][r]||'High Card';
}

// localStorage history (getHistory()) until the remote fetch lands, or forever if offline/unreachable,
// so the Family screen is never empty — it just narrows to "what this device has seen" until synced.

// Shared by both the check() and the progress() of the streak achievements, so the bar can never
// disagree with the unlock condition it's counting toward.
function winStreak(){
  const h=getHistory();let n=0;
  for(const g of h){if(g.winner&&g.winner===h[0].winner)n++;else break;}
  return n;
}
function gamesWonCount(){return new Set(getHistory().filter(h=>h.winner).map(h=>h.game)).size;}
function peopleMetCount(){return new Set(getHistory().flatMap(h=>h.players||[]).filter(Boolean)).size;}
// Unlocks moved from a bare array of ids to {id:ISO date} so the Trophy Room can say WHEN each was
// earned. Old installs stored the plain array — read both shapes and normalise, treating a legacy
// entry as earned-but-undated rather than throwing away someone's hard-won trophies on upgrade.
function getAchievements(){
  let raw;
  try{raw=JSON.parse(localStorage.getItem('ct_achievements')||'{}');}catch{return{};}
  if(Array.isArray(raw)){const o={};raw.forEach(id=>{if(typeof id==='string')o[id]=null;});return o;}
  return raw&&typeof raw==='object'?raw:{};
}
function checkAchievements(){
  const unlocked=getAchievements();
  const newly=[];
  ACHIEVEMENTS.forEach(a=>{
    if(a.id in unlocked)return;
    // A single malformed history row shouldn't be able to break every later achievement's check.
    let earned=false;try{earned=!!a.check();}catch(e){}
    if(earned){unlocked[a.id]=new Date().toISOString();newly.push(a);}
  });
  if(newly.length){
    localStorage.setItem('ct_achievements',JSON.stringify(unlocked));
    newly.forEach((a,i)=>setTimeout(()=>showAchievementToast(a),i*2200));
  }
}
function showAchievementToast(a){

  document.body.appendChild(el);

  // The toast is the one moment you're actually thinking about trophies — make it the doorway.
  // Deliberately never interrupts a live hand: mid-game it just dismisses, since yanking someone
  // out of their turn to admire a badge is the opposite of a reward.
  el.style.cursor='pointer';el.setAttribute('role','button');el.setAttribute('tabindex','0');
  const open=()=>{
    el.remove();
    if(hasActiveTable())return;
    G.scr='trophies';render();
  };
  el.addEventListener('click',open);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  setTimeout(()=>el.classList.add('hide'),3200);
  setTimeout(()=>el.remove(),3700);
}

// Everything needed to render a shareable "Table Digest" card for today's games — null if nothing
// was played today yet, so the entry point can stay hidden/disabled instead of offering an empty card.
function digestData(){
  const todayStr=new Date().toDateString();
  const todays=getHistory().filter(h=>new Date(h.date).toDateString()===todayStr); // newest-first
  if(!todays.length)return null;
  const winCounts={},nameAvatar={};
  todays.forEach(h=>{
    if(h.winner){winCounts[h.winner]=(winCounts[h.winner]||0)+1;}
    if(h.winner&&h.winnerAvatar)nameAvatar[h.winner]=h.winnerAvatar;
  });
  const standings=Object.entries(winCounts).sort((a,b)=>b[1]-a[1]).map(([name,wins])=>({name,wins,avatar:nameAvatar[name]||'🃏'}));
  const gamesList=[...new Set(todays.map(h=>h.game))].map(id=>GAMES.find(g=>g.id===id)?.name||id);
  // Game of the Night — only worth calling out once more than one game was actually played tonight;
  // with just one game, it'd just repeat what gamesList already says.
  const gameCounts={};
  todays.forEach(h=>{gameCounts[h.game]=(gameCounts[h.game]||0)+1;});
  const topGame=Object.entries(gameCounts).sort((a,b)=>b[1]-a[1])[0];
  const gameOfNight=(topGame&&Object.keys(gameCounts).length>=2)?{name:GAMES.find(g=>g.id===topGame[0])?.name||topGame[0],icon:GAMES.find(g=>g.id===topGame[0])?.icon||'🃏',count:topGame[1]}:null;
  // Longest current streak among tonight's games — same rule as House Legends: skip games a player
  // didn't take part in, stop counting at the first game they took part in and lost.
  let bestStreak={name:null,len:0};
  Object.keys(winCounts).forEach(name=>{
    let s=0;
    for(const h of todays){
      if(!(h.players||[]).includes(name))continue;
      if(h.winner===name)s++;else break;
    }
    if(s>bestStreak.len)bestStreak={name,len:s};
  });
  const moments=todays.filter(h=>h.moment).slice(0,3).map(h=>h.moment);
  return{
    date:new Date(),
    games:todays.length,
    standings,
    gamesList,
    gameOfNight,
    streak:bestStreak.len>=2?bestStreak:null,
    moments,
    tableName:G.tableName||'',
  };
}
// The Almanac — a shareable, all-time chronicle of the table (Tonight's Digest only covers
// today). Reuses houseLegends()/rivalries() rather than re-deriving the same stats a second way,
// so it can never drift out of sync with what the Family screen itself shows.
function almanacData(){
  const history=familyHistory();
  if(history.length<3)return null; // same "don't show it hollow" threshold houseLegends() uses
  const winCounts={},nameAvatar={};
  history.forEach(h=>{
    if(h.winner){winCounts[h.winner]=(winCounts[h.winner]||0)+1;}
    if(h.winner&&h.winnerAvatar)nameAvatar[h.winner]=h.winnerAvatar;
  });
  const standings=Object.entries(winCounts).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([name,wins])=>({name,wins,avatar:nameAvatar[name]||'🃏'}));
  const gamesList=[...new Set(history.map(h=>h.game))].map(id=>GAMES.find(g=>g.id===id)?.name||id);
  const legendData=houseLegends();
  const riv=rivalries();
  // Moments deliberately come from getHistory() (this device only), not the family-wide history
  // above -- the synced game_history rows never carry the moment text at all (only winner/players/
  // game sync), so filtering the family-wide list for h.moment would always come back empty.
  const moments=getHistory().filter(h=>h.moment).slice(0,3).map(h=>h.moment);
  const earliest=history[history.length-1]; // history is newest-first, so the last entry is oldest
  return{
    date:new Date(),
    tableName:G.tableName||'',
    totalGames:history.length,
    since:earliest?new Date(earliest.date):null,
    standings,
    gamesList,
    legends:legendData?.legends||[],
    rivalry:riv,
    moments,
  };
}

/* ═══ FAMILY ROSTER (local device, name-matched against history) ═══ */
function getFamily(){try{return JSON.parse(localStorage.getItem('ct_family')||'[]');}catch{return[];}}
function saveFamily(list){localStorage.setItem('ct_family',JSON.stringify(list));}
// Keeps your own Family roster entry (matched by name) in sync with whatever avatar your personal
// profile currently uses -- adds it if you're not there yet. Called both right after saving the
// profile editor and once on every boot, so a stale avatar from before this existed (or from
// picking a new one) self-heals without needing you to manually re-save.
function syncMyFamilyEntry(){
  if(!G.myName)return;
  const family=getFamily();
  const existing=family.find(m=>m.name===G.myName);
  if(existing){if(existing.avatar===G.myAvatar)return;existing.avatar=G.myAvatar;}
  else family.push({name:G.myName,avatar:G.myAvatar});
  saveFamily(family);
}
function familyStats(name){
  const history=familyHistory();
  let games=0,wins=0;
  history.forEach(h=>{
    if((h.players||[]).some(p=>p===name))games++;
    if(h.winner===name)wins++;
  });
  return{games,wins};
}
// Felt & Frame — swaps the felt table's own color; the CSS variables it drives default to the
// original emerald look, so choosing nothing changes nothing. Applied directly to <body> (not through
// render(), which only touches #app) so it survives every re-render without extra plumbing.
const FELT_PREVIEW={emerald:'radial-gradient(circle at 35% 30%,#1a6840,#062018)',burgundy:'radial-gradient(circle at 35% 30%,#7a2438,#1c0810)',midnight:'radial-gradient(circle at 35% 30%,#1c3f6b,#050e1c)',charcoal:'radial-gradient(circle at 35% 30%,#4a4642,#100e0c)'};
const FELT_NAMES={emerald:'Emerald',burgundy:'Burgundy',midnight:'Midnight',charcoal:'Charcoal'};
function applyFeltTheme(theme){
  theme=FELT_PREVIEW[theme]?theme:'emerald';
  G.feltTheme=theme;
  if(theme==='emerald')document.body.removeAttribute('data-felt');
  else document.body.setAttribute('data-felt',theme);
  localStorage.setItem('ct_felt_theme',theme);
}
// The felt gains a subtle patina the more a table's actually been played on -- a small nod to a
// well-worn physical table rather than a screen that looks identical on game 1 and game 200.
// Applied as a filter() on .felt-table itself (not per-theme color literals) so it layers
// consistently over every felt color and every game without needing 4 themes × N tiers hand-tuned.
// Recomputed idempotently on every render() rather than at each of the many G.gp++ call sites, so
// there's exactly one place this logic can ever get out of sync.
function applyTableAge(){
  const tier=G.gp>=80?3:G.gp>=40?2:G.gp>=15?1:0;
  if(tier===0)document.body.removeAttribute('data-table-age');
  else document.body.setAttribute('data-table-age',tier);
}
// Local pass-and-play state only ever lived in memory -- closing the tab mid-hand lost it outright,
// unlike an online room (persisted in Supabase). Checkpoints the whole local game snapshot to
// localStorage on every render() while a local match is actually on the table screen (same
// single-hook-point approach as applyTableAge, rather than touching every mutation site), and
// clears it once the match genuinely ends so a stale "Continue" offer can't linger.
// drawSelections is the one non-JSON-safe field on G (a Set, used transiently during poker's draw
// phase) -- serialized as a plain array and rebuilt as a Set on resume.
function checkpointLocalMatch(){
  if(G.isOnline)return;
  if(G.scr==='table'){
    try{
      const snap={...G,drawSelections:Array.from(G.drawSelections||[])};
      localStorage.setItem('ct_resume',JSON.stringify({ts:Date.now(),snap}));
    }catch(e){}
  } else if(G.scr==='matchend'||G.scr==='yahtzeeend'){
    // Natural match completion -- 'home' is deliberately NOT included here: it's also G.scr's
    // default value on a fresh boot, before the very first render even runs, so treating it as
    // "match over" here would wipe a checkpoint the instant it's written. Explicitly quitting or
    // starting a new game (which do mean "abandon this") clear it directly at those actions instead.
    localStorage.removeItem('ct_resume');
  }
}
function getResumableMatch(){
  try{return JSON.parse(localStorage.getItem('ct_resume')||'null');}catch{return null;}
}
function resumeLocalMatch(){
  const saved=getResumableMatch();if(!saved)return false;
  const drawArr=saved.snap.drawSelections||[];
  Object.assign(G,saved.snap);
  G.drawSelections=new Set(drawArr);
  G.isOnline=false;
  render();
  return true;
}
function familySuggestions(){
  const known=new Set(getFamily().map(m=>m.name));
  const seen=new Set();
  familyHistory().forEach(h=>(h.players||[]).forEach(p=>{if(p&&!known.has(p))seen.add(p);}));
  return Array.from(seen).slice(0,6);
}
// House Legends — a small hall-of-fame, computed only from what's actually recorded (games played,
// wins, per-game wins, "came back" moments, and current streaks). Titles only appear once someone
// genuinely qualifies, so a fresh table with little history just shows nothing rather than a hollow
// "House Champion: Phil (1 win)" the very first time anyone plays.
function houseLegends(){
  const history=familyHistory();
  const family=getFamily();
  if(history.length<3||!family.length)return null;
  const nameAvatar={};
  family.forEach(m=>nameAvatar[m.name]=m.avatar);
  history.forEach(h=>{if(h.winner&&h.winnerAvatar&&!nameAvatar[h.winner])nameAvatar[h.winner]=h.winnerAvatar;});

  const gamesPlayed={},wins={},comebacks={},perGameWins={};
  history.forEach(h=>{
    (h.players||[]).forEach(p=>{gamesPlayed[p]=(gamesPlayed[p]||0)+1;});
    if(h.winner){
      wins[h.winner]=(wins[h.winner]||0)+1;
      (perGameWins[h.game]=perGameWins[h.game]||{})[h.winner]=(perGameWins[h.game][h.winner]||0)+1;
      if(h.moment&&/came back/i.test(h.moment))comebacks[h.winner]=(comebacks[h.winner]||0)+1;
    }
  });

  const legends=[];
  const top=obj=>Object.entries(obj).sort((a,b)=>b[1]-a[1])[0];

  const champ=top(wins);
  if(champ&&champ[1]>=2)legends.push({icon:'🏆',title:'House Champion',name:champ[0],sub:champ[1]+' wins'});

  let sharp=null;
  Object.keys(gamesPlayed).forEach(p=>{
    if(gamesPlayed[p]>=3){const rate=(wins[p]||0)/gamesPlayed[p];if(rate>0&&(!sharp||rate>sharp.rate))sharp={name:p,rate};}
  });
  if(sharp)legends.push({icon:'🎯',title:'Sharpshooter',name:sharp.name,sub:Math.round(sharp.rate*100)+'% win rate'});

  const cb=top(comebacks);
  if(cb)legends.push({icon:'💪',title:'Comeback Royalty',name:cb[0],sub:cb[1]+' comeback'+(cb[1]>1?'s':'')});

  const streaks={};
  Object.keys(gamesPlayed).forEach(p=>{
    let s=0;
    for(const h of history){ // newest-first: count consecutive wins from the most recent game back
      if(!(h.players||[]).includes(p))continue;
      if(h.winner===p)s++;else break;
    }
    if(s>=2)streaks[p]=s;
  });
  const streak=top(streaks);
  if(streak)legends.push({icon:'🔥',title:'On Fire',name:streak[0],sub:streak[1]+'-game win streak'});

  const regular=top(gamesPlayed);
  if(regular&&regular[1]>=4)legends.push({icon:'📅',title:'The Regular',name:regular[0],sub:regular[1]+' games played'});

  return legends.length?{legends,nameAvatar}:null;
}
// The head-to-head record between the two family members who've played together the most —
// computed purely from existing history entries, same "only show it once it means something" rule
// as House Legends (needs at least 3 shared games before a rivalry is worth calling out).
function rivalries(){
  const history=familyHistory();
  const family=getFamily();
  if(family.length<2)return null;
  const nameAvatar={};
  family.forEach(m=>nameAvatar[m.name]=m.avatar);
  history.forEach(h=>{if(h.winner&&h.winnerAvatar&&!nameAvatar[h.winner])nameAvatar[h.winner]=h.winnerAvatar;});

  const names=new Set(family.map(m=>m.name));
  const pairs={};
  history.forEach(h=>{
    const ps=(h.players||[]).filter(p=>names.has(p));
    for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
      const a=ps[i]<ps[j]?ps[i]:ps[j],b=ps[i]<ps[j]?ps[j]:ps[i];
      const key=a+'|'+b;
      const entry=pairs[key]=pairs[key]||{a,b,games:0,aWins:0,bWins:0};
      entry.games++;
      if(h.winner===a)entry.aWins++;else if(h.winner===b)entry.bWins++;
    }
  });
  const best=Object.values(pairs).filter(p=>p.games>=3).sort((x,y)=>y.games-x.games)[0];
  if(!best)return null;
  const leader=best.aWins===best.bWins?null:(best.aWins>best.bWins?best.a:best.b);

const Y_UPPER=['ones','twos','threes','fours','fives','sixes'];
const Y_LOWER=['threeKind','fourKind','fullHouse','smallStraight','largeStraight','yahtzee','chance'];
const Y_CATS=[...Y_UPPER,...Y_LOWER];
const Y_LABELS={ones:'Ones',twos:'Twos',threes:'Threes',fours:'Fours',fives:'Fives',sixes:'Sixes',threeKind:'3 of a Kind',fourKind:'4 of a Kind',fullHouse:'Full House',smallStraight:'Sm. Straight',largeStraight:'Lg. Straight',yahtzee:'Yahtzee',chance:'Chance'};

function lDealYahtzee(){
