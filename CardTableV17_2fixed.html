    actionBar=`<div class="poker-actions">
      <div class="poker-action-row">
        <button class="btn btn-danger btn-sm" data-a="poker-fold">Fold</button>
        ${canCheck?`<button class="btn btn-ghost btn-sm" data-a="poker-check">Check</button>`:`<button class="btn btn-ghost btn-sm" data-a="poker-call">Call ${Math.min(currentBet-p.bet,p.chips)}</button>`}
        <button class="btn btn-gold btn-sm" data-a="poker-raise">Raise</button>
        <button class="btn btn-green btn-sm" data-a="poker-allin">All In</button>
      </div>
      <div class="bet-input-row">
        <input class="bet-inp" type="number" id="bet-inp" value="${G.betInput||minRaise}" min="${minRaise}" max="${p.chips+p.bet}" step="${bigBlind}">
        <button class="btn btn-ghost btn-sm" data-a="poker-raise-set">↑ Raise to</button>
      </div>
    </div>`;
  } else if(isPokerGame&&mine&&pokerPhase==='draw'){
    actionBar=`<div class="poker-actions">
      <div class="poker-action-row">
        <button class="btn btn-gold" data-a="draw">🃏 Draw ${G.drawSelections.size} card${G.drawSelections.size!==1?'s':''}</button>
      </div>
    </div>`;
  }

  return`<div id="s-table" class="scr on ${isPokerGame?'game-poker':'game-mau'}">
    <div class="game-bar">
      <div class="gb-game">${currentGame().icon} ${currentGame().name.split(' ').slice(-1)[0]}</div>
      <div class="gb-turn${mine?' mine':''}">${turnLabel}</div>

    <div class="game-status">
      <span>${dir===1?'↻':'↺'}</span>
      ${top&&curSuit&&gameId==='maumau'?`<span class="suit-badge" style="color:${isRed(curSuit)?'#ff5670':'#f2f2f2'};">${SYM[curSuit]} ${sLbl(curSuit)}</span>`:''}
      ${top&&curSuit&&isUno?`<span class="suit-badge" style="color:${UNO_COLOR_HEX[curSuit]};">● ${sLbl(curSuit)}</span>`:''}
      ${drawPend>0?`<span class="pend-badge">+${drawPend}</span>`:''}
      ${isPokerGame?`<span class="pot-badge">🪙 ${pot} pot</span>`:''}

    <div class="table-event-row" role="status" aria-live="polite" aria-atomic="true">${lastAct?`<div class="table-event">${lastAct}</div>`:''}</div>
    <div class="felt-table${mine?' my-turn':''}">
      <div class="v13-table-caption">${online?'LIVE TABLE':'LOCAL TABLE'} · ${players.length} PLAYERS</div>
      <div class="v13-seats-compact">${players.slice(0,4).map((p,i)=>{const active=online?(i===(state?.curIdx||0)):(i===G.lcur);return `<div class="v13-seat s${i+1}${active?' active':''}">
        <span class="v13-av">${avHTML(p.avatar)}</span><div><div class="v13-name">${esc(p.name)} ${active?'•':''}</div><div class="v13-sub">${p.hand.length} cards${isPokerGame?' · '+p.chips+' chips':''}</div></div>
      </div>`;}).join('')}</div>
      <div class="v13-seats-oval">${(()=>{
        const meIdx=online?Math.max(0,players.findIndex(p=>p.id===G.myPid)):G.lcur;
        const rotated=players.length?[...players.slice(meIdx+1),...players.slice(0,meIdx),players[meIdx]]:[];
        const positions=ovalSeatPositions(rotated.length,40,34,205,335);

}

function rBlackjackTable(){
  const online=G.isOnline,state=online?G.srv:null;
  const players=online?(state?.players||[]):G.lp;
  const dealerHand=online?(state?.dealerHand||[]):G.dealerHand;
  const holeHidden=online?(state?.dealerHoleHidden??true):G.dealerHoleHidden;
  const curIdx=online?(state?.curIdx||0):G.lcur;
  const dv=bjValue(dealerHand);
  const allDone=players.length>0&&players.every(p=>p.bjDone);
  const curP=players[curIdx];
  const mine=online?(curP?.id===G.myPid):true;
  const showActions=!allDone&&curP&&!curP.bjDone&&mine;
  const dealIn=!!G.lDealIn;
  const betAmount=online?(state?.bjBetAmount||50):G.bjBet;

  const dealerCardsHTML=dealerHand.map((c,i)=>{
    if(i===1){
      const cls=holeHidden?'':(!online&&G.dealerRevealAnim?'flip-reveal':'flip-static');
      return`<div class="flip-inner ${cls}" style="width:${TW}px;height:${TH}px;display:inline-block;">
        <div class="flip-face flip-back">${makeBack(TW,TH)}</div>
        <div class="flip-face flip-front">${makeCard(c,TW,TH)}</div>
      </div>`;
    }
    return`<div style="display:inline-block;">${makeCard(c,TW,TH)}</div>`;
  }).join('');
  const dealerTotalLbl=holeHidden?'?':(dv.total>21?'Bust':dv.total);

  const playerRows=players.map((p,i)=>{
    const pv=bjValue(p.bjHand);
    const isActive=showActions&&i===curIdx;
    const cardsHTML=p.bjHand.map((c,ci)=>{
      const dealStyle=dealIn?` style="animation-delay:${Math.min(ci,6)*60+i*90}ms"`:'';
      return`<span class="bj-card${dealIn?' deal-in':''}"${dealStyle}>${makeCard(c,HW,HH)}</span>`;
    }).join('');
    let statusHTML='';
    if(p.bjResult){
      const map={win:'Win +'+p.bjBet,blackjack:'Blackjack! +'+Math.floor(p.bjBet*1.5),push:'Push',lose:'Lose',bust:'Bust'};
      const cls=(p.bjResult==='win'||p.bjResult==='blackjack')?'bj-status win':(p.bjResult==='push'?'bj-status push':'bj-status lose');
      statusHTML=`<span class="${cls}">${map[p.bjResult]}</span>`;
    } else if(p.bjBlackjack){
      statusHTML=`<span class="bj-status win">Blackjack!</span>`;
    } else if(p.bjDone){
      statusHTML=`<span class="bj-status">Stand</span>`;
    }
    return`<div class="bj-player-row${isActive?' active':''}">
      <div class="bj-player-head"><span>${p.avatar} ${esc(p.name)}</span><span class="bj-bet">🪙 ${p.bjBet}</span></div>
      <div class="bj-player-cards">${cardsHTML}</div>
      <div class="bj-player-foot"><span class="bj-total">${pv.total}${pv.soft&&pv.total<=21?' soft':''}</span>${statusHTML}</div>
    </div>`;
  }).join('');

  let actionBar='';
  if(showActions){
    const canDouble=curP.bjHand.length===2&&curP.chips>=curP.bjBet;
    actionBar=`<div class="poker-actions"><div class="poker-action-row">
      <button class="btn btn-danger btn-sm" data-a="bj-stand">Stand</button>
      <button class="btn btn-gold btn-sm" data-a="bj-hit">Hit</button>
      ${canDouble?`<button class="btn btn-green btn-sm" data-a="bj-double">Double</button>`:''}
    </div></div>`;
  }

  return`<div id="s-table" class="scr on game-blackjack">
    <div class="game-bar">
      <div class="gb-game">🎰 Blackjack</div>
      <div class="gb-turn${showActions?' mine':''}">${showActions?(curP.avatar+' '+esc(curP.name)+"’s turn"):(allDone?(holeHidden?'Dealing…':'Dealer plays…'):(online?`${curP?.avatar||''} ${esc(curP?.name||'')}'s turn…`:'Next player…'))}</div>
      <div class="gb-right">${rulesBtn()}${quitBtn()}${sndBtn()}</div>
    </div>
    <div class="game-status"><span class="pot-badge">🪙 Bet ${betAmount}</span></div>
    <div class="felt-table${!allDone?' my-turn':''}" style="flex-direction:column;justify-content:flex-start;padding-top:1.3rem;gap:.5rem;overflow-y:auto;">
      <div class="dealer-label">DEALER</div>
      <div style="display:flex;gap:.5rem;justify-content:center;z-index:1;">${dealerCardsHTML}</div>
      <div style="font-family:var(--serif);font-size:1.1rem;color:var(--gold2);z-index:1;">${dealerTotalLbl}</div>
      <div style="display:flex;flex-direction:column;gap:.5rem;width:100%;padding:0 .8rem;z-index:1;margin-top:.3rem;">${playerRows}</div>
    </div>
    <div class="hint-strip"><div class="hint-txt">${allDone?(holeHidden?'':'Dealer draws to 17…'):(showActions?'Hit, Stand, or Double Down.':(online?'Waiting for '+esc(curP?.name||'the other player')+'…':''))}</div></div>
    ${!allDone&&!showActions?awayIndicatorHTML(curP?.id,curP?.name):''}
    ${actionBar}
    ${talkStripHTML()}
  </div>`;
}

function rRouletteTable(){
  const online=G.isOnline,state=online?G.srv:null;
  const players=online?(state?.players||[]):G.lp;
  const spinning=online?!!state?.roulSpinning:G.roulSpinning;
  const countingDown=online&&!spinning&&!!state?.roulCountdownStartedAt;
  const countdownSecs=countingDown?Math.max(0,Math.ceil((ROUL_COUNTDOWN_MS-(Date.now()-state.roulCountdownStartedAt))/1000)):0;
  // Always the client-local value now, even online — the chase-light animation runs purely
  // client-side (see oRoulChaseAnimate) and onSrv() keeps this synced to the settled server value
  // whenever no spin is in progress, so this works identically for local and online play.
  const highlight=G.roulHighlight;
  const history=online?(state?.roulHistory||[]):(G.roulHistory||[]);
  const me=online?players.find(pl=>pl.id===G.myPid):players[G.lcur];
  if(!me)return`<div class="scr on"><p style="padding:2rem;text-align:center;">Loading…</p></div>`;
  const myBetTotal=Object.values(me.roulBets||{}).reduce((s,a)=>s+a,0);
  const playerPills=players.map((pl,i)=>{
    const betTotal=Object.values(pl.roulBets||{}).reduce((s,a)=>s+a,0);
    const isMe=online?pl.id===G.myPid:i===G.lcur;
    const isAway=online&&isPlayerAbsent(pl.id,AWAY_HINT_MS);
    return`<button class="roul-player-pill${isMe?' active':''}" style="--pc:${roulPlayerColor(i)}" data-a="${online?'':'roul-select'}" data-idx="${i}" aria-label="${online?esc(pl.name)+(isAway?' — may be away':''):'Bet as '+esc(pl.name)}" aria-pressed="${isMe}">
      <span class="roul-pill-dot"></span>${avHTML(pl.avatar)}<span>${esc(pl.name)}</span>
      ${isAway?'<span class="roul-pill-away" title="May be away">💤</span>':''}
      <span class="roul-pill-chips">🪙${pl.chips}</span>
      ${betTotal?`<span class="roul-pill-bet">${betTotal} down</span>`:''}
    </button>`;
  }).join('');
  const historyStrip=history.map(h=>`<span class="roul-hist-num roul-hist-${h.color}">${h.number}</span>`).join('');
  const chipPicker=ROUL_CHIPS.map(v=>`<button class="roul-chip-pick${G.roulChip===v?' active':''}" data-a="roul-chip" data-val="${v}" aria-pressed="${G.roulChip===v}">${v}</button>`).join('');

  const betAmt=key=>players.reduce((s,pl)=>s+((pl.roulBets||{})[key]||0),0);
  const chipBadges=key=>{
    const bd=players.map((pl,i)=>({i,amt:(pl.roulBets||{})[key]||0})).filter(b=>b.amt>0);
    if(!bd.length)return'';
    return`<span class="roul-chip-badges">${bd.map(b=>`<span class="roul-chip-badge-p" style="--pc:${roulPlayerColor(b.i)}">${b.amt}</span>`).join('')}</span>`;
  };
  const numbers=[];
  for(let n=1;n<=36;n++){
    const col=Math.ceil(n/3)+1;
    const row=n%3===0?1:(n%3===1?3:2);
    const color=roulColor(n);
    const t=betAmt('straight:'+n);
    const hl=highlight===n?' roul-highlight':'';

  }

    const row=c===3?1:(c===1?3:2);

    return`<button class="roul-colbet" style="grid-column:14;grid-row:${row};" data-a="roul-bet" data-key="column:${c}" aria-label="Bet on this column, pays 2 to 1${t?', '+t+' chips already on it':''}">2:1${chipBadges('column:'+c)}</button>`;

  }).join('');
  const outsideDefs=[
    {key:'low',label:'1–18',start:2},{key:'even',label:'EVEN',start:4},
    {key:'red',label:'RED',start:6,cls:' roul-outside-red'},{key:'black',label:'BLACK',start:8,cls:' roul-outside-black'},
    {key:'odd',label:'ODD',start:10},{key:'high',label:'19–36',start:12},
  ];
  const outside=outsideDefs.map(o=>{
    const t=betAmt(o.key);
    return`<button class="roul-outside${o.cls||''}" style="grid-column:${o.start}/${o.start+2};grid-row:5;" data-a="roul-bet" data-key="${o.key}" aria-label="Bet on ${o.label}${t?', '+t+' chips already on it':''}">${o.label}${chipBadges(o.key)}</button>`;
  }).join('');
  const zeroT=betAmt('straight:0');
  const zeroHl=highlight===0?' roul-highlight':'';
  const spinStatus=spinning?(highlight!=null?`<div class="roul-spin-status"><span class="roul-spin-dot"></span>${highlight}${roulColor(highlight)!=='green'?' · '+roulColor(highlight):''}</div>`:`<div class="roul-spin-status"><span class="roul-spin-dot"></span>Spinning…</div>`)
    :countingDown?`<div class="roul-spin-status"><span class="roul-spin-dot"></span>Bets close in ${countdownSecs}s…</div>`:'';
  const turnLbl=online?(countingDown?'⏳ Last call — bets close soon!':'🎡 Place your bets'):`${me.avatar} ${esc(me.name)} is betting`;

  return`<div id="s-table" class="scr on game-roulette">
    <div class="game-bar">
      <div class="gb-game">🎡 Roulette</div>
      <div class="gb-turn mine">${turnLbl}</div>
      <div class="gb-right">${rulesBtn()}${quitBtn()}${sndBtn()}</div>

    <div class="roul-history-strip">${historyStrip||'<span class="roul-hist-empty">No spins yet tonight</span>'}</div>
    <div class="roul-player-strip">${playerPills}</div>
    <div class="felt-table" style="flex:0 0 auto;min-height:0;max-height:none;padding:1rem .6rem;overflow-x:auto;justify-content:flex-start;position:relative;">
      ${spinStatus}

        <button class="roul-zero${zeroHl}" style="grid-column:1;grid-row:1/4;" data-a="roul-bet" data-key="straight:0" aria-label="Bet on 0${zeroT?', '+zeroT+' chips already on it':''}">0${chipBadges('straight:0')}</button>
        ${numbers.join('')}
        ${colBets}
        ${dozens}
        ${outside}
      </div>
    </div>
    <div class="roul-controls">
      <div class="roul-chip-row">
        <span class="roul-chip-lbl">Chip</span>${chipPicker}

function roundMoment(r){
  const bd=r.bd||[];
  const winner=bd.find(b=>b.isWinner)||bd[0];
  const runnerUp=bd.find(b=>b!==winner);
  if(G.selGame==='battle'&&G.battleLast&&G.battleLast.warRounds>0){
    return `${esc(winner?.name||'')} battled through ${G.battleLast.warRounds} war${G.battleLast.warRounds>1?'s':''} to win it all!`;
  }
  if(G.selGame==='blackjack'){
    const bj=G.lp.find(p=>p.bjResult==='blackjack');
    if(bj)return `${esc(bj.name)} hit Blackjack!`;
  }
  if(r.roulNumber!=null){
    return bd.some(b=>b.isWinner)?`${esc(winner?.name||'')} called ${r.roulNumber} ${r.roulColor} right!`:`${r.roulNumber} ${r.roulColor} — the house takes this spin.`;
  }
  if(winner&&runnerUp&&typeof winner.total==='number'&&typeof runnerUp.total==='number'){
    const margin=Math.abs(winner.total-runnerUp.total);
    if(margin<=5&&margin>=0)return `A nail-biter — ${esc(winner?.name||'')} edges it out.`;
  }
  return `${esc(winner?.name||'')} takes the round.`;
}

/* ═══════ RENDER HELPERS ═══════ */
// Card pixel sizes, driven off the viewport rather than a fixed constant so they stay right after
// a resize or rotation. Capped at 900 (not 700) to match #app's own max-width for the table screen
// (see the CSS at 650px/1100px breakpoints) — the old 700 cap left cards visibly undersized on the
// 700–1099px band, where the felt table had already grown to fill the wider container.
let TW,TH,HW,HH;
function updateCardSizes(){
  const _vw=Math.min(window.innerWidth||390,900);
  TW=Math.round(_vw*.20);TH=Math.round(TW*1.43);
  HW=Math.round(_vw*.14);HH=Math.round(HW*1.43);
}
updateCardSizes();
let _resizeTid=null,_lastVw=window.innerWidth;
// Card sizing only ever depends on width (see updateCardSizes above), but on iOS the on-screen
// keyboard showing/hiding fires a plain 'resize' event too — it only changes viewport HEIGHT. A
// naive re-render on every resize would nuke and rebuild the entire #app tree the instant someone
// focuses a text input (e.g. the room-code field), destroying that very input mid-focus and
// dismissing the keyboard before it's even shown. Ignoring height-only resizes fixes that without
// losing the real case (rotating the device, resizing a desktop window) this listener exists for.
window.addEventListener('resize',()=>{
  clearTimeout(_resizeTid);
  _resizeTid=setTimeout(()=>{
    if(window.innerWidth===_lastVw)return;
    _lastVw=window.innerWidth;
    updateCardSizes();render();
  },150);
});
window.addEventListener('orientationchange',()=>{_lastVw=window.innerWidth;updateCardSizes();render();});

function matchMoment(sorted){
  const winner=sorted[0];
  const ms=G.matchStats;
  if(ms.comebacks>0)return `${esc(winner?.name||'')} came back to win the table.`;
  if(winner&&(winner.roundsWon||0)>=3)return `${esc(winner?.name||'')} was unstoppable tonight.`;
  return `A great night at the table.`;
}
function rMatchEnd(){
  const players=G.isOnline?(G.srv?.players||[]):G.lp;
  const isBattle=G.selGame==='battle';

  const chipGame=isPoker()||G.selGame==='blackjack'||G.selGame==='roulette';

function v14Intro(id,dealerName,dealerAvatar){

// A proper confetti shower for the win moment: more pieces, varied gold/gem colors, and randomized
// spray angles/distances instead of a fixed 2x4 grid, so no two wins burst identically.
function v14WinnerBurst(){
  const b=document.createElement('div');b.className='winner-burst';
  const glyphs=['♠','♥','♦','♣','✦','✧','★','●'];
  const colors=['#f0cc60','#ead08a','#7ec2f2','#86efac','#f0a8c0','#c99b4e','#fff6dc'];
  for(let i=0;i<20;i++){
    const e=document.createElement('i');
    e.textContent=glyphs[i%glyphs.length];
    e.style.color=colors[i%colors.length];
    const angle=Math.random()*150-75; // upward spray, ±75° off vertical
    const dist=95+Math.random()*170;
    const rad=angle*Math.PI/180;
    e.style.setProperty('--x',`${Math.sin(rad)*dist}px`);
    e.style.setProperty('--y',`${-Math.cos(rad)*dist-40}px`);
    e.style.setProperty('--r',`${Math.random()*360-180}deg`);
    e.style.fontSize=(13+Math.random()*15)+'px';
    e.style.animationDelay=(Math.random()*.15)+'s';
    b.appendChild(e);
  }
  document.body.appendChild(b);setTimeout(()=>b.remove(),1700);
}
// Brief full-screen "crown" flourish on a win — a dim backdrop + centered gold-framed card that
// fades in, holds, then fades away, layered on top of the quicker suit-symbol burst above.
// The Snapshot — composites a captured photo into the app's own gold-frame treatment (matching the
// Wall of Fame portraits) so a real photo of the table becomes part of that win's history entry.
// Downscaled + re-encoded as JPEG so a season of photos doesn't blow past localStorage's quota.
function composePhotoFrame(imgDataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        // No baked-in caption: the frame it lands in (Wall of Fame) is a square object-fit:cover
        // crop, which would just slice a bottom caption off — the plaque below already names the
        // winner, so this only needs the gold border treatment itself.
        const W=480,pad=14;
        const scale=W/img.width;
        const H=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');
        canvas.width=W+pad*2;canvas.height=H+pad*2;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#0c1712';ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,pad,pad,W,H);
        ctx.strokeStyle='#c9a45c';ctx.lineWidth=4;
        ctx.strokeRect(pad-2,pad-2,W+4,H+4);
        resolve(canvas.toDataURL('image/jpeg',.85));
      }catch(e){reject(e);}
    };
    img.onerror=reject;
    img.src=imgDataUrl;
  });
}
// Draws a shareable "Table Digest" card for tonight's games — the same gold-on-felt language as
// the rest of the app, composed on a canvas so it survives being shared out of the app as a plain
// image (WhatsApp, iMessage, etc.) rather than needing a live page to render correctly.
function composeTableDigest(data){
  const W=900;
  const rowH=86,momentLineH=32;
  const standingsH=data.standings.length?60+data.standings.length*rowH:0;
  const gameOfNightH=data.gameOfNight?76:0;
  const streakH=data.streak?100:0;
  const momentsH=data.moments.length?70+data.moments.length*momentLineH*2:0;
  const H=Math.max(900,420+standingsH+gameOfNightH+streakH+momentsH+140);
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');

  // felt background
  const grad=ctx.createRadialGradient(W*0.4,H*0.3,40,W*0.5,H*0.5,H*0.75);
  grad.addColorStop(0,'#1a6840');grad.addColorStop(1,'#062018');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // texture vignette
  const vgrad=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.7);
  vgrad.addColorStop(0,'rgba(0,0,0,0)');vgrad.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=vgrad;ctx.fillRect(0,0,W,H);
  // gold rim
  ctx.strokeStyle='rgba(212,168,67,.7)';ctx.lineWidth=3;
  ctx.strokeRect(18,18,W-36,H-36);
  ctx.strokeStyle='rgba(240,204,96,.28)';ctx.lineWidth=1;
  ctx.strokeRect(26,26,W-52,H-52);

  let y=100;
  ctx.textAlign='center';
  ctx.fillStyle='#ead08a';
  ctx.font='600 22px Jost, sans-serif';
  ctx.save();ctx.letterSpacing='6px';
  ctx.fillText('♠  OUR TABLE  ♠',W/2,y);
  ctx.restore();

  y+=70;
  ctx.fillStyle='#fbf7ed';
  ctx.font='700 52px Cinzel, Georgia, serif';
  const title=data.tableName?data.tableName.toUpperCase():"TONIGHT'S DIGEST";
  ctx.fillText(title,W/2,y);

  y+=48;
  ctx.fillStyle='rgba(251,247,237,.6)';
  ctx.font='400 24px Jost, sans-serif';
  const dateStr=data.date.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  ctx.fillText(dateStr,W/2,y);

  y+=46;
  ctx.strokeStyle='rgba(212,168,67,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W/2-140,y);ctx.lineTo(W/2+140,y);ctx.stroke();

  y+=56;
  ctx.fillStyle='#ead08a';
  ctx.font='700 30px Cinzel, Georgia, serif';
  ctx.fillText(`🎲 ${data.games} game${data.games!==1?'s':''} played`,W/2,y);
  if(data.gamesList.length){
    y+=36;
    ctx.fillStyle='rgba(251,247,237,.55)';
    ctx.font='400 20px Jost, sans-serif';
    ctx.fillText(data.gamesList.join(' · '),W/2,y);
  }

  if(data.gameOfNight){
    y+=54;
    ctx.fillStyle='rgba(212,168,67,.14)';
    ctx.strokeStyle='rgba(212,168,67,.5)';ctx.lineWidth=1.5;
    roundRectPath(ctx,W/2-320,y-38,640,64,16);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#ead08a';
    ctx.font='600 26px Jost, sans-serif';
    ctx.fillText(`⭐ Game of the Night: ${data.gameOfNight.icon} ${data.gameOfNight.name}`,W/2,y);
    y+=48;
  }

  if(data.standings.length){
    y+=64;
    ctx.fillStyle='rgba(251,247,237,.4)';
    ctx.font='600 18px Jost, sans-serif';
    ctx.save();ctx.letterSpacing='4px';
    ctx.fillText('STANDINGS',W/2,y);
    ctx.restore();
    y+=30;
    const medals=['🥇','🥈','🥉'];
    data.standings.forEach((s,i)=>{
      const rowY=y+i*rowH;
      const cardX=W/2-320,cardW=640;
      ctx.fillStyle=i===0?'rgba(212,168,67,.14)':'rgba(255,255,255,.04)';
      ctx.strokeStyle=i===0?'rgba(212,168,67,.5)':'rgba(255,255,255,.08)';
      ctx.lineWidth=1.5;
      roundRectPath(ctx,cardX,rowY,cardW,rowH-16,16);
      ctx.fill();ctx.stroke();
      ctx.textAlign='left';
      ctx.font='40px sans-serif';
      ctx.fillStyle='#fbf7ed';
      ctx.fillText(medals[i]||('#'+(i+1)),cardX+22,rowY+52);
      ctx.font='44px sans-serif';
      ctx.fillText(s.avatar,cardX+100,rowY+54);
      ctx.font='600 30px Jost, sans-serif';
      ctx.fillStyle='#fbf7ed';
      ctx.fillText(s.name,cardX+170,rowY+46);
      ctx.textAlign='right';
      ctx.fillStyle='#ead08a';
      ctx.font='700 26px Jost, sans-serif';
      ctx.fillText(`${s.wins} win${s.wins!==1?'s':''}`,cardX+cardW-24,rowY+46);
      ctx.textAlign='center';
    });
    y+=data.standings.length*rowH;
  }

  if(data.streak){
    y+=44;
    ctx.fillStyle='rgba(230,120,60,.16)';
    ctx.strokeStyle='rgba(230,150,80,.5)';ctx.lineWidth=1.5;
    roundRectPath(ctx,W/2-320,y-40,640,64,16);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#f2c078';
    ctx.font='600 26px Jost, sans-serif';
    ctx.fillText(`🔥 ${data.streak.name} is on a ${data.streak.len}-win streak tonight!`,W/2,y);
    y+=60;
  }

  if(data.moments.length){
    y+=50;
    ctx.fillStyle='rgba(251,247,237,.4)';
    ctx.font='600 18px Jost, sans-serif';
    ctx.save();ctx.letterSpacing='4px';
    ctx.fillText('MOMENTS',W/2,y);
    ctx.restore();
    y+=40;
    ctx.font='italic 24px Jost, sans-serif';
    ctx.fillStyle='rgba(251,247,237,.85)';
    data.moments.forEach(m=>{
      const lines=wrapCanvasText(ctx,'"'+m+'"',W-200);
      lines.forEach(line=>{ctx.fillText(line,W/2,y);y+=momentLineH;});
      y+=momentLineH*0.4;
    });
  }

  // footer
  ctx.strokeStyle='rgba(212,168,67,.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-100,H-70);ctx.lineTo(W/2+100,H-70);ctx.stroke();
  ctx.fillStyle='rgba(251,247,237,.4)';
  ctx.font='500 18px Jost, sans-serif';
  ctx.save();ctx.letterSpacing='3px';
  ctx.fillText('OUR TABLE',W/2,H-40);
  ctx.restore();

  return canvas.toDataURL('image/png');
}

  ctx.beginPath();ctx.moveTo(W/2-100,H-70);ctx.lineTo(W/2+100,H-70);ctx.stroke();
  ctx.fillStyle='rgba(251,247,237,.4)';
  ctx.font='500 18px Jost, sans-serif';
  ctx.save();ctx.letterSpacing='3px';
  ctx.fillText('OUR TABLE',W/2,H-40);
  ctx.restore();

  return canvas.toDataURL('image/png');
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapCanvasText(ctx,text,maxWidth){
  const words=text.split(' ');
  const lines=[];let line='';
  words.forEach(w=>{
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=w;}
    else line=test;
  });
  if(line)lines.push(line);
  return lines;
}

function render(){

  // is currently focused — including a text input mid-keystroke. That's not just a hypothetical:
  // any background render (the family-history fetch resolving, an online-sync tick, a resize
  // debounce) landing while someone's typing a name or room code wipes their focus and in-progress
  // text, which on mobile also dismisses the on-screen keyboard entirely. Capture the focused

/* ════════ CARD DRAG PHYSICS ════════ */
let _dragState=null,_dragPlayedCid=null;
function _cardPointerDown(e){
  const btn=e.target.closest('.hc[data-a="play"]');
  if(!btn||btn.classList.contains('shake'))return;
  _dragState={cid:btn.getAttribute('data-cid'),startX:e.clientX,startY:e.clientY,el:btn,lifting:false,pointerId:e.pointerId};
}
function _cardPointerMove(e){
  if(!_dragState||_dragState.pointerId!==e.pointerId)return;
  const dx=e.clientX-_dragState.startX,dy=e.clientY-_dragState.startY;
  if(!_dragState.lifting){
    if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){
      _dragState.lifting=true;
      _dragState.el.classList.add('dragging');
      try{_dragState.el.setPointerCapture(e.pointerId);}catch(err){}
    } else if(Math.abs(dx)>12){
      _dragState=null;return; // horizontal gesture — leave it to native hand-scroll
    } else return;
  }
  e.preventDefault();
  const lift=Math.max(dy,-140);
  _dragState.el.style.transform=`translateY(${lift}px) scale(${1+Math.min(.08,-lift/1400)})`;
}
function _cardPointerUp(e){
  if(!_dragState||_dragState.pointerId!==e.pointerId)return;
  const ds=_dragState;_dragState=null;
  if(!ds.lifting)return; // plain tap — normal click handler plays the card
  ds.el.classList.remove('dragging');
  ds.el.style.transform='';
  // A real drag gesture happened — the browser will still fire a click on this
  // element next (mousedown+mouseup on the same target fires click regardless of
  // movement), so suppress it whether or not the drag crossed the play threshold.
  _dragPlayedCid=ds.cid;
  setTimeout(()=>{if(_dragPlayedCid===ds.cid)_dragPlayedCid=null;},400);
  const dy=e.clientY-ds.startY;
  if(dy<-55){
    if(G.isOnline)oPlay(ds.cid);else lPlay(ds.cid);
  }
}
document.addEventListener('pointerdown',_cardPointerDown);
document.addEventListener('pointermove',_cardPointerMove,{passive:false});
document.addEventListener('pointerup',_cardPointerUp);
document.addEventListener('pointercancel',()=>{if(_dragState){_dragState.el.classList.remove('dragging');_dragState.el.style.transform='';_dragState=null;}});

  else if(el.getAttribute?.('data-role')==='bjbet'){G.bjBet=Math.max(1,+el.value||50);}
  else if(el.id==='bet-inp'){G.betInput=el.value;}
});

let _tt;
function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),3200);}

/* ═══════ TABLE TALK — emoji reactions + short messages, visible to everyone at the table ═══════ */
// Reaction Storms: when reactions land close together in time — everyone reacting to the same wild
// moment — the table should visibly agree something big just happened, not just show N independent
// floating emoji. A short rolling window of recent reaction timestamps decides when that's true.
let _reactStormTimes=[];
function spawnFloatEmoji(emoji){
  const felt=document.querySelector('.felt-table');if(!felt)return;
  const now=Date.now();
  _reactStormTimes=_reactStormTimes.filter(t=>now-t<2200);
  _reactStormTimes.push(now);
  const isStorm=_reactStormTimes.length>=3;
  const el=document.createElement('div');el.className='float-r'+(isStorm?' storm':'');el.textContent=emoji;
  el.style.cssText=`left:${15+Math.random()*70}%;bottom:20%;`;
  felt.appendChild(el);setTimeout(()=>el.remove(),3300);
  if(isStorm)fxPulse('gold');
}
function spawnTalkBubble(entry){
  const felt=document.querySelector('.felt-table');if(!felt)return;
  let wrap=felt.querySelector('.talk-bubbles');
  if(!wrap){wrap=document.createElement('div');wrap.className='talk-bubbles';wrap.setAttribute('role','log');wrap.setAttribute('aria-live','polite');felt.appendChild(wrap);}
  const el=document.createElement('div');el.className='talk-bubble';
  el.innerHTML=`<span class="talk-bubble-av">${avHTML(entry.avatar)}</span><span class="talk-bubble-name">${esc(entry.name)}</span><span class="talk-bubble-txt">${esc(entry.text)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),4000);
}
// Sends an emoji reaction or a short text message. Local pass-and-play shows it immediately since
// everyone shares one screen; online play round-trips it through the room row so every device sees it.
async function sendTalk(entry){
  const online=G.isOnline;
  const me=online?(G.srv?.players||[]).find(p=>p.id===G.myPid):G.lp[G.lcur];
  const full={id:Date.now()+'_'+Math.random().toString(36).slice(2,7),kind:entry.kind,text:(entry.text||'').slice(0,60),emoji:entry.emoji||'',name:me?.name||G.myName||'Player',avatar:me?.avatar||G.myAvatar||AVATARS[0],ts:Date.now()};
  G.matchStats.reactions++;
  SFX.react();
  // Show it locally right away, independent of the network write below — the sender shouldn't wait
  // on a round trip to see their own reaction.
  if(full.kind==='emoji')spawnFloatEmoji(full.emoji);else spawnTalkBubble(full);
  if(online&&G.roomId){
    _seenTalk.add(full.id);
    // A reaction can be sent by anyone at any moment, independent of whose turn it is — unlike a
    // game move, which only the current player ever writes, so a plain write from a possibly-stale
    // cached G.srv here could silently clobber another action (a bet, a card play, another reaction)
    // that landed a moment earlier, dropping it before it ever reaches the other player. Re-read
    // fresh and retry on collision instead, the same pattern already used for Roulette's
    // any-player-any-time betting.
    for(let i=0;i<5;i++){
      const state=await dbRead(G.roomId);if(!state)return;
      const expectedTs=state._ts;
      state.talk=[...(state.talk||[]),full].slice(-8);
      if(await dbWriteIfUnchanged(G.roomId,expectedTs,state)){G.srv=state;return;}
    }
  }
}
function talkStripHTML(){
  const reacts=['😂','😱','👏','🔥','❤️','🤔','💫','🎉','🙈','🃏'].map(r=>`<button class="rb" data-a="react" data-r="${r}" aria-label="React with ${r}">${r}</button>`).join('');
  const toggle=`<button class="rb talk-toggle${G.talkOpen?' on':''}" data-a="talk-toggle" aria-label="Say something">💬</button>`;
  const compose=G.talkOpen?`<div class="talk-compose">
      <input class="talk-inp" id="talk-input" type="text" maxlength="60" placeholder="Say something…" autocomplete="off" aria-label="Message">
      <button class="talk-send-btn" data-a="talk-send" aria-label="Send">➤</button>
    </div>`:'';
  return`<div class="react-strip">${reacts}${toggle}</div>${compose}`;
}

window.addEventListener('load',()=>{
  applyFeltTheme(localStorage.getItem('ct_felt_theme')||'emerald');
  applyTableAge();
  syncMyFamilyEntry();
  const room=new URLSearchParams(location.search).get('room');
  resumeOnlineSession().then(resumed=>{
    if(resumed)return;
    if(room){
      // Bake the code into G (like every other input's value) rather than poking the DOM element
      // directly — a poked .value survives only until the next render, and the family-history
      // fetch resolving in the background (or any other render trigger) was silently wiping the
      // pre-filled code back to empty before the link-opener ever got to tap Join.
      G.joinCode=room.toUpperCase();G.scr='online';render();
      toast(`Room ${room} — enter your name and tap Join`);
    }
    else{render();maybeShowFirstRunWelcome();}
  });
  loadSupabase(); // background preload so local-game history can sync too, without blocking the UI
  loadFamilyHistory(); // warm the family-wide leaderboard cache so it's ready before anyone opens Family
  // PWA: makes the app installable to a phone/desktop home screen. Requires http(s) — silently
  // no-ops if this file is opened directly (file://) instead of served, which is fine, it just
  // means "install" won't be offered there.
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
});
