function yCounts(dice){const c=[0,0,0,0,0,0,0];dice.forEach(d=>c[d]++);return c;}
function yIsFiveOfKind(dice){return Math.max(...yCounts(dice).slice(1))===5;}
// Raw score a set of dice would earn in a category — ignores the Joker rule (handled separately in
// yScoreForCategory, which needs to know whether this is a bonus Yahtzee).
function yScoreCategory(cat,dice){
  const c=yCounts(dice),sum=dice.reduce((s,d)=>s+d,0),vals=c.slice(1);
  switch(cat){
    case'ones':return c[1]*1; case'twos':return c[2]*2; case'threes':return c[3]*3;
    case'fours':return c[4]*4; case'fives':return c[5]*5; case'sixes':return c[6]*6;
    case'threeKind':return Math.max(...vals)>=3?sum:0;
    case'fourKind':return Math.max(...vals)>=4?sum:0;
    case'fullHouse':return(vals.includes(3)&&vals.includes(2))?25:0;
    case'smallStraight':{const u=new Set(dice);return[[1,2,3,4],[2,3,4,5],[3,4,5,6]].some(r=>r.every(x=>u.has(x)))?30:0;}
    case'largeStraight':{const u=new Set(dice);return[[1,2,3,4,5],[2,3,4,5,6]].some(r=>r.every(x=>u.has(x)))?40:0;}
    case'yahtzee':return Math.max(...vals)===5?50:0;
    case'chance':return sum;
  }
  return 0;
}
// A second (or third...) Yahtzee is worth a +100 bonus and can "Joker" into any open lower-section
// category at full value, even though the dice don't literally form that shape.
function yIsBonusYahtzee(dice,scorecard){return Math.max(...yCounts(dice).slice(1))===5&&scorecard.yahtzee!==null&&scorecard.yahtzee>0;}
function yScoreForCategory(cat,dice,scorecard){
  if(yIsBonusYahtzee(dice,scorecard)&&['fullHouse','smallStraight','largeStraight'].includes(cat)){
    return cat==='fullHouse'?25:cat==='smallStraight'?30:40;
  }
  return yScoreCategory(cat,dice);
}
function yUpperSum(sc){return Y_UPPER.reduce((s,k)=>s+(sc[k]||0),0);}
function yTotalScore(sc){
  const upper=yUpperSum(sc);
  const lower=Y_LOWER.reduce((s,k)=>s+(sc[k]||0),0);
  return upper+(upper>=63?35:0)+lower+(sc.yahtzeeBonus||0);
}
function yScorecardFull(sc){return Y_CATS.every(k=>sc[k]!==null);}

/* ═══════ ROULETTE ENGINE ═══════ */
const ROUL_RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
function roulColor(n){return n===0?'green':(ROUL_RED.has(n)?'red':'black');}
// Physical pocket order on a real European wheel — used only to place the ball at a plausible
// resting spot for the spin animation, not for any game logic (that's pure RNG via rnd(0,36)).
const ROUL_WHEEL_ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const ROUL_CHIPS=[1,5,25,100];
// How long the "last call" betting window stays open online after someone taps Spin, before the
// wheel actually starts — long enough to get one more chip down, short enough not to feel sluggish.
const ROUL_COUNTDOWN_MS=6000;
const ROUL_PLAYER_COLORS=['#e8593e','#3d8bfd','#3ecf8e','#f2a93b','#b06de0','#e0c93e','#3ecfd0','#e874ab'];
function roulPlayerColor(idx){return ROUL_PLAYER_COLORS[idx%ROUL_PLAYER_COLORS.length];}
function roulPayoutMultiplier(key){
  if(key.startsWith('straight:'))return 35;
  if(key.startsWith('dozen:')||key.startsWith('column:'))return 2;
  return 1;
}
function roulBetWins(key,num){
  if(key.startsWith('straight:'))return num===+key.split(':')[1];
  if(key.startsWith('dozen:')){const d=+key.split(':')[1];return num>=((d-1)*12+1)&&num<=d*12;}
  if(key.startsWith('column:')){const c=+key.split(':')[1];return num!==0&&num%3===c%3;}
  if(key==='red')return roulColor(num)==='red';
  if(key==='black')return roulColor(num)==='black';
  if(key==='odd')return num!==0&&num%2===1;
  if(key==='even')return num!==0&&num%2===0;
  if(key==='low')return num>=1&&num<=18;
  if(key==='high')return num>=19&&num<=36;
  return false;
}
function lDealRoulette(){
  G.lp.forEach(p=>{p.roulBets={};p.roulBetLog=[];});
  G.lcur=0;
  G.roulSpinning=false;G.roulResult=null;G.roulActive=true;G.roulHighlight=null;
  G.roulHistory=G.roulHistory||[];

function roulPlaceBet(key){
  const p=G.lp[G.lcur];
  if(G.roulSpinning){toast('Wheel is spinning — wait for it to land');SFX.illegal();return;}
  if(p.chips<G.roulChip){toast('Not enough chips');SFX.illegal();return;}
  p.chips-=G.roulChip;
  p.roulBets[key]=(p.roulBets[key]||0)+G.roulChip;
  p.roulBetLog.push({key,amt:G.roulChip});
  SFX.chip();
  render();
}
function roulUndo(){
  const p=G.lp[G.lcur];
  if(G.roulSpinning){toast('Wheel is spinning — wait for it to land');SFX.illegal();return;}
  const last=p.roulBetLog.pop();
  if(!last)return;
  p.roulBets[last.key]-=last.amt;
  if(p.roulBets[last.key]<=0)delete p.roulBets[last.key];
  p.chips+=last.amt;
  SFX.draw();
  render();
}
function roulClearBets(){
  const p=G.lp[G.lcur];
  if(G.roulSpinning){toast('Wheel is spinning — wait for it to land');SFX.illegal();return;}
  Object.values(p.roulBets).forEach(amt=>{p.chips+=amt;});
  p.roulBets={};p.roulBetLog=[];
  render();
}
function roulSpin(){
  if(G.roulSpinning)return;
  if(!G.lp.some(p=>Object.keys(p.roulBets).length>0)){toast('Place at least one bet first');return;}
  G.roulSpinning=true;
  G.roulHighlight=null;
  SFX.shuffle();
  render();
  roulChaseAnimate(rnd(0,36));
}
// Chases a highlight around the grid in the wheel's real physical order — fast at first, slowing
// down like a ball losing momentum — so the whole table (where the bets actually sit) shows where
// the number "comes from" instead of a generic spinner covering it up. Lands exactly on winNum and
// leaves it lit for a beat before the payout resolves, so the room can react to the number itself
// before the standings screen takes over.
function roulChaseAnimate(winNum){
  const order=ROUL_WHEEL_ORDER;
  const winIdx=order.indexOf(winNum);
  const totalSteps=26;
  const seq=[];
  let idx=mod(winIdx-totalSteps,order.length);
  for(let i=0;i<=totalSteps;i++){seq.push(order[idx]);idx=mod(idx+1,order.length);}
  let i=0;
  const step=()=>{
    G.roulHighlight=seq[i];
    SFX.chip();
    render();
    i++;
    if(i>=seq.length){setTimeout(()=>roulResolve(winNum),1100);return;}
    const progress=i/seq.length;
    setTimeout(step,42+Math.pow(progress,2.4)*230);
  };
  step();
}
function roulResolve(num){
  const color=roulColor(num);
  const bd=G.lp.map(p=>{
    let winnings=0;
    Object.entries(p.roulBets).forEach(([key,amt])=>{
      if(roulBetWins(key,num))winnings+=amt+amt*roulPayoutMultiplier(key);
    });
    const totalBet=Object.values(p.roulBets).reduce((s,a)=>s+a,0);
    p.chips+=winnings;
    if(winnings>totalBet)p.roundsWon=(p.roundsWon||0)+1;
    return{id:p.id,name:p.name,avatar:p.avatar,delta:winnings-totalBet,total:p.chips,isWinner:winnings>totalBet};
  }).sort((a,b)=>b.total-a.total);
  G.roulHistory=[{number:num,color}].concat(G.roulHistory||[]).slice(0,12);
  G.roulSpinning=false;
  G.tw++;localStorage.setItem('ct_tw',G.tw);
  SFX.win();
  if(bd.some(b=>b.isWinner)){v14WinnerBurst();fxPulse('gold');celebrateWin(bd[0].name,bd[0].avatar);}
  const roulMoment=bd[0].isWinner?`${bd[0].name} called it right on ${num} ${color}.`:`The house takes this spin — ${num} ${color}.`;
  addHistory({game:'roulette',winner:bd[0].name,winnerAvatar:bd[0].avatar,date:new Date().toISOString(),players:G.lp.map(p=>p.name),moment:roulMoment,stats:{cardsPlayed:0,comebacks:0,reactions:G.matchStats.reactions}});
  G.lp.forEach(p=>{p.roulBets={};p.roulBetLog=[];});
  G.lres={wName:bd[0].name,wAv:bd[0].avatar,bd,roulNumber:num,roulColor:color};
  // If this spin left at most one player still holding chips, the match is over — nobody else can
  // place another bet, so there's no more game to play, not just a round to replay. Skip straight
  // to the match-end screen (which already ranks players by chips and declares the leader the
  // winner) instead of the normal "Spin again" round-end.
  const stillIn=G.lp.filter(p=>p.chips>0);
  G.scr=(G.lp.length>1&&stillIn.length<=1)?'matchend':'roundend';
  render();
}

/* ═══════ ONLINE ROULETTE ═══════ */
// Roulette has no turn order — every seated player can bet on their own device any time before the
// spin, and any player can pull the trigger once bets are down. So unlike the turn-based online
// games above, there's no isMyTurn() gate here at all, only "not while the wheel is spinning."
// Shared retry loop for the three bet-mutating actions below. `mutate(state)` mutates state in
// place for the local player and returns true to proceed with the write, or false to abort
// silently (e.g. "not enough chips", already spinning). If another player's bet lands in between
// our read and write, the conditional write fails and we simply re-read and re-apply the same
// mutation against the now-current state, rather than overwriting their change.
async function oRoulMutate(mutate){
  for(let i=0;i<5;i++){
    const state=await dbRead(G.roomId);if(!state)return;
    if(state.roulSpinning){if(i===0){toast('Wheel is spinning — wait for it to land');SFX.illegal();}return;}
    const expectedTs=state._ts;
    if(!mutate(state))return;
    onSrv(state); // optimistic local render; corrected by the next real sync if this write loses the race
    if(await dbWriteIfUnchanged(G.roomId,expectedTs,state))return;
  }
  toast('⚠️ Too many players betting at once — try again');
}
async function oRoulPlaceBet(key){
  if(_onlineBusy)return;
  _onlineBusy=true;
  try{
    await oRoulMutate(state=>{
      const p=state.players.find(pl=>pl.id===G.myPid);if(!p)return false;
      if(p.chips<G.roulChip){toast('Not enough chips');SFX.illegal();return false;}
      p.chips-=G.roulChip;
      p.roulBets=p.roulBets||{};p.roulBets[key]=(p.roulBets[key]||0)+G.roulChip;
      p.roulBetLog=p.roulBetLog||[];p.roulBetLog.push({key,amt:G.roulChip});
      SFX.chip();
      return true;
    });
  } finally { _onlineBusy=false; }
}
async function oRoulUndo(){
  if(_onlineBusy)return;
  _onlineBusy=true;
  try{
    await oRoulMutate(state=>{
      const p=state.players.find(pl=>pl.id===G.myPid);if(!p)return false;
      const last=(p.roulBetLog||[]).pop();if(!last)return false;
      p.roulBets[last.key]-=last.amt;
      if(p.roulBets[last.key]<=0)delete p.roulBets[last.key];
      p.chips+=last.amt;
      SFX.draw();
      return true;
    });
  } finally { _onlineBusy=false; }
}
async function oRoulClearBets(){
  if(_onlineBusy)return;
  _onlineBusy=true;
  try{
    await oRoulMutate(state=>{
      const p=state.players.find(pl=>pl.id===G.myPid);if(!p)return false;
      Object.values(p.roulBets||{}).forEach(amt=>{p.chips+=amt;});
      p.roulBets={};p.roulBetLog=[];
      return true;
    });
  } finally { _onlineBusy=false; }
}
// Tapping "SPIN" no longer spins immediately — it opens a brief shared "last call" betting window
// (see oRoulCountdownTick) so a player who's mid-bet on their own device doesn't get cut off just
// because someone else tapped Spin first. This only starts the countdown; oRoulSpin below is what
// actually starts the wheel once it elapses.
async function oRoulStartCountdown(){
  if(_onlineBusy)return;
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state||state.roulSpinning||state.roulCountdownStartedAt)return;
    if(!state.players.some(p=>Object.keys(p.roulBets||{}).length>0)){toast('Place at least one bet first');return;}
    const expectedTs=state._ts;
    state.roulCountdownStartedAt=Date.now();
    if(await dbWriteIfUnchanged(G.roomId,expectedTs,state))onSrv(state);
    // If this lost the race, someone else's bet or countdown-start landed first — the incoming sync
    // will show whatever's actually true now, so there's nothing to retry here.
  } finally { _onlineBusy=false; }
}
// Deliberately uses its own guard rather than _onlineBusy: this can fire automatically (from every
// connected client's own countdown timer, or from the stuck-countdown recovery check below) rather
// than only from a direct user tap, so it must never be blocked by an unrelated bet action that
// happens to be mid-flight on this same client at that instant.
let _roulSpinFinalizing=false;
async function oRoulSpin(expectCountdownAt){
  if(_roulSpinFinalizing)return;
  _roulSpinFinalizing=true;
  try{
    const state=await dbRead(G.roomId);if(!state||state.roulSpinning)return;
    // Stale trigger guard: if the countdown this call was scheduled for has since been superseded
    // (already resolved, or a fresh one started), don't act on it.
    if(expectCountdownAt!=null&&state.roulCountdownStartedAt!==expectCountdownAt)return;
    const expectedTs=state._ts;
    if(!state.players.some(p=>Object.keys(p.roulBets||{}).length>0)){
      // Every bet got pulled back during the countdown (e.g. everyone tapped Clear) — cancel it and
      // return to a normal betting table instead of leaving the countdown frozen at 0 forever.
      state.roulCountdownStartedAt=null;
      if(await dbWriteIfUnchanged(G.roomId,expectedTs,state))onSrv(state);
      return;
    }
    // Only the winning number and a start timestamp go to the database — the chase-light sequence
    // itself is fully deterministic from winNum (same algorithm as the local game), so every
    // connected client (including this one, via its own onSrv call right below) can replay the
    // identical animation purely locally. Earlier this wrote a highlight update to Supabase on every
    // single animation frame, which meant the animation's pacing was really the pacing of a network
    // round-trip, not a smooth timer — exactly the "stops, continues, stops again" stutter this
    // was rebuilt to fix.
    state.roulSpinning=true;state.roulHighlight=null;state.roulSpinStartedAt=Date.now();state.roulSpinWinNum=rnd(0,36);state.roulCountdownStartedAt=null;
    SFX.shuffle();
    // Conditional write: if two clients' timers fire within the same instant, only one write lands,
    // so only one winning number ever gets generated for this spin. The loser does nothing here and
    // picks up the real result through its normal realtime/poll sync instead.
    if(await dbWriteIfUnchanged(G.roomId,expectedTs,state))onSrv(state);
  } finally { _roulSpinFinalizing=false; }
}
// Runs on every connected client once it sees a new roulCountdownStartedAt — re-renders every
// ~250ms so the "Bets close in Ns" readout counts down live and in sync everywhere (all clients are
// counting down from the same shared timestamp), then hands off to oRoulSpin once time's up. Mirrors
// oRoulChaseAnimate's approach of a shared timestamp replayed independently by every client.
let _roulCountdownTickingAt=null;
function oRoulCountdownTick(startedAt){
  if(_roulCountdownTickingAt===startedAt)return;
  _roulCountdownTickingAt=startedAt;
  const tick=()=>{
    if(!(G.isOnline&&G.srv?.gameId==='roulette'&&G.srv?.roulCountdownStartedAt===startedAt&&!G.srv?.roulSpinning))return;
    if(Date.now()-startedAt>=ROUL_COUNTDOWN_MS){oRoulSpin(startedAt);return;}
    render();
    setTimeout(tick,250);
  };
  tick();
}
// Runs entirely client-side — no dbRead/dbWrite per frame — triggered on every connected client by
// onSrv() the moment it sees a new roulSpinStartedAt. Once the sequence finishes, this client
// attempts to resolve the spin; if another client's copy of this same animation gets there first,
// oRoulResolve's own roulSpinning guard makes the loser's attempt a harmless no-op.
let _roulAnimatingSpinAt=null;
function oRoulChaseAnimate(winNum,startedAt){
  if(_roulAnimatingSpinAt===startedAt)return;
  _roulAnimatingSpinAt=startedAt;
  const order=ROUL_WHEEL_ORDER;
  const winIdx=order.indexOf(winNum);
  const totalSteps=26;
  const seq=[];
  let idx=mod(winIdx-totalSteps,order.length);
  for(let i=0;i<=totalSteps;i++){seq.push(order[idx]);idx=mod(idx+1,order.length);}
  let i=0;
  const step=()=>{
    // Bail if this exact spin isn't the current one anymore (already resolved, or a fresher spin
    // started) — stale timers from a backgrounded/slow tab shouldn't clobber a newer highlight.
    if(!(G.isOnline&&G.srv?.gameId==='roulette'&&G.srv?.roulSpinning&&G.srv?.roulSpinStartedAt===startedAt))return;
    G.roulHighlight=seq[i];
    SFX.chip();
    render();
    i++;
    if(i>=seq.length){setTimeout(()=>oRoulResolve(winNum),1100);return;}
    const progress=i/seq.length;
    setTimeout(step,42+Math.pow(progress,2.4)*230);
  };
  step();
}
// Only the client that started a spin drives its chase-animate chain — if that client's tab dies,
// loses network, or gets backgrounded (mobile browsers routinely throttle setTimeout in background
// tabs) partway through, nothing else ever calls oRoulResolve and roulSpinning is stuck true
// forever: the Spin button stays disabled for the whole table with no recovery path. This runs on
// every OTHER connected client's away-tick (every 4s) and, once a spin has been "in progress" for
// implausibly long, has that client finish the round itself with a freshly-rolled number — better
// an unblocked table with one un-animated resolve than a permanently dead room. oRoulResolve's own
// roulSpinning guard keeps this from double-paying if the original chain actually does complete
// around the same moment.
let _roulRecoverChecking=false;
function oRoulCheckStuckSpin(){
  if(_roulRecoverChecking)return;
  if(!(G.isOnline&&G.srv?.gameId==='roulette'))return;
  if(G.srv?.roulSpinning){
    if(Date.now()-(G.srv.roulSpinStartedAt||0)<15000)return;
    _roulRecoverChecking=true;
    dbRead(G.roomId).then(state=>{
      _roulRecoverChecking=false;
      if(!state||!state.roulSpinning)return;
      if(Date.now()-(state.roulSpinStartedAt||0)<15000)return;
      oRoulResolve(rnd(0,36));
    }).catch(()=>{_roulRecoverChecking=false;});
    return;
  }
  // Same idea for a "last call" countdown that never got finalized — e.g. every connected client
  // happened to be busy/backgrounded at the exact instant their own timer would have fired. Gives
  // the normal per-client timers a generous head start (ROUL_COUNTDOWN_MS+4s) before stepping in.
  if(G.srv?.roulCountdownStartedAt){
    if(Date.now()-G.srv.roulCountdownStartedAt<ROUL_COUNTDOWN_MS+4000)return;
    _roulRecoverChecking=true;
    dbRead(G.roomId).then(state=>{
      _roulRecoverChecking=false;
      if(!state||state.roulSpinning||!state.roulCountdownStartedAt)return;
      if(Date.now()-state.roulCountdownStartedAt<ROUL_COUNTDOWN_MS+4000)return;
      oRoulSpin(state.roulCountdownStartedAt);
    }).catch(()=>{_roulRecoverChecking=false;});
  }
}
async function oRoulResolve(num){
  const state=await dbRead(G.roomId);if(!state)return;
  // Guards against a resolve running twice for the same spin — e.g. two players' clients both
  // started a chase-animate chain because of the create/read race in oRoulSpin, or the stuck-spin
  // recovery below firing right as the original chain was already finishing on its own. Once a
  // spin resolves, roulSpinning flips to false and bets are cleared; a second resolve attempt
  // reading that already-settled state would otherwise re-pay winning bets a second time (free
  // chips) or overwrite a correct result with a bogus all-zero one.
  if(!state.roulSpinning)return;
  const color=roulColor(num);
  const bd=state.players.map(p=>{
    let winnings=0;
    Object.entries(p.roulBets||{}).forEach(([key,amt])=>{
      if(roulBetWins(key,num))winnings+=amt+amt*roulPayoutMultiplier(key);
    });
    const totalBet=Object.values(p.roulBets||{}).reduce((s,a)=>s+a,0);
    p.chips+=winnings;
    if(winnings>totalBet)p.roundsWon=(p.roundsWon||0)+1;
    return{id:p.id,name:p.name,avatar:p.avatar,delta:winnings-totalBet,total:p.chips,isWinner:winnings>totalBet};
  }).sort((a,b)=>b.total-a.total);
  state.roulHistory=[{number:num,color}].concat(state.roulHistory||[]).slice(0,12);
  state.roulSpinning=false;state.roulHighlight=num;
  state.players.forEach(p=>{p.roulBets={};p.roulBetLog=[];});
  state.roundResult={wName:bd[0].name,wAv:bd[0].avatar,bd,roulNumber:num,roulColor:color};
  state.winner=bd[0].id;state.winnerName=bd[0].name;state.winnerAv=bd[0].avatar;
  // Same bust-out check as the local game: if at most one player still has chips, nobody left in
  // the room can place another bet, so this is the last spin of the match, not just the round.
  const stillIn=state.players.filter(p=>p.chips>0);
  state.matchOver=state.players.length>1&&stillIn.length<=1;
  state._ts=Date.now();onSrv(state);
  await dbWrite(G.roomId,state);
}

/* ═══════ POKER ENGINE ═══════ */
function lDealPoker(deck,game){
  G.ldeck=deck;G.community=[];G.communityRevealAnim=null;G.pot=0;G.pokerPhase='preflop';
  G.pokerShowdown=false;G.drawSelections=new Set();G.llast='';G.lres=null;
  // Snapshot each player's stack before this hand's blinds/antes/bets touch it, so a side-pot split
  // at showdown can recover exactly how much each player put in over the whole hand (chipsAtHandStart
  // minus current chips) — p.bet alone only tracks the CURRENT street and resets every phase.
  G.lp.forEach(p=>{p.chipsAtHandStart=p.chips;});

  // Deal hands
  const dc=game.deal||2;
  for(let r=0;r<dc;r++)G.lp.forEach(p=>{if(G.ldeck.length)p.hand.push(G.ldeck.pop());});

  // Post blinds for Texas Hold'em
  if(G.selGame==='texas'){
    const n=G.lp.length;
    // Heads-up is a special case: the dealer/button posts the SMALL blind (not the big blind) and
    // acts first preflop — the opposite of every other seat count, where the dealer posts nothing
    // and UTG (left of the big blind) acts first.
    const sbIdx=n===2?G.dealer:mod(G.dealer+1,n);
    const bbIdx=n===2?mod(G.dealer+1,n):mod(G.dealer+2,n);
    const sb=G.lp[sbIdx],bb=G.lp[bbIdx];
    const sbAmt=Math.min(G.smallBlind,sb.chips);
    const bbAmt=Math.min(G.bigBlind,bb.chips);
    sb.chips-=sbAmt;sb.bet=sbAmt;if(sb.chips===0)sb.allIn=true;
    bb.chips-=bbAmt;bb.bet=bbAmt;if(bb.chips===0)bb.allIn=true;
    G.pot=sbAmt+bbAmt;
    G.currentBet=bbAmt;
    G.lcur=n===2?sbIdx:mod(G.dealer+3,n);
  } else {
    G.currentBet=G.bigBlind;
    // Post antes
    G.lp.forEach(p=>{const a=Math.min(G.smallBlind,p.chips);p.chips-=a;p.bet=a;G.pot+=a;if(p.chips===0)p.allIn=true;});
    G.lcur=mod(G.dealer+1,G.lp.length);
  }

  G.lstart=G.lcur;
  SFX.deal();G.scr='table';render();
}

function pokerActivePlayers(){return G.lp.filter(p=>!p.folded&&!p.allIn);}
function pokerAllCalled(){
  const active=G.lp.filter(p=>!p.folded);
  return active.every(p=>p.bet===G.currentBet||p.allIn);
}

function pokerFold(){
  const p=G.lp[G.lcur];p.folded=true;SFX.fold();
  G.llast=esc(p.name)+' folds.';
  const remain=G.lp.filter(p=>!p.folded);
  if(remain.length===1){
    // Only one left — they win the whole pot outright, side pots included (nobody's left to contest them)
    const winner=remain[0];
    winner.chips+=G.pot;winner.roundsWon=(winner.roundsWon||0)+1;
    G.tw++;localStorage.setItem('ct_tw',G.tw);SFX.win();v14WinnerBurst();celebrateWin(winner.name,winner.avatar);
    addHistory({game:G.selGame,winner:winner.name,winnerAvatar:winner.avatar,date:new Date().toISOString(),players:G.lp.map(pl=>pl.name),rules:{bigBlind:G.bigBlind,smallBlind:G.smallBlind},moment:`${winner.name} takes the pot — everyone else folded.`,stats:{cardsPlayed:G.matchStats.cardsPlayed,comebacks:G.matchStats.comebacks,reactions:G.matchStats.reactions}});
    G.lres=buildPokerResult([winner],G.lp,G.pot);
    G.scr='roundend';render();return;
  }
  pokerNextPlayer();
}

function pokerCall(){
  const p=G.lp[G.lcur];
  const toCall=Math.min(G.currentBet-p.bet,p.chips);
  p.chips-=toCall;p.bet+=toCall;G.pot+=toCall;SFX.chip();
  if(p.chips===0){p.allIn=true;pulseTension();}
  G.llast=toCall===0?esc(p.name)+' checks.':(p.allIn?esc(p.name)+' calls all-in for '+toCall+'.':esc(p.name)+' calls '+toCall+'.');
  pokerNextPlayer();
}

function pokerRaise(amt){
  const p=G.lp[G.lcur];
  amt=Math.max(G.currentBet+G.bigBlind,Math.min(amt,p.chips+p.bet));
  const toAdd=amt-p.bet;
  if(toAdd<=0){toast('Raise must be higher than current bet');return;}
  p.chips-=toAdd;p.bet=amt;G.pot+=toAdd;G.currentBet=amt;SFX.chip();
  if(p.chips===0){p.allIn=true;pulseTension();}
  G.llast=p.allIn?esc(p.name)+' is all in for '+amt+'!':esc(p.name)+' raises to '+amt+'.';
  // The raiser becomes the new "closes the action" reference — the round can't complete via the
  // backToStart check in pokerNextPlayer() until action has gone all the way back around to them,
  // giving every other player their turn to respond to the raise.
  G.lstart=G.lcur;
  pokerNextPlayer();
}

function pokerCheck(){
  if(G.lp[G.lcur].bet<G.currentBet){toast('Cannot check — must call or fold');return;}
  G.llast=esc(G.lp[G.lcur].name)+' checks.';SFX.chip();
  pokerNextPlayer();
}

function pokerNextPlayer(){
  const n=G.lp.length;
  // Find next non-folded, non-all-in player
  let next=mod(G.lcur+1,n);
  let tries=0;
  while((G.lp[next].folded||G.lp[next].allIn)&&tries<n){next=mod(next+1,n);tries++;}

  // The betting round is complete once action has cycled all the way back to whoever opened it
  // (G.lstart — the first to act on this street, or the last raiser) without anyone reopening it.
  // A separate "has everyone matched the current bet" check looks appealing but is wrong on any
  // street where nobody has bet yet — right after the very first player checks, every remaining bet
  // already trivially equals currentBet(0), which would close the round before anyone else had a
  // turn. The other closing case is fewer than two players having any chips left to act with (e.g.
  // heads-up with one player all-in) — the skip-loop above then has nowhere else to send `next` but
  // back to whoever just acted, which would otherwise ask them to act on their own action forever.
  const canAct=G.lp.filter(p=>!p.folded&&!p.allIn).length;
  const backToStart=next===G.lstart||tries>=n||canAct<2;

  if(backToStart){
    pokerNextPhase();
  } else {
    G.lcur=next;render();
  }
}

function pokerNextPhase(){
  // Reset bets for new street
  G.lp.forEach(p=>p.bet=0);G.currentBet=0;
  // Once fewer than two contestants can still put in a chip (everyone else is all-in or folded),
  // there's no more betting to be had — the remaining streets run out automatically to showdown,
  // exactly like a real table turning all-in hands face-up and dealing to the river.
  const contestants=G.lp.filter(p=>!p.folded);
  const runout=G.selGame==='texas'&&contestants.filter(p=>!p.allIn).length<2&&contestants.length>1;

  if(G.selGame==='fivecard'){
    if(G.pokerPhase==='preflop'){
      G.pokerPhase='draw';
      G.lcur=mod(G.dealer+1,G.lp.length);
      while(G.lp[G.lcur].folded)G.lcur=mod(G.lcur+1,G.lp.length);
      G.lstart=G.lcur;
      render();return;
    }
    if(G.pokerPhase==='draw2'){G.pokerPhase='showdown';pokerShowdown();return;}
  } else { // texas
    const prevLen=G.community.length;
    if(G.pokerPhase==='preflop'){
      // deal flop (3 cards)
      for(let i=0;i<3;i++)if(G.ldeck.length)G.community.push(G.ldeck.pop());
      G.pokerPhase='flop';
    } else if(G.pokerPhase==='flop'){
      if(G.ldeck.length)G.community.push(G.ldeck.pop());
      G.pokerPhase='turn';
    } else if(G.pokerPhase==='turn'){
      if(G.ldeck.length)G.community.push(G.ldeck.pop());
      G.pokerPhase='river';
    } else if(G.pokerPhase==='river'){
      G.pokerPhase='showdown';pokerShowdown();return;
    }
    const newIdx=[];for(let i=prevLen;i<G.community.length;i++)newIdx.push(i);
    G.communityRevealAnim=newIdx;
    // First to act post-flop: left of dealer
    G.lcur=mod(G.dealer+1,G.lp.length);
    while(G.lp[G.lcur].folded)G.lcur=mod(G.lcur+1,G.lp.length);
    G.lstart=G.lcur;
  }
  SFX.flip();render();
  if(G.communityRevealAnim&&G.communityRevealAnim.length){
    const marker=G.communityRevealAnim;
    setTimeout(()=>{
      if(G.communityRevealAnim===marker){G.communityRevealAnim=null;render();}
      if(runout&&G.pokerPhase!=='showdown')setTimeout(()=>pokerNextPhase(),550);
    },650);
  } else if(runout&&G.pokerPhase!=='showdown'){
    setTimeout(()=>pokerNextPhase(),550);
  }
}

// Splits `players` into one main pot plus a side pot for every distinct all-in level, exactly
// mirroring how a real dealer would stack unequal all-ins: a player who only put in 100 chips can
// never win any part of a pot funded by someone else's 400, even if their hand is best. Folded
// players still count toward every layer their money reached (that's real money in the pot) but are
// never eligible to WIN a pot. Amounts are read from chipsAtHandStart-vs-current-chips rather than
// a running total, so this works regardless of how many streets/raises built the pot.
function computeSidePots(players){
  const contributed=p=>Math.max(0,(p.chipsAtHandStart??p.chips)-p.chips);
  const levels=[...new Set(players.map(contributed).filter(c=>c>0))].sort((a,b)=>a-b);
  let prev=0;const pots=[];
  levels.forEach(level=>{
    const layer=players.filter(p=>contributed(p)>prev);
    const amount=(level-prev)*layer.length;
    if(amount>0)pots.push({amount,eligible:layer.filter(p=>!p.folded)});
    prev=level;
  });
  return pots;
}
// Awards each pot to the best hand(s) among its eligible players, splitting ties evenly (with any
// odd remainder chip going to the earliest-seated tied player). Returns the set of players who won
// at least one pot, for the winner banner/history/roundsWon credit.
function settleSidePots(pots){
  const winnerSet=new Map();
  pots.forEach(pot=>{
    if(!pot.eligible.length)return;
    const bestScore=Math.max(...pot.eligible.map(p=>p.handEval.score));
    const potWinners=pot.eligible.filter(p=>p.handEval.score===bestScore);
    let remainder=pot.amount%potWinners.length;
    const share=Math.floor(pot.amount/potWinners.length);
    potWinners.forEach(p=>{
      const gain=share+(remainder>0?1:0);if(remainder>0)remainder--;
      p.chips+=gain;
      winnerSet.set(p.id,p);
    });
  });
  return[...winnerSet.values()];
}
function pokerShowdown(){
  G.pokerShowdown=true;
  const active=G.lp.filter(p=>!p.folded);
  active.forEach(p=>{
    const cards=G.selGame==='texas'?[...p.hand,...G.community]:p.hand;
    p.handEval=evalHand(cards);
  });
  const pots=computeSidePots(G.lp);
  const winners=settleSidePots(pots);
  winners.forEach(p=>{p.roundsWon=(p.roundsWon||0)+1;});
  G.tw++;localStorage.setItem('ct_tw',G.tw);SFX.win();v14WinnerBurst();
  const primary=winners[0];
  if(primary)celebrateWin(primary.name,primary.avatar);
  const winNames=winners.map(w=>w.name).join(' & ');
  addHistory({game:G.selGame,winner:winNames||'?',winnerAvatar:primary?.avatar,date:new Date().toISOString(),players:G.lp.map(p=>p.name),rules:{bigBlind:G.bigBlind,smallBlind:G.smallBlind},moment:winners.length>1?`${winNames} split the pot.`:`${primary?.name||''} takes the pot.`,stats:{cardsPlayed:G.matchStats.cardsPlayed,comebacks:G.matchStats.comebacks,reactions:G.matchStats.reactions}});
  G.lres=buildPokerResult(winners,G.lp,G.pot);G.scr='roundend';render();
}

function buildPokerResult(winners,players,pot){
  const winnerIds=new Set(winners.map(w=>w.id));
  const bd=players.map(p=>({
    id:p.id,name:p.name,avatar:p.avatar,
    handStr:p.handEval?.name||'',hand:p.hand,folded:p.folded,
    chips:p.chips,isWinner:winnerIds.has(p.id),
    delta:p.chips-(p.chipsAtHandStart??p.chips)
  })).sort((a,b)=>b.chips-a.chips);
  const primary=winners[0];
  return{wName:winners.map(w=>w.name).join(' & ')||'',wAv:primary?.avatar||'',wHand:primary?.handEval?.name||'',bd,pot};
}

function pokerDraw(){
  // Five-card draw: replace selected cards
  const p=G.lp[G.lcur];
  const toDiscard=[...G.drawSelections];
  toDiscard.sort((a,b)=>b-a);
  toDiscard.forEach(i=>{if(p.hand[i])G.ldisc.push(...p.hand.splice(i,1));});
  for(let i=0;i<toDiscard.length;i++){lEnsureDeck();if(G.ldeck.length)p.hand.push(G.ldeck.pop());}
  G.drawSelections=new Set();SFX.deal();
  G.llast=esc(p.name)+' drew '+toDiscard.length+' card'+(toDiscard.length!==1?'s':'.')+'.';
  pokerDrawNext();
}
// Cycles the draw phase through every non-folded player in turn (bets are irrelevant here, so this
// is deliberately separate from pokerNextPlayer's betting-round logic). Once action has gone all
// the way back around to whoever started the draw, it opens the second betting round.
function pokerDrawNext(){
  const n=G.lp.length;
  let next=mod(G.lcur+1,n);
  let tries=0;
  while(G.lp[next].folded&&tries<n){next=mod(next+1,n);tries++;}
  if(next===G.lstart||tries>=n){
    // If fewer than two contestants can still put in another chip (the rest are all-in or folded),
    // there's no second betting round to run — go straight to showdown instead of stranding the
    // table on a phase nobody can act in.
    const contestants=G.lp.filter(p=>!p.folded);
    if(contestants.filter(p=>!p.allIn).length<2&&contestants.length>1){G.pokerPhase='showdown';pokerShowdown();return;}
    G.pokerPhase='draw2';
    G.lp.forEach(pl=>pl.bet=0);G.currentBet=0;
    G.lcur=mod(G.dealer+1,n);
    while(G.lp[G.lcur].folded)G.lcur=mod(G.lcur+1,n);
    G.lstart=G.lcur;
    render();
  } else {
    G.lcur=next;render();
  }
}

/* ═══════ ONLINE POKER ═══════ */
function oPokerBuildDeal(rs,players,dealerIdx){
  const deck=shuffle(buildDeck(1,rs.gameId));
  const dc=rs.gameId==='fivecard'?5:2;
  players.forEach(p=>{p.hand=[];p.folded=false;p.allIn=false;p.chipsAtHandStart=p.chips;p.bet=0;p.handEval=null;});
  for(let r=0;r<dc;r++)players.forEach(p=>{if(deck.length)p.hand.push(deck.pop());});
  const bigBlind=rs.bigBlind||20,smallBlind=rs.smallBlind||10;
  let pot=0,currentBet=0,curIdx=0;
  const n=players.length;
  if(rs.gameId==='texas'){
    const sbIdx=n===2?dealerIdx:mod(dealerIdx+1,n);
    const bbIdx=n===2?mod(dealerIdx+1,n):mod(dealerIdx+2,n);
    const sb=players[sbIdx],bb=players[bbIdx];
    const sbAmt=Math.min(smallBlind,sb.chips);
    const bbAmt=Math.min(bigBlind,bb.chips);
    sb.chips-=sbAmt;sb.bet=sbAmt;if(sb.chips===0)sb.allIn=true;
    bb.chips-=bbAmt;bb.bet=bbAmt;if(bb.chips===0)bb.allIn=true;
    pot=sbAmt+bbAmt;currentBet=bbAmt;
    curIdx=n===2?sbIdx:mod(dealerIdx+3,n);
  } else {
    currentBet=bigBlind;
    players.forEach(p=>{const a=Math.min(smallBlind,p.chips);p.chips-=a;p.bet=a;pot+=a;if(p.chips===0)p.allIn=true;});
    curIdx=mod(dealerIdx+1,n);
  }
  return{deck,pot,currentBet,curIdx,bigBlind,smallBlind};
}
// Mirrors pokerNextPlayer(): finds the next player who still owes an action, or closes the betting
// round once action has cycled all the way back to whoever opened it (state.lstart), or fewer than
// two players have any chips left to act with (e.g. heads-up with one already all-in — the skip-loop
// below then has nowhere else to send `next` but back to whoever just acted); see pokerNextPlayer's
// comment for why an "everyone matched the current bet" shortcut is wrong on any street where nobody
// has bet yet. Returns true if the round closed into a state where a Texas runout should keep
// dealing itself out.
function oPokerAdvanceAfterAction(state){
  const n=state.players.length;
  let next=mod((state.curIdx||0)+1,n);
  let tries=0;
  while((state.players[next].folded||state.players[next].allIn)&&tries<n){next=mod(next+1,n);tries++;}
  const canAct=state.players.filter(p=>!p.folded&&!p.allIn).length;
  const backToStart=next===state.lstart||tries>=n||canAct<2;
  if(backToStart)return oPokerNextPhase(state);
  state.curIdx=next;
  return false;
}
// Mirrors pokerNextPhase(): resets bets, deals the next street/draw phase (or resolves showdown),
// and reports whether the caller should keep auto-advancing (see oPokerAdvanceAfterAction above).
function oPokerNextPhase(state){
  state.players.forEach(p=>p.bet=0);state.currentBet=0;
  const n=state.players.length;
  const contestants=state.players.filter(p=>!p.folded);
  const runout=state.gameId==='texas'&&contestants.filter(p=>!p.allIn).length<2&&contestants.length>1;
  if(state.gameId==='fivecard'){
    if(state.pokerPhase==='preflop'){
      state.pokerPhase='draw';
      state.curIdx=mod((state.dealer||0)+1,n);
      while(state.players[state.curIdx].folded)state.curIdx=mod(state.curIdx+1,n);
      state.lstart=state.curIdx;
      return false;
    }
    if(state.pokerPhase==='draw2'){oPokerRunShowdown(state);return false;}
    return false;
  }
  const prevLen=state.community.length;
  if(state.pokerPhase==='preflop'){for(let i=0;i<3;i++)if(state.deck.length)state.community.push(state.deck.pop());state.pokerPhase='flop';}
  else if(state.pokerPhase==='flop'){if(state.deck.length)state.community.push(state.deck.pop());state.pokerPhase='turn';}
  else if(state.pokerPhase==='turn'){if(state.deck.length)state.community.push(state.deck.pop());state.pokerPhase='river';}
  else if(state.pokerPhase==='river'){oPokerRunShowdown(state);return false;}
  const newIdx=[];for(let i=prevLen;i<state.community.length;i++)newIdx.push(i);
  state.communityRevealAnim=newIdx;
  state.curIdx=mod((state.dealer||0)+1,n);
  while(state.players[state.curIdx].folded)state.curIdx=mod(state.curIdx+1,n);
  state.lstart=state.curIdx;
  return runout;
}
function oPokerRunShowdown(state){
  state.pokerPhase='showdown';
  const active=state.players.filter(p=>!p.folded);
  active.forEach(p=>{
    const cards=state.gameId==='texas'?[...p.hand,...state.community]:p.hand;
    p.handEval=evalHand(cards);
  });
  const pots=computeSidePots(state.players);
  const winners=settleSidePots(pots);
  winners.forEach(p=>{p.roundsWon=(p.roundsWon||0)+1;});
  const primary=winners[0];
  state.winner=primary?.id||null;
  state.winnerName=winners.map(w=>w.name).join(' & ');
  state.winnerAv=primary?.avatar||'';
  state.roundResult=buildPokerResult(winners,state.players,state.pot);
}
// Continues an in-progress Texas runout on its own — driven only by whichever client's action
// closed the betting round, exactly like oBjDealerStep drives out the dealer's hand. Every step is
// a real write, so every other client's onSrv sees each card land in turn.
async function oPokerRunoutStep(){
  const state=await dbRead(G.roomId);if(!state||state.winner)return;
  const contestants=state.players.filter(p=>!p.folded);
  const stillRunout=state.gameId==='texas'&&contestants.filter(p=>!p.allIn).length<2&&contestants.length>1;
  if(!stillRunout)return;
  const again=oPokerNextPhase(state);
  SFX.flip();state._ts=Date.now();onSrv(state);
  await dbWrite(G.roomId,state);
  if(!state.winner&&again)setTimeout(()=>oPokerRunoutStep(),900);
}
async function oPokerFold(){
  if(_onlineBusy)return;
  if(!isMyTurn()){toast('Not your turn');return;}
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state)return;
    const p=state.players[state.curIdx];if(!p||p.folded)return;
    p.folded=true;SFX.fold();
    state.lastAct=esc(p.name)+' folds.';
    const remain=state.players.filter(pl=>!pl.folded);
    if(remain.length===1){
      const winner=remain[0];
      winner.chips+=state.pot;winner.roundsWon=(winner.roundsWon||0)+1;
      state.winner=winner.id;state.winnerName=winner.name;state.winnerAv=winner.avatar;
      state.roundResult=buildPokerResult([winner],state.players,state.pot);
      state._ts=Date.now();onSrv(state);await dbWrite(G.roomId,state);
      return;
    }
    const runout=oPokerAdvanceAfterAction(state);
    state._ts=Date.now();onSrv(state);await dbWrite(G.roomId,state);
    if(runout&&!state.winner)setTimeout(()=>oPokerRunoutStep(),900);
  } finally { _onlineBusy=false; }
}
async function oPokerCheck(){
  if(_onlineBusy)return;
  if(!isMyTurn()){toast('Not your turn');return;}
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state)return;
    const p=state.players[state.curIdx];if(!p)return;
    if(p.bet<state.currentBet){toast('Cannot check — must call or fold');return;}
    state.lastAct=esc(p.name)+' checks.';SFX.chip();
    const runout=oPokerAdvanceAfterAction(state);
    state._ts=Date.now();onSrv(state);await dbWrite(G.roomId,state);
    if(runout&&!state.winner)setTimeout(()=>oPokerRunoutStep(),900);
  } finally { _onlineBusy=false; }
}
async function oPokerCall(){
  if(_onlineBusy)return;
  if(!isMyTurn()){toast('Not your turn');return;}
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state)return;
    const p=state.players[state.curIdx];if(!p)return;
    const toCall=Math.min(state.currentBet-p.bet,p.chips);
    p.chips-=toCall;p.bet+=toCall;state.pot+=toCall;SFX.chip();
    if(p.chips===0){p.allIn=true;pulseTension();}
    state.lastAct=toCall===0?esc(p.name)+' checks.':(p.allIn?esc(p.name)+' calls all-in for '+toCall+'.':esc(p.name)+' calls '+toCall+'.');
    const runout=oPokerAdvanceAfterAction(state);
    state._ts=Date.now();onSrv(state);await dbWrite(G.roomId,state);
    if(runout&&!state.winner)setTimeout(()=>oPokerRunoutStep(),900);
  } finally { _onlineBusy=false; }
}
async function oPokerRaise(amt){
  if(_onlineBusy)return;
  if(!isMyTurn()){toast('Not your turn');return;}
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state)return;
    const p=state.players[state.curIdx];if(!p)return;
    amt=Math.max(state.currentBet+state.bigBlind,Math.min(amt,p.chips+p.bet));
    const toAdd=amt-p.bet;
    if(toAdd<=0){toast('Raise must be higher than current bet');return;}
    p.chips-=toAdd;p.bet=amt;state.pot+=toAdd;state.currentBet=amt;SFX.chip();
    if(p.chips===0){p.allIn=true;pulseTension();}
    state.lastAct=p.allIn?esc(p.name)+' is all in for '+amt+'!':esc(p.name)+' raises to '+amt+'.';
    state.lstart=state.curIdx;
    const runout=oPokerAdvanceAfterAction(state);
    state._ts=Date.now();onSrv(state);await dbWrite(G.roomId,state);
    if(runout&&!state.winner)setTimeout(()=>oPokerRunoutStep(),900);
  } finally { _onlineBusy=false; }
}
async function oPokerDraw(){
  if(_onlineBusy)return;
  if(!isMyTurn()){toast('Not your turn');return;}
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state)return;
    const p=state.players[state.curIdx];if(!p)return;
    const toDiscard=[...G.drawSelections];
    toDiscard.sort((a,b)=>b-a);
    toDiscard.forEach(i=>{if(p.hand[i])p.hand.splice(i,1);});
    for(let i=0;i<toDiscard.length;i++){if(state.deck.length)p.hand.push(state.deck.pop());}
    G.drawSelections=new Set();SFX.deal();
    state.lastAct=esc(p.name)+' drew '+toDiscard.length+' card'+(toDiscard.length!==1?'s':'.')+'.';
    const n=state.players.length;
    let next=mod(state.curIdx+1,n),tries=0;
    while(state.players[next].folded&&tries<n){next=mod(next+1,n);tries++;}
    if(next===state.lstart||tries>=n){
      const contestants=state.players.filter(pl=>!pl.folded);
      if(contestants.filter(pl=>!pl.allIn).length<2&&contestants.length>1){
        oPokerRunShowdown(state);
      } else {
        state.pokerPhase='draw2';
        state.players.forEach(pl=>pl.bet=0);state.currentBet=0;
        state.curIdx=mod((state.dealer||0)+1,n);
        while(state.players[state.curIdx].folded)state.curIdx=mod(state.curIdx+1,n);
        state.lstart=state.curIdx;
      }
    } else {
      state.curIdx=next;
    }
    state._ts=Date.now();onSrv(state);await dbWrite(G.roomId,state);
  } finally { _onlineBusy=false; }
}

/* ═══════ BLACKJACK ENGINE ═══════ */
function bjValue(hand){
  let total=0,aces=0;
  hand.forEach(c=>{
    if(c.rank==='A'){aces++;total+=11;}
    else if(c.rank==='K'||c.rank==='Q'||c.rank==='J')total+=10;
    else total+=+c.rank;
  });
  while(total>21&&aces>0){total-=10;aces--;}
  return{total,soft:aces>0&&total!==21?true:aces>0};
}
function lDealBlackjack(deck){
  G.ldeck=deck;G.dealerHand=[];G.dealerHoleHidden=true;G.lres=null;G.llast='';
  G.lp.forEach(p=>{
    p.bjHand=[];p.bjDone=false;p.bjBust=false;p.bjBlackjack=false;p.bjResult=null;p.bjNet=0;p.bjDoubled=false;
    p.bjBet=Math.min(G.bjBet||50,p.chips);
    p.chips-=p.bjBet;
  });
  for(let r=0;r<2;r++){
    G.lp.forEach(p=>{if(G.ldeck.length)p.bjHand.push(G.ldeck.pop());});
    if(G.ldeck.length)G.dealerHand.push(G.ldeck.pop());
  }
  G.lp.forEach((p,i)=>{if(bjValue(p.bjHand).total===21){p.bjBlackjack=true;p.bjDone=true;setTimeout(()=>{fxPulse('gold');fxSeatGlow(i,'gold');},1150);}});
  SFX.deal();
  const firstIdx=G.lp.findIndex(p=>!p.bjDone);
  G.lcur=firstIdx>=0?firstIdx:0;
  G.scr='table';
  G.lDealIn=true;setTimeout(()=>{G.lDealIn=false;render();},1100);
  if(firstIdx<0)setTimeout(bjDealerPlay,900);
}
function bjHit(){
  if(G.lthrowing)return;
  const p=G.lp[G.lcur];if(!p||p.bjDone)return;
  if(G.ldeck.length)p.bjHand.push(G.ldeck.pop());
  SFX.draw();G.matchStats.cardsPlayed++;
  const v=bjValue(p.bjHand);
  if(v.total>=21){if(v.total>21){p.bjBust=true;SFX.bust();fxPulse('red');fxSeatGlow(G.lcur,'red');}p.bjDone=true;render();setTimeout(bjAdvance,500);}
  else render();
}
function bjStand(){
  if(G.lthrowing)return;
  const p=G.lp[G.lcur];if(!p||p.bjDone)return;
  p.bjDone=true;bjAdvance();
}
function bjDouble(){
  if(G.lthrowing)return;
  const p=G.lp[G.lcur];if(!p||p.bjDone)return;
  if(p.chips<p.bjBet||p.bjHand.length!==2)return;
  p.chips-=p.bjBet;p.bjBet*=2;p.bjDoubled=true;
  if(G.ldeck.length)p.bjHand.push(G.ldeck.pop());
  SFX.draw();G.matchStats.cardsPlayed++;
  if(bjValue(p.bjHand).total>21){p.bjBust=true;SFX.bust();fxPulse('red');fxSeatGlow(G.lcur,'red');}
  p.bjDone=true;render();setTimeout(bjAdvance,500);
}
function bjAdvance(){
  const n=G.lp.length;let next=-1;
  for(let k=1;k<=n;k++){const idx=mod(G.lcur+k,n);if(!G.lp[idx].bjDone){next=idx;break;}}
  if(next<0)bjDealerPlay();
  else{G.lcur=next;render();}
}
function bjDealerPlay(){
  G.dealerHoleHidden=false;G.dealerRevealAnim=true;SFX.flip();pulseTension();render();
  setTimeout(()=>{G.dealerRevealAnim=false;render();},700);
  setTimeout(bjDealerStep,900);
}
function bjDealerStep(){
  const v=bjValue(G.dealerHand);
  if(v.total<17){
    if(G.ldeck.length)G.dealerHand.push(G.ldeck.pop());
    SFX.draw();render();
    setTimeout(bjDealerStep,650);
  } else bjResolve();
}
function bjResolve(){
  const dv=bjValue(G.dealerHand);
  const dealerBust=dv.total>21;
  const dealerBJ=dv.total===21&&G.dealerHand.length===2;
  G.lp.forEach(p=>{
    const pv=bjValue(p.bjHand);
    let result,payout;

function oBjBuildDeal(rs,players){
  const deck=shuffle(buildDeck(1,rs.gameId));
  const bet=rs.bjBetAmount||50;
  players.forEach(p=>{
    p.bjHand=[];p.bjDone=false;p.bjBust=false;p.bjBlackjack=false;p.bjResult=null;p.bjNet=0;p.bjDoubled=false;
    p.bjBet=Math.min(bet,p.chips);
    p.chips-=p.bjBet;
  });
  const dealerHand=[];
  for(let r=0;r<2;r++){
    players.forEach(p=>{if(deck.length)p.bjHand.push(deck.pop());});
    if(deck.length)dealerHand.push(deck.pop());
  }
  players.forEach(p=>{if(bjValue(p.bjHand).total===21){p.bjBlackjack=true;p.bjDone=true;}});
  const firstIdx=players.findIndex(p=>!p.bjDone);
  return{deck,dealerHand,curIdx:firstIdx>=0?firstIdx:0,allDoneAtDeal:firstIdx<0};
}
function oBjAdvanceTurn(state){
  const n=state.players.length;
  for(let k=1;k<=n;k++){
    const idx=mod((state.curIdx||0)+k,n);

  }
  return true;
}

function lPassTurn(){
  G.ldrawnCount=0;
  if(G.lskip8){G.lskip8=false;G.llast=esc(G.lp[G.lcur].name)+' is skipped.';SFX.draw();}
  lAdvance(null);
}

function lAdvance(played,steps){
  steps=steps||1;
  const n=G.lp.length;G.ldrawnCount=0;
  G.lcur=mod(G.lcur+G.ldir*steps,n);
  const cur=G.lp[G.lcur];
  var msg=cur.avatar+' '+esc(cur.name);
  if(G.lpend>0)msg+=' ('+G.lpend+' cards to draw or play a 7)';
  else if(G.lskip8)msg+=' (must play an 8 or pass)';
  G.lpass1=msg;G.lpass2=G.llast;G.llast='';G.scr='pass';render();
}
// Uno's turn-advance is a variable number of steps (Skip/Draw Two/Wild Draw Four skip the next
// player entirely — 2 steps instead of 1) and, for Draw Two/Wild Draw Four, applies the forced
// draw to that skipped player immediately, rather than deferring it to their own turn the way Mau
// Mau's stackable 7s do — official Uno has no stacking, so there's nothing to defer.
function uAdvance(card){
  const n=G.lp.length;
  let steps=1;
  if(card.value==='reverse'){
    G.ldir*=-1;
    if(n===2)steps=2; // in a 2-player game, Reverse acts exactly like Skip
  } else if(card.value==='skip'){
    steps=2;
  } else if(card.value==='draw2'||card.value==='wild4'){
    const victim=G.lp[mod(G.lcur+G.ldir,n)];
    lDrawN(victim,card.value==='draw2'?2:4);
    G.llast=(G.llast?G.llast+' ':'')+esc(victim.name)+' draws '+(card.value==='draw2'?2:4)+' and is skipped.';
    steps=2;
  }
  lAdvance(card,steps);
}

  render();lResolve(card);

function lEndRound(winner){
  SFX.win();v14WinnerBurst();celebrateWin(winner.name,winner.avatar);fxPulse('gold');G.tw++;localStorage.setItem('ct_tw',G.tw);
  const wIdx=G.lp.findIndex(p=>p.id===winner.id);if(wIdx>=0)fxSeatGlow(wIdx,'gold');
  const valFn=G.selGame==='uno'?unoCardVal:cardVal;
  const bd=G.lp.map(p=>{let delta;if(p.id===winner.id){delta=100;p.roundsWon++;}else{delta=-p.hand.reduce((s,c)=>s+valFn(c),0);}p.totalScore+=delta;return{id:p.id,name:p.name,avatar:p.avatar,delta,total:p.totalScore,isWinner:p.id===winner.id};}).sort((a,b)=>b.total-a.total);
  if(isComeback(bd))G.matchStats.comebacks++;
  const mmMoment=isComeback(bd)?`${winner.name} came back to win the round.`:(bd.length>=2&&Math.abs(bd[0].total-bd[1].total)<=5?`A nail-biter — ${winner.name} edges it out.`:`${winner.name} takes the round.`);
  addHistory({game:G.selGame,winner:winner.name,winnerAvatar:winner.avatar,date:new Date().toISOString(),players:G.lp.map(p=>p.name),rules:G.hr,moment:mmMoment,stats:{cardsPlayed:G.matchStats.cardsPlayed,comebacks:G.matchStats.comebacks,reactions:G.matchStats.reactions}});

function lMauTimer(player,card,callWord='Mau!',label='Mau'){
  const DUR=5000;
  G.lmau={pid:player.id,card,dur:DUR,callWord,label};render();

function lResolve(card){
  const p=G.lp[G.lcur];
  if(p.hand.length===0){
    if(G.selGame==='maumau'&&G.hr.mauAnn&&card&&card.rank==='J'){lMauTimer(p,card,'Mau Mau!','Mau Mau');return;}
    lEndRound(p);return;
  }
  if(G.selGame==='maumau'&&G.hr.mauAnn&&p.hand.length===1){lMauTimer(p,card,'Mau!','Mau');return;}
  if(G.selGame==='uno'&&p.hand.length===1){lMauTimer(p,card,'Uno!','Uno');return;}
  if(G.selGame==='uno'){uAdvance(card);return;}
  lAdvance(card);
}

function lPlay(cid){
  if(isPoker())return;
  if(G.lthrowing)return;
  const p=G.lp[G.lcur];const idx=p.hand.findIndex(c=>c.id===cid);if(idx<0)return;
  const card=p.hand[idx];
  if(!lCanPlay(card)){
    const msg=lIllegal(card);
    if(msg) toast('❌ '+msg);
    G.lshake=cid;SFX.illegal();render();
    setTimeout(()=>{G.lshake=null;render();},500);
    return;
  }
  SFX.play();p.hand.splice(idx,1);G.ldisc.push(card);G.llast='';G.matchStats.cardsPlayed++;
  G.lshowThrow=card.id;
  if(G.selGame==='maumau'){
    if(card.rank==='7'){G.lpend+=2;fxPulse('red');}    // 7: nächster zieht 2 (stapelbar)
    if(card.rank==='8'){G.lskip8=true;fxPulse('amber');} // 8: nächster setzt aus
    if(card.rank==='J'&&G.hr.jackWild!==false){ // Bube: Allesleger + Farbwechsel
      G.lspick=true;G.lpcard=card;render();return;
    }
    G.lsuit=card.suit;
  } else if(G.selGame==='uno'){
    if(card.color==='black'){ // Wild / Wild Draw Four: choose the next color before resolving
      G.lspick=true;G.lpcard=card;render();return;
    }
    G.lsuit=card.color;
    if(unoIsAction(card))fxPulse(card.value==='draw2'?'red':'amber');
  }
  // Show the card landing on the discard pile before advancing/switching screens
  G.lthrowing=true;render();
  setTimeout(()=>{G.lthrowing=false;G.lshowThrow=null;fxRipple();lResolve(card);},380);
}
function lDrawCard(){
  if(G.lthrowing)return;
  if(isPoker()&&G.pokerPhase==='draw'){pokerDraw();return;}
  const p=G.lp[G.lcur];
  if(G.lskip8){G.lskip8=false;G.llast=esc(p.name)+' is skipped.';SFX.draw();lAdvance(null);return;}
  if(G.lpend>0){const n=G.lpend;lDrawN(p,n);G.lpend=0;G.ldrawnCount=n;G.llast=esc(p.name)+' draws '+n+' cards.';SFX.draw();render();return;}
  lDrawN(p,1);G.ldrawnCount=1;G.llast=esc(p.name)+' draws a card.';SFX.draw();render();
}

function oCanPlay(card,state){
  if(state.gameId==='uno'){
    const top=state.discard[state.discard.length-1];
    if(!top)return true;
    if(card.color==='black')return true;
    return card.color===state.curSuit||card.value===top.value;
  }
  if(state.gameId&&state.gameId!=='maumau')return true;
  const top=state.discard[state.discard.length-1];
  if(state.drawPend>0)return card.rank==='7'&&state.hr?.draw2stack!==false;
  if(state.skip8Pend)return card.rank==='8'&&state.hr?.eightReverse!==false;
  if(card.rank==='J'){
    if(state.hr?.jackWild===false)return!top||card.suit===state.curSuit||card.rank===top.rank;
    if(top&&top.rank==='J')return false;
    return true;
  }
  if(!top)return true;
  return card.suit===state.curSuit||card.rank===top.rank;
}
function oAdvance(state,played){
  const n=state.players.length;
  state.curIdx=mod((state.curIdx||0)+(state.dir||1),n);
  state.oDrawnCount=0;
}
// Mirrors lEndRound's scoring: winner +100, everyone else loses the value of the cards left in
// hand. The local game applies this in lEndRound; the online path previously never did, so a
// synced Mau Mau match's standings/roundsWon stayed frozen at their starting value round after round.
function mauMauApplyScore(state){
  state.players.forEach(p=>{
    const delta=p.id===state.winner?100:-p.hand.reduce((s,c)=>s+cardVal(c),0);
    p.totalScore=(p.totalScore||0)+delta;
    if(p.id===state.winner)p.roundsWon=(p.roundsWon||0)+1;
  });
}

        // Wait for the wild-suit pick before resolving a win/Mau — winning off a Jack still
        // requires calling "Mau-Mau!" (resolved in oSuit, once the suit choice is in), matching
        // the local game's order of operations.
        state.needsSuit=true;
        state._ts=Date.now();onSrv(state); // optimistic: show my own move instantly, don't wait for the round-trip
        await dbWrite(G.roomId,state);
        return;
      }
      state.curSuit=card.suit;
    } else if(state.gameId==='uno'){
      if(card.color==='black'){ // Wild / Wild Draw Four: wait for the color pick before resolving
        state.needsSuit=true;
        state._ts=Date.now();onSrv(state);
        await dbWrite(G.roomId,state);
        return;
      }
      state.curSuit=card.color;
      state.needsSuit=false;
      oUnoResolve(state,player,card);
      state._ts=Date.now();onSrv(state);
      await dbWrite(G.roomId,state);
      return;
    }
    state.needsSuit=false;
    oResolveMau(state,player,false);
    state._ts=Date.now();onSrv(state);
    await dbWrite(G.roomId,state);

}
async function oDraw(){
  if(_onlineBusy)return;
  if(!isMyTurn()){toast('Not your turn');return;}
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state)return;
    const player=state.players.find(p=>p.id===G.myPid);if(!player)return;
    if(state.skip8Pend){
      state.skip8Pend=false;state.lastAct=player.avatar+' '+esc(player.name)+' passes.';SFX.draw();oAdvance(state,null);
      state._ts=Date.now();onSrv(state);
      await dbWrite(G.roomId,state);
      return;
    }
    const n=state.drawPend>0?state.drawPend:1;
    for(let i=0;i<n;i++){if(!state.deck.length){if(state.discard.length<=1)break;const top=state.discard.pop();state.deck=shuffle(state.discard);state.discard=[top];}if(state.deck.length)player.hand.push(state.deck.pop());}
    state.lastAct=player.avatar+' '+esc(player.name)+' drew '+n+' card'+(n>1?'s.':'.');state.drawPend=0;SFX.draw();

    // the player can play the card they just drew, or explicitly continue (oPassTurn).
    state.oDrawnCount=n;
    state._ts=Date.now();onSrv(state);
    await dbWrite(G.roomId,state);
  } finally { _onlineBusy=false; }
}
async function oPassTurn(){

  _onlineBusy=true;

}
async function oSuit(suit){
  if(_onlineBusy)return;
  _onlineBusy=true;
  try{
    const state=await dbRead(G.roomId);if(!state)return;
    state.curSuit=suit;state.needsSuit=false;
    const player=state.players.find(p=>p.id===G.myPid);
    if(state.gameId==='uno'){
      // Reaching a color pick always means the just-played card (still on top of the discard) was
      // a Wild or Wild Draw Four — need that card to know whether to also apply Wild Draw Four's
      // forced-draw-and-skip once the color choice is in.
      const card=state.discard[state.discard.length-1];
      if(player)oUnoResolve(state,player,card);
    } else if(player){
      // Reaching a suit pick always means a Jack was just played, so an empty hand here is the
      // "last card was a Jack" case and requires the Mau-Mau! call.
      oResolveMau(state,player,true);
    }
    state._ts=Date.now();onSrv(state);
    await dbWrite(G.roomId,state);
  } finally { _onlineBusy=false; }
}
// Shared win/Mau resolution for online Mau Mau — mirrors the local game's lResolve: an empty hand
// only needs a "Mau-Mau!" call if the winning card was a Jack (otherwise it's an instant win);
// exactly one card left always needs a "Mau!" call. wasJack is only ever true from oSuit, since
// that's the only path reached after playing a Jack.
function oResolveMau(state,player,wasJack){
  const mauOn=state.hr?.mauAnn!==false;
  if(player.hand.length===0){
    if(wasJack&&mauOn){
      state.mauPend={pid:player.id,name:player.name,avatar:player.avatar,callWord:'Mau Mau!',label:'Mau Mau',deadline:Date.now()+5000};
    } else {
      state.winner=player.id;state.winnerName=player.name;state.winnerAv=player.avatar;mauMauApplyScore(state);
    }
  } else if(player.hand.length===1&&mauOn){
    state.mauPend={pid:player.id,name:player.name,avatar:player.avatar,callWord:'Mau!',label:'Mau',deadline:Date.now()+5000};
  } else {
    oAdvance(state,null);
  }
}
function oDrawN(state,player,n){
  for(let i=0;i<n;i++){
    if(!state.deck.length){if(state.discard.length<=1)break;const top=state.discard.pop();state.deck=shuffle(state.discard);state.discard=[top];}
    if(state.deck.length)player.hand.push(state.deck.pop());
  }
}
function unoApplyScore(state){
  state.players.forEach(p=>{
    const delta=p.id===state.winner?100:-p.hand.reduce((s,c)=>s+unoCardVal(c),0);
    p.totalScore=(p.totalScore||0)+delta;
    if(p.id===state.winner)p.roundsWon=(p.roundsWon||0)+1;
  });
}
// Mirrors the local game's uAdvance: Skip/Draw Two/Wild Draw Four skip the next player (2 steps),
// Reverse flips direction (and acts as a Skip in a 2-player game), Draw Two/Wild Draw Four also
// apply their forced draw to the skipped player immediately rather than deferring it.
function oUnoAdvance(state,card){
  const n=state.players.length;
  let steps=1;
  if(card.value==='reverse'){
    state.dir=(state.dir||1)*-1;
    if(n===2)steps=2;
  } else if(card.value==='skip'){
    steps=2;
  } else if(card.value==='draw2'||card.value==='wild4'){
    const victim=state.players[mod((state.curIdx||0)+(state.dir||1),n)];
    oDrawN(state,victim,card.value==='draw2'?2:4);
    state.lastAct=(state.lastAct?state.lastAct+' ':'')+esc(victim.name)+' draws '+(card.value==='draw2'?2:4)+' and is skipped.';
    steps=2;
  }
  state.curIdx=mod((state.curIdx||0)+(state.dir||1)*steps,n);
  state.oDrawnCount=0;
}
// Shared win/Uno-call resolution for online Uno — mirrors lResolve: empty hand wins outright (no
// extra call needed the way a Jack-won Mau Mau round needs "Mau-Mau!"), exactly one card left
// needs "Uno!". card is kept on mauPend so oMauBtn/oMauTimeoutCheck can still apply Skip/Reverse/
// Draw Two/Wild Draw Four's effect once the call is resolved, the same edge case the local game's
// lMauTimer/lMauBtn needed fixing for.
function oUnoResolve(state,player,card){
  if(player.hand.length===0){
    state.winner=player.id;state.winnerName=player.name;state.winnerAv=player.avatar;unoApplyScore(state);
  } else if(player.hand.length===1){
    state.mauPend={pid:player.id,name:player.name,avatar:player.avatar,callWord:'Uno!',label:'Uno',card};
    state.mauPend.deadline=Date.now()+5000;
  } else {
    oUnoAdvance(state,card);
  }
}
// Tapping "Mau!"/"Mau-Mau!" in time — only the pending player's own tap can resolve it.
async function oMauBtn(){

// Only the pending player's own client enforces their own call deadline (the same trust model
// every other online action already uses — nobody else writes state on your behalf). If they miss
// it, apply the same 2-card penalty the local game gives, then move on.
let _oMauSig=null;
function oMauTimeoutCheck(sig){

  (async()=>{
    if(_onlineBusy)return;
    const state=await dbRead(G.roomId);if(!state||!state.mauPend||state.mauPend.pid!==G.myPid)return;
    if(state.mauPend.deadline>Date.now())return;
    const player=state.players.find(p=>p.id===G.myPid);
    const label=state.mauPend.label;
    const pendCard=state.mauPend.card;
    state.mauPend=null;
    if(player){oDrawN(state,player,2);state.lastAct=player.avatar+' '+esc(player.name)+' forgot to call '+label+'! +2 cards.';}
    if(state.gameId==='uno'&&pendCard)oUnoAdvance(state,pendCard);
    else oAdvance(state,null);

    await dbWrite(G.roomId,state);

}
function onSrv(state){

function makeCard(card,w,h,extraClass){
  extraClass=extraClass||'';
  var red=isRed(card.suit), sym=SYM[card.suit], r=card.rank;
  var isFace='JQK'.includes(r), INK=red?'#b21f2d':'#18201c';
  var cr=Math.round(w*.09), isSpecial=['7','8','J'].includes(r);
  var borderColor=isSpecial?'#c7a75d':'#c9c1b2', borderW=isSpecial?1.8:1;
  var rFs=Math.round(h*.115), sFs=Math.round(h*.078), padX=Math.round(w*.09), padY=Math.round(h*.032);
  var badgeW=Math.round(w*.30), badgeH=padY+rFs+sFs+Math.round(h*.028);
  var pad=Math.round(w*.08);
  var uid='v13_'+String(card.id||r+sym)+w+h+Math.random().toString(36).slice(2,6);
  var tl='<text x="'+pad+'" y="'+(pad+rFs)+'" font-family="Playfair Display,Georgia,serif" font-size="'+rFs+'" font-weight="900" fill="'+INK+'" text-anchor="start">'+r+'</text>'
    +'<text x="'+pad+'" y="'+(pad+rFs+sFs+2)+'" font-family="Georgia,serif" font-size="'+sFs+'" fill="'+INK+'" text-anchor="start">'+sym+'</text>';
  var br='<text x="'+(w-pad)+'" y="'+(h-pad-sFs-2)+'" font-family="Georgia,serif" font-size="'+sFs+'" fill="'+INK+'" text-anchor="end">'+sym+'</text>'
    +'<text x="'+(w-pad)+'" y="'+(h-pad)+'" font-family="Playfair Display,Georgia,serif" font-size="'+rFs+'" font-weight="900" fill="'+INK+'" text-anchor="end">'+r+'</text>';
  var center='';
  var clipId=uid+'_clip';
  if(isFace){
    var fW=Math.round(w*.78), fH=Math.round(h*.78);
    var fX=Math.round((w-fW)/2), fY=Math.round(h*.13);
    center='<rect width="'+w+'" height="'+h+'" fill="#ffffff"/>'
      +'<image href="'+FACE_IMG[r]+'" x="'+fX+'" y="'+fY+'" width="'+fW+'" height="'+fH+'" preserveAspectRatio="xMidYMin meet"/>';
  }else if(r==='A'){
    center='<circle cx="'+(w/2)+'" cy="'+(h/2)+'" r="'+Math.round(w*.26)+'" fill="'+(red?'#fff1ef':'#f1f3ee')+'" opacity=".72"/>'
      +'<text x="'+(w/2)+'" y="'+(h/2)+'" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif" font-size="'+Math.round(h*.42)+'" fill="'+INK+'">'+sym+'</text>';
  }else{
    var grid=PIPS[r]||[], pipFs=r==='10'?Math.round(h*.13):r==='9'?Math.round(h*.135):Math.round(h*.14);
    var insetX=Math.round(w*.12), insetT=badgeH+Math.round(h*.01), areaW=w-insetX*2, areaH=h-insetT*2;
    center=grid.map(function(pip){
      var cpx=(insetX+areaW*pip[0]/100).toFixed(1), cpy=(insetT+areaH*pip[1]/100).toFixed(1);
      var rot=pip[2]?' transform="rotate(180 '+cpx+' '+cpy+')"':'';
      return '<text x="'+cpx+'" y="'+cpy+'" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif" font-size="'+pipFs+'" fill="'+INK+'"'+rot+'>'+sym+'</text>';
    }).join('');
  }
  return '<span class="v13-card-wrap" style="display:inline-block;line-height:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));">'
    +'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"'+(extraClass?' class="'+extraClass+'"':'')+' style="display:block;flex-shrink:0;border-radius:'+cr+'px;">'
    +'<defs><linearGradient id="'+uid+'_g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#fbf9f3"/><stop offset="1" stop-color="#eee8db"/></linearGradient><filter id="'+uid+'_shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".24"/></filter><clipPath id="'+clipId+'"><rect width="'+w+'" height="'+h+'" rx="'+cr+'" ry="'+cr+'"/></clipPath></defs>'
    +'<g clip-path="url(#'+clipId+')"><rect width="'+w+'" height="'+h+'" fill="#ffffff"/>'+center+tl+br+'</g>'
    +'<rect x="'+(borderW/2)+'" y="'+(borderW/2)+'" width="'+(w-borderW)+'" height="'+(h-borderW)+'" rx="'+cr+'" fill="none" stroke="'+borderColor+'" stroke-width="'+borderW+'"/>'
    +'<rect x="4" y="4" width="'+(w-8)+'" height="'+(h-8)+'" rx="'+Math.max(1,cr-3)+'" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1"/>'
    +'</svg></span>';
}

function makeBack(w,h,extraClass){
  extraClass=extraClass||'';
  var cr=Math.round(w*.09),uid='bk'+w+'x'+h;
  return '<span class="'+extraClass+'" style="display:inline-block;flex-shrink:0;line-height:0;">'
    +'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="display:block;border-radius:'+cr+'px;">'
    +'<defs><pattern id="'+uid+'p" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    +'<rect width="12" height="12" fill="#1a1f6e"/><rect x="0" y="0" width="6" height="12" fill="#1e2478" opacity=".7"/>'
    +'</pattern><clipPath id="'+uid+'c"><rect width="'+w+'" height="'+h+'" rx="'+cr+'" ry="'+cr+'"/></clipPath></defs>'
    +'<g clip-path="url(#'+uid+'c)"><rect width="'+w+'" height="'+h+'" fill="url(#'+uid+'p)"/>'
    +'<rect x="'+Math.round(w*.07)+'" y="'+Math.round(h*.05)+'" width="'+Math.round(w*.86)+'" height="'+Math.round(h*.90)+'" rx="'+Math.round(cr*.6)+'" fill="none" stroke="rgba(212,168,67,.35)" stroke-width="1"/>'
    +'<text x="'+(w/2)+'" y="'+(h/2)+'" text-anchor="middle" dominant-baseline="central" font-family="serif" font-size="'+Math.round(h*.22)+'" fill="rgba(212,168,67,.18)">&#9830;</text>'
    +'</g><rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" rx="'+cr+'" fill="none" stroke="rgba(212,168,67,.9)" stroke-width="1.5"/>'
    +'</svg></span>';
}
function makeUnoCard(card,w,h,extraClass){
  extraClass=extraClass||'';
  const bg=UNO_COLOR_HEX[card.color]||'#1c1c1c';
  const SYMS={skip:'⊘',reverse:'⇄',draw2:'+2',wild:'★',wild4:'+4'};
  const label=SYMS[card.value]||card.value;
  const cr=Math.round(w*.09), fs=Math.round(h*.32), cFs=Math.round(h*.13);
  const uid='uno'+String(card.id||card.color+card.value)+w+h;
  const isWild=card.color==='black';
  // Yellow is the one color where the usual treatment (card's own hue for the center pip on white,
  // plain white for the corner numerals on the card's own background) fails contrast badly — yellow
  // on white and white on yellow both land around ~1.7:1, well under WCAG's 3:1 minimum for large
  // text. Every other color is dark enough that white/self-color both read fine, so only yellow
  // needs an override.
  const isYellow=card.color==='yellow';
  const centerFill=isWild?'#222':(isYellow?'#4a3600':bg);
  const cornerFill=isYellow?'#332600':'#fff';
  const wildSlices=isWild?['red','blue','yellow','green'].map((c,i)=>{
    const x=i%2===0?0:w/2, y=i<2?0:h/2;
    return `<rect x="${x}" y="${y}" width="${w/2}" height="${h/2}" fill="${UNO_COLOR_HEX[c]}"/>`;
  }).join(''):'';
  return `<span class="${extraClass}" style="display:inline-block;flex-shrink:0;line-height:0;">
    <svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;border-radius:${cr}px;">
      <defs><clipPath id="${uid}c"><rect width="${w}" height="${h}" rx="${cr}" ry="${cr}"/></clipPath></defs>
      <g clip-path="url(#${uid}c)">
        <rect width="${w}" height="${h}" fill="${bg}"/>
        ${wildSlices}
        <ellipse cx="${w/2}" cy="${h/2}" rx="${w*.4}" ry="${h*.6}" fill="#fff" transform="rotate(-18 ${w/2} ${h/2})"/>
        <text x="${w/2}" y="${h/2}" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-weight="900" font-size="${fs}" fill="${centerFill}">${label}</text>
        <text x="${Math.round(w*.12)}" y="${Math.round(h*.2)}" font-family="Arial,sans-serif" font-weight="800" font-size="${cFs}" fill="${cornerFill}">${label}</text>
        <text x="${Math.round(w*.88)}" y="${Math.round(h*.93)}" text-anchor="end" font-family="Arial,sans-serif" font-weight="800" font-size="${cFs}" fill="${cornerFill}">${label}</text>
      </g>
      <rect x="1" y="1" width="${w-2}" height="${h-2}" rx="${cr}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>
    </svg>
  </span>`;
}

function rTrophies(){
  const unlocked=getAchievements();
  const earnedCount=ACHIEVEMENTS.filter(a=>a.id in unlocked).length;
  const total=ACHIEVEMENTS.length;
  const pct=total?Math.round(earnedCount/total*100):0;
  // Progress is read once per achievement here and reused for both the card and the "closest to
  // earning" nudge below, so the two can't disagree about how far along you are.
  const withProg=ACHIEVEMENTS.map(a=>{
    const earned=a.id in unlocked;
    let prog=null;
    if(!earned&&a.progress&&!a.secret){
      try{const p=a.progress();if(p&&p.max>0)prog={cur:Math.max(0,Math.min(p.cur,p.max)),max:p.max};}catch(e){}
    }
    return{a,earned,prog,when:unlocked[a.id]||null};
  });
  // Surface the single nearest unearned trophy as a nudge — a gallery that just lists everything
  // is a reference; one that tells you what's within reach is a reason to deal another hand.
  const next=withProg.filter(t=>!t.earned&&t.prog&&t.prog.cur>0)
    .sort((x,y)=>(y.prog.cur/y.prog.max)-(x.prog.cur/x.prog.max))[0];
  const nextLine=next?`Closest: <b>${esc(next.a.name)}</b> — ${next.prog.cur} of ${next.prog.max}`
    :(earnedCount===total?'Every trophy on the shelf. Remarkable.':'Play a hand and the shelf starts filling in.');
  const R=20,CIRC=2*Math.PI*R;
  const ring=`<div class="trophy-ring">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="trophyGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#765d2d"/><stop offset="1" stop-color="#ead08a"/></linearGradient></defs>
        <circle class="trophy-ring-track" cx="24" cy="24" r="${R}"></circle>
        <circle class="trophy-ring-fill" cx="24" cy="24" r="${R}" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="${(CIRC*(1-earnedCount/total)).toFixed(1)}"></circle>
      </svg>
      <span class="trophy-ring-pct">${pct}%</span>
    </div>`;
  const cards=withProg.map(({a,earned,prog,when})=>{
    // A locked secret shows its shape but never its goal — that's the whole point of it being secret.
    const hidden=a.secret&&!earned;
    const ico=hidden?'🔒':a.icon;
    const name=hidden?'???':a.name;
    const desc=hidden?'A hidden trophy — you\'ll know it when you earn it.':a.desc;
    let foot='';
    if(earned){
      const d=when?new Date(when):null;
      const valid=d&&!isNaN(d.getTime());
      foot=`<div class="trophy-earned-on">${valid?'Earned '+d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'Earned'}</div>`;
    } else if(prog){
      foot=`<div class="trophy-bar"><div class="trophy-bar-fill" style="width:${(prog.cur/prog.max*100).toFixed(1)}%;"></div></div>
        <div class="trophy-bar-lbl">${prog.cur} / ${prog.max}</div>`;
    }
    return`<div class="trophy-card ${earned?'earned':'locked'}${hidden?' trophy-secret':''}">
      <div class="trophy-ico">${ico}</div>
      <div class="trophy-name">${esc(name)}</div>
      <div class="trophy-desc">${esc(desc)}</div>
      ${foot}
    </div>`;
  }).join('');
  return`<div id="s-trophies" class="scr on" style="padding:1.8rem 2.2rem;overflow-y:auto;">
    <div style="font-family:var(--serif);font-size:1.9rem;color:var(--paper);margin-bottom:.2rem;">The Trophy Room</div>
    <div style="font-size:.82rem;color:var(--paper3);margin-bottom:1.5rem;">Everything this table has earned — and everything still out there.</div>
    <div class="trophy-summary">
      ${ring}
      <div class="trophy-summary-body">
        <div class="trophy-summary-title">${earnedCount} of ${total} earned</div>
        <div class="trophy-summary-sub">Earned by this table — pass-and-play means you win these together.</div>
        <div class="trophy-summary-next">${nextLine}</div>
      </div>
    </div>
    <div class="trophy-grid">${cards}</div>
  </div>`;
}

    {id:'trophies',ico:'♛',label:'Trophies',enabled:true,soon:false},

/* ════════ SPATIAL OVAL TABLE (desktop) ════════ */
function ovalSeatPositions(n,rx,ry,arcFrom,arcTo){
  if(n<=0)return[];
  if(n===1)return[{left:50,top:84}];
  const k=n-1,pts=[];
  for(let i=0;i<k;i++){
    const a=k===1?(arcFrom+arcTo)/2:arcFrom+i*(arcTo-arcFrom)/(k-1);
    const r=a*Math.PI/180;
    pts.push({left:+(50+rx*Math.cos(r)).toFixed(2),top:+(50+ry*Math.sin(r)).toFixed(2)});
  }
  pts.push({left:50,top:84});
  return pts;
}

/* ════════ TABLE ════════ */
function rTable(){
  const _tblGameId=G.isOnline?(G.srv?.gameId||G.selGame):G.selGame;
  if(_tblGameId==='blackjack')return rBlackjackTable();
  if(_tblGameId==='battle')return rBattleTable();
  if(_tblGameId==='yahtzee')return rYahtzeeTable();
  if(_tblGameId==='roulette')return rRouletteTable();
  const online=G.isOnline,state=online?G.srv:null;
  const cur=curPlayer(),mine=isMyTurn();
  const myPl=online?myPlayer():G.lp[G.lcur];
  const myHand=myPl?.hand||[];
  const discard=online?(state?.discard||[]):G.ldisc;
  const curSuit=online?(state?.curSuit):G.lsuit;
  const drawPend=online?(state?.drawPend||0):G.lpend;
  const deck=online?(state?.deck||[]):G.ldeck;
  const dir=online?(state?.dir||1):G.ldir;
  const round=online?(state?.round||1):G.lround;
  const lastAct=online?(state?.lastAct||''):G.llast;
  const top=discard[discard.length-1];
  const players=online?(state?.players||[]):G.lp;
  const gameId=online?(state?.gameId||'maumau'):G.selGame;
  const isPokerGame=gameId==='texas'||gameId==='fivecard';
  const community=online?(state?.community||[]):G.community;
  const pokerPhase=online?(state?.pokerPhase||'preflop'):G.pokerPhase;
  const pot=online?(state?.pot||0):G.pot;
  const currentBet=online?(state?.currentBet||0):G.currentBet;
  const bigBlind=online?(state?.bigBlind||20):G.bigBlind;
  const communityRevealAnim=online?(state?.communityRevealAnim||null):G.communityRevealAnim;
  const isUno=gameId==='uno';
  const cardFn=isUno?makeUnoCard:makeCard;

  // Hand strength for poker
  let handStr='';
  if(isPokerGame&&myHand.length>=2){
    const cards=gameId==='texas'&&community.length?[...myHand,...community]:myHand;
    if(cards.length>=5){const ev=evalHand(cards);handStr=ev.name;}
    else if(cards.length>=2){
      // show partial evaluation
      const h=evalHand(cards);handStr=h.name;
    }
  }

  const pills=players.map((p,i)=>{
    const active=online?(i===(state?.curIdx||0)):(i===G.lcur);
    const folded=p.folded;
    return`<div class="opp-pill${active?' active':''}${folded?' folded':''}">
      <span class="opp-pill-av">${avHTML(p.avatar)}</span>
      <span class="opp-pill-cnt">${p.hand.length}</span>
      ${isPokerGame?`<span class="opp-pill-chips">${p.chips}c</span>`:''}
    </div>`;
  }).join('');

  const turnLabel=online?(mine?'⭐ Your turn!':`${cur?.avatar||''} ${esc(cur?.name||'')}`):`${myPl?.avatar||''} ${esc(myPl?.name||'')}`;
  const legalExists=!online?myHand.some(c=>lCanPlay(c)):mine&&myHand.some(c=>oCanPlay(c,state||{}));

  const ldrawn=mine&&(online?(state?.oDrawnCount>0):G.ldrawnCount>0);
  let hint='';
  if(!online&&mine&&G.lskip8){
    const hasEight=myHand.some(c=>c.rank==='8');
    hint=hasEight
      ?'<div class="hint-txt">Play an 8 to pass the skip on, or <button class="btn-pass" data-a="pass-turn">Continue ▶</button></div>'
      :'<div class="hint-txt">No 8 to play — you\'re skipped. <button class="btn-pass" data-a="pass-turn">Continue ▶</button></div>';
  }
  else if(ldrawn){hint='<div class="hint-txt">Drew a card — play it or <button class="btn-pass" data-a="pass-turn">Continue ▶</button></div>';}
  else if(online&&mine&&drawPend===0&&state?.skip8Pend){
    const hasEight=myHand.some(c=>c.rank==='8');
    hint=hasEight?'<div class="hint-txt">Play an 8 to pass the skip on, or tap the pile to pass.</div>':'<div class="hint-txt">No 8 to play — tap the pile to pass the skip.</div>';
  }
  else if(online&&!mine)hint=`<div class="hint-txt">${cur?.avatar||''} ${esc(cur?.name||'')}'s turn…</div>`;
  else if(lastAct&&!lastAct.includes('❌'))hint=`<div class="hint-txt">${lastAct}</div>`;
  else if(drawPend>0&&(mine||!online))hint=`<div class="hint-txt">Draw ${drawPend} cards or play a 7.</div>`;

  // Poker-specific hints
  if(isPokerGame&&mine){
    if(pokerPhase==='draw')hint=`<div class="hint-ok">Tap cards to discard, then tap Draw. (0 = keep all)</div>`;

  }

  // Discard pile or community cards
  let tableArea='';
  if(isPokerGame){
    const slots=Array.from({length:5},(_,i)=>{
      const c=community[i];
      const revealed=!!c;
      const justRevealed=revealed&&communityRevealAnim&&communityRevealAnim.includes(i);
      const flipClass=justRevealed?'flip-reveal':(revealed?'flip-static':'');
      return`<div class="community-slot${revealed?' revealed':''}" style="width:${TW}px;height:${TH}px;">
        <div class="flip-inner ${flipClass}">
          <div class="flip-face flip-back">${makeBack(TW,TH)}</div>
          <div class="flip-face flip-front">${c?makeCard(c,TW,TH):''}</div>
        </div>
      </div>`;
    }).join('');
    const potHtml=`<div class="v13-pot">🪙 ${pot} · POT</div>`;
    tableArea=`${gameId==='texas'?`<div class="community-row" style="gap:.5rem;">${slots}</div>${potHtml}`:`<div style="display:flex;flex-direction:column;align-items:center;gap:.6rem;z-index:1;">${potHtml}<div style="font-size:.75rem;color:rgba(248,240,224,.45);text-transform:uppercase;letter-spacing:.12em;">${pokerPhase==='draw'?'Draw Phase':pokerPhase==='preflop'?'Pre-Flop':pokerPhase==='draw2'?'Final Betting':'Betting'}</div></div>`}`;
  } else {
    // Discard pile: wrap cards with explicit positioning inline
    const discPrev = discard.length>=2
      ? `<div style="position:absolute;top:0;left:0;transform:rotate(-6deg);transform-origin:center center;opacity:.7;z-index:0;">${cardFn(discard[discard.length-2],TW,TH)}</div>`

      ? `<div class="jack-suit-badge" style="color:${isRed(curSuit)?'#ff5670':'#f2f2f2'}">${SYM[curSuit]}</div>`

      ? `<div class="jack-suit-badge" style="background:${UNO_COLOR_HEX[curSuit]};width:1.5rem;height:1.5rem;"></div>`
      : '';
    const discTop = top
      ? `<div style="position:relative;z-index:1;transform:rotate(1.5deg);transform-origin:center center;"><div class="${G.lshowThrow===top.id?'card-throw':''}">${cardFn(top,TW,TH)}</div>${jackSuitBadge}</div>`
      : `<div style="width:${TW}px;height:${TH}px;border-radius:10px;border:2px dashed rgba(255,255,255,.15);opacity:.4;"></div>`;
    const discHTML = discPrev + discTop;
    tableArea=`<div class="pile-row">
      <div class="table-pile">
        <div class="draw-wrap" data-a="draw" role="button" tabindex="0" aria-label="Draw a card" ${online&&!mine?'style="pointer-events:none;opacity:.45;"':''}>

      </div>
      <div class="table-pile">
        <div class="disc-pile" style="position:relative;width:${TW}px;height:${TH}px;flex-shrink:0;min-height:${TH}px;">${discHTML}</div>
        <div class="table-pile-lbl">Discard</div>
      </div>
    </div>`;
  }

  // Hand
  const isDraw=isPokerGame&&pokerPhase==='draw'&&mine;

  const beginnerHint=G.beginnerMode&&(gameId==='maumau'||isUno)&&mine&&!G.lspick;

    const playable=beginnerHint&&(online?oCanPlay(c,state||{}):lCanPlay(c));
    const cardLabel=isUno?unoCardLabel(c):`${c.rank} of ${c.suit}`;
    return`<button class="hc${shaking?' shake':''}${selected?' selected':''}${dealIn?' deal-in':''}${playable?' playable':''}" data-a="play" data-cid="${c.id}" aria-label="${cardLabel}${playable?', playable':''}"${dealStyle}>${cardFn(c,HW,HH)}</button>`;
  }).join('');

  // Poker action buttons
  let actionBar='';
  if(isPokerGame&&mine&&pokerPhase!=='draw'&&pokerPhase!=='showdown'){
    const p=myPl;const canCheck=p.bet>=currentBet;
