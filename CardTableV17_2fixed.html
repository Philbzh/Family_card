<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>OUR TABLE — Family Card Games</title>
<meta name="description" content="Beautiful card games for family and friends — wherever everyone happens to be.">
<meta name="theme-color" content="#08110e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Our Table">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
// Supabase loaded lazily only when online play is requested
window._sbFailed=false;
function loadSupabase(cb){
  if(window.supabase){if(cb)cb();return;}
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.crossOrigin='anonymous';
  s.onload=function(){if(cb)cb();};
  s.onerror=function(){window._sbFailed=true;if(cb)cb();};
  document.head.appendChild(s);
}
</script>
<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  --bg:#08110e; --bg2:#0d1915; --bg3:#17251f;
  --felt:#123d2b; --felt2:#0c3022; --felt3:#061d14;
  --gold:#c9a45c; --gold2:#ead08a; --gold3:#765d2d;
  --paper:#fbf7ed; --paper2:#d8cfbd; --paper3:#8e887d;
  --red:#b92b42; --navy:#182b3b;
  --green-acc:#22c55e; --red-acc:#ef4444;
  --serif:'Cinzel',Georgia,serif;
  --sans:'Jost',-apple-system,sans-serif;
  --ease-spring:cubic-bezier(.22,.68,0,1.3);
  --ease-smooth:cubic-bezier(.4,0,.2,1);
  /* Felt & Frame — the felt table's own color, overridden per-theme below. Defaults reproduce the
     original emerald/gold look exactly, so nothing changes unless a theme is actually chosen. */
  --felt-a:#1a6840; --felt-b:#0e4028; --felt-c:#062018;
  --rim-rgb:212,168,67; --rim-bright-rgb:240,204,96;
}
body[data-felt="burgundy"]{--felt-a:#7a2438;--felt-b:#4a1526;--felt-c:#1c0810;--rim-rgb:212,168,67;--rim-bright-rgb:240,204,96;}
body[data-felt="midnight"]{--felt-a:#1c3f6b;--felt-b:#122645;--felt-c:#050e1c;--rim-rgb:180,188,200;--rim-bright-rgb:220,228,238;}
body[data-felt="charcoal"]{--felt-a:#4a4642;--felt-b:#2b2825;--felt-c:#100e0c;--rim-rgb:214,152,120;--rim-bright-rgb:236,186,158;}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--paper);height:100vh;height:-webkit-fill-available;}

#app{max-width:700px;margin:0 auto;height:100vh;height:-webkit-fill-available;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
.scr{display:none;flex-direction:column;flex:1;overflow:hidden;}
#app-sidebar-root{display:none;}
/* ═══ DESKTOP SIDEBAR (wide screens only — mobile flow is untouched below this breakpoint) ═══ */
@media(min-width:1100px){
  body{display:flex;background:radial-gradient(120% 90% at 30% -10%,#0f2019 0%,#0a130e 45%,#05080a 82%);}
  #app-sidebar-root{display:flex;flex-direction:column;width:206px;flex-shrink:0;height:100vh;padding:26px 15px 18px;
    background:
      radial-gradient(90% 26% at 50% 0%,rgba(201,155,78,.13),transparent 72%),
      radial-gradient(120% 40% at 50% 100%,rgba(34,84,60,.22),transparent 70%),
      linear-gradient(180deg,rgba(21,35,27,.86),rgba(6,12,9,.94));
    border-right:1px solid rgba(201,155,78,.16);
    box-shadow:inset -1px 0 0 rgba(255,235,190,.03),8px 0 40px rgba(0,0,0,.45);}
  #app{max-width:none;margin:0;flex:1;min-width:0;}
}
/* ═══ MOBILE BOTTOM NAV (the counterpart to the desktop rail above) ═══
   Below 1100px the sidebar is gone, so this carries the same navModel(). Above 1100px it hides and
   the rail takes over — the two are never on screen at once. */
.app-mnav{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;align-items:stretch;
  padding:.3rem .25rem calc(.3rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(12,24,18,.93),rgba(5,10,8,.985));
  border-top:1px solid rgba(201,155,78,.2);
  box-shadow:0 -8px 26px rgba(0,0,0,.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.app-mnav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.18rem;
  padding:.45rem .1rem .4rem;border:none;background:none;cursor:pointer;color:#849686;
  font-family:var(--sans);border-radius:12px;transition:color .18s,background .18s;position:relative;}
.app-mnav-item .app-mnav-ico{font-size:1.05rem;line-height:1;display:grid;place-items:center;height:1.15rem;}
.app-mnav-item .app-mnav-ico svg{width:1.05rem;height:1.05rem;}
.app-mnav-lbl{font-size:.55rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.app-mnav-item.active{color:var(--gold2);background:rgba(201,155,78,.13);}
/* The active pip echoes the desktop rail's own active treatment so the two navs read as one system. */
.app-mnav-item.active::before{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);
  width:16px;height:2px;border-radius:99px;background:linear-gradient(90deg,var(--gold3),var(--gold2));}
.app-mnav-item:focus-visible{outline:2px solid var(--gold2);outline-offset:-2px;}
/* Scrolling screens own their scroll, so page-level padding can't clear a fixed bar — give the
   screens themselves the inset only while the bar is actually up. !important is load-bearing here:
   these screens set `padding` as an inline shorthand, which would otherwise always win. */
body.has-mnav #s-home,body.has-mnav #s-games,body.has-mnav #s-moments,
body.has-mnav #s-trophies,body.has-mnav #s-family{padding-bottom:5rem!important;}
@media(min-width:1100px){
  .app-mnav{display:none;}
  body.has-mnav #s-home,body.has-mnav #s-games,body.has-mnav #s-moments,
  body.has-mnav #s-trophies,body.has-mnav #s-family{padding-bottom:1.8rem!important;}
}
/* sidebar only ever renders above 1100px (#app-sidebar-root is display:none otherwise) */
.app-sb-brand{text-align:center;margin-bottom:26px;}
.app-sb-suit{font-family:'Cinzel Decorative',var(--serif);font-weight:900;font-size:18px;color:#e0b463;line-height:1;margin-bottom:5px;text-shadow:0 0 20px rgba(232,201,135,.75);}
.app-sb-word{font-family:var(--serif);font-weight:700;font-size:1.32rem;letter-spacing:.1em;line-height:1.02;text-transform:uppercase;
  background:linear-gradient(180deg,#f8ecc6 0%,#f0d998 38%,#c99b4e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
.app-sb-word em{font-style:normal;display:block;}
.app-sb-ver{font-family:var(--serif);font-size:.72rem;color:#c99b4e;letter-spacing:.22em;margin-top:5px;opacity:.85;}
.app-sb-nav{display:flex;flex-direction:column;gap:7px;flex:1;}
.app-sb-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:#9db09f;font-family:var(--serif);font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;border:1px solid transparent;background:transparent;transition:background .18s,color .18s,box-shadow .18s;position:relative;}
.app-sb-item:hover{background:rgba(255,255,255,.045);color:var(--paper);}
.app-sb-item.active{background:linear-gradient(90deg,rgba(201,155,78,.24),rgba(201,155,78,.05) 88%);border-color:rgba(232,201,135,.5);color:#f0d998;box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,235,190,.14);}
.app-sb-item.active::before{content:"";position:absolute;left:-15px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#f6e2b0,#c99b4e);box-shadow:0 0 14px rgba(232,201,135,.65);}
.app-sb-item .ico{font-size:1rem;width:1.2rem;text-align:center;display:inline-flex;align-items:center;justify-content:center;}
.app-sb-item .ico .icon-svg{width:1.05rem;height:1.05rem;}
.app-sb-item.active .ico{filter:drop-shadow(0 0 8px rgba(232,201,135,.6));}
.app-sb-item.disabled{opacity:.3;cursor:default;}
.app-sb-item.disabled:hover{background:transparent;color:#9db09f;}
.app-sb-foot{display:flex;align-items:center;gap:10px;padding:11px;border-radius:16px;background:linear-gradient(180deg,rgba(201,155,78,.10),rgba(0,0,0,.42));border:1px solid rgba(201,155,78,.22);margin-top:12px;box-shadow:0 12px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,235,190,.09);}
.app-sb-foot .av{width:2.5rem;height:2.5rem;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#4d7460 0%,#2a4736 42%,#0f1f16 100%);font-size:1.25rem;border:1.5px solid #caa057;
  box-shadow:0 7px 16px rgba(0,0,0,.55),inset 0 2px 4px rgba(255,235,190,.32),inset 0 -4px 10px rgba(0,0,0,.5),0 0 0 3px rgba(201,155,78,.08);}
.app-sb-foot-name{font-family:var(--serif);font-size:.82rem;font-weight:600;color:#f3e7c9;letter-spacing:.02em;}
.app-sb-foot-sub{font-size:.62rem;color:#8a9a8c;margin-top:1px;}
.scr.on{display:flex;animation:scr-in .3s var(--ease-spring) both;}
@keyframes scr-in{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}

/* ─── TYPOGRAPHY ─── */
.serif{font-family:var(--serif);}
.gold-grad{background:linear-gradient(135deg,#f0cc60,#d4a843,#8a6820);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* ─── BUTTONS ─── */
.btn{appearance:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:500;border-radius:13px;padding:.85rem 1.5rem;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;transition:transform .13s,opacity .13s,box-shadow .13s;letter-spacing:.01em;position:relative;overflow:hidden;}
.btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.07);opacity:0;transition:opacity .15s;}
.btn:hover::after{opacity:1;}
.btn:active:not(:disabled){transform:scale(.96) translateY(1px);}
.btn:disabled{opacity:.28;pointer-events:none;}
.btn-full{width:100%;}
.btn-sm{padding:.5rem .9rem;font-size:.82rem;border-radius:10px;}

.btn-gold{background:linear-gradient(160deg,#f0cc60 0%,#d4a843 45%,#a87828 100%);color:#1a1000;font-weight:700;box-shadow:0 4px 0 #6a4810,0 8px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35);}
.btn-gold:active{box-shadow:0 2px 0 #6a4810,0 4px 12px rgba(0,0,0,.4);}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--paper);}
.btn-felt{background:rgba(14,64,40,.6);border:1px solid rgba(212,168,67,.3);color:var(--gold2);}
.btn-danger{background:rgba(200,16,46,.15);border:1px solid rgba(200,16,46,.4);color:#f87090;}
.btn-green{background:linear-gradient(160deg,#22c55e,#16a34a);color:white;box-shadow:0 4px 0 #166534,0 6px 20px rgba(0,0,0,.4);}
.btn-red{background:linear-gradient(160deg,#ef4444,#dc2626);color:white;box-shadow:0 4px 0 #991b1b,0 6px 20px rgba(0,0,0,.4);}

.ico-btn{width:2.75rem;height:2.75rem;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--paper2);font-size:.95rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s;}
.ico-btn:hover{background:rgba(255,255,255,.12);}
.ico-btn.on{background:rgba(212,168,67,.18);border-color:rgba(212,168,67,.5);color:var(--gold2);}

/* ─── AVATAR IMAGES (illustrated portraits, drawn in place of the plain emoji in boxed avatar slots) ─── */
.av-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;pointer-events:none;}
.seat-av{font-size:1.65rem;width:2.2rem;height:2.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.sd-av{font-size:1.5rem;width:2rem;height:2rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;vertical-align:middle;flex-shrink:0;}
.sr-av{font-size:1.35rem;width:1.8rem;height:1.8rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;vertical-align:middle;flex-shrink:0;}

/* ─── PANELS ─── */
.panel{position:relative;overflow:hidden;
  background:radial-gradient(130% 200% at 8% 0%,rgba(201,155,78,.11),transparent 62%),linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:1.1rem;
  box-shadow:0 10px 26px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06);}
.panel-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.2em;color:var(--paper2);font-weight:600;margin-bottom:.8rem;opacity:.75;}
.inp{width:100%;background:rgba(8,12,18,.7);border:1px solid rgba(255,255,255,.14);border-radius:11px;color:var(--paper);padding:.72rem .9rem;font-size:.97rem;font-family:var(--sans);}
.inp:focus{outline:none;border-color:var(--gold);}
.inp::placeholder{color:rgba(255,255,255,.22);}

/* ─── TOPBAR ─── */
.topbar{display:flex;align-items:center;gap:.6rem;padding:.85rem 1.1rem .4rem;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.05);background:rgba(8,12,18,.9);backdrop-filter:blur(16px);}
.back-btn{background:none;border:none;cursor:pointer;color:var(--gold2);font-size:.8rem;font-family:var(--sans);padding:.3rem;display:flex;align-items:center;gap:.25rem;letter-spacing:.04em;}
.top-title{font-family:var(--serif);font-size:1.05rem;font-weight:400;color:var(--paper);flex:1;}
.top-right{display:flex;gap:.35rem;}

/* ════════════════════════════════════════
   HOME
════════════════════════════════════════ */
#s-home{overflow-y:auto;
  background:
    radial-gradient(ellipse 100% 50% at 50% -10%,rgba(14,64,40,.65),transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 60%,rgba(20,33,61,.4),transparent 55%),
    var(--bg);}

/* ═══ V10 OUR TABLE HOME ═══ */
.home-v10{padding-bottom:2rem;}
.home-v10{position:relative;}
.home-v10::before{content:"";position:fixed;width:38rem;height:38rem;border-radius:50%;left:-15rem;bottom:-12rem;background:radial-gradient(circle,rgba(50,150,100,.22),transparent 70%);pointer-events:none;z-index:0;animation:home-glow-drift 16s ease-in-out infinite;}
@keyframes home-glow-drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(2.5rem,-2rem) scale(1.1);}}
.v10-hero{padding:1.35rem 1.2rem 0;position:relative;}
.v10-hero::before{content:"";position:absolute;width:26rem;height:26rem;border-radius:50%;right:-9rem;top:-12rem;background:radial-gradient(circle,rgba(220,180,100,.32),transparent 68%);pointer-events:none;}
.v10-hero::after{content:"";position:absolute;width:17rem;height:17rem;border-radius:50%;left:-7rem;top:1rem;background:radial-gradient(circle,rgba(130,80,190,.18),transparent 70%);pointer-events:none;}
.v10-kicker{font-size:.63rem;text-transform:uppercase;letter-spacing:.24em;color:var(--paper2);font-weight:600;margin-bottom:.55rem;opacity:.8;}
.v10-title{font-family:var(--serif);font-size:clamp(2.65rem,12vw,4.4rem);font-weight:700;line-height:.88;letter-spacing:-.035em;color:var(--paper);text-shadow:0 2px 24px rgba(0,0,0,.4);}
.v10-title em{font-style:normal;background:linear-gradient(100deg,#c9a45c 0%,#f5dfa0 30%,#fff6dc 45%,#f0cc60 60%,#c9a45c 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:title-shimmer 5s linear infinite;}
@keyframes title-shimmer{0%{background-position:200% 0;}100%{background-position:-50% 0;}}
@media(prefers-reduced-motion:reduce){.v10-title em{animation:none;-webkit-text-fill-color:var(--gold2);}}
.v10-sub{font-size:.8rem;color:var(--paper3);margin-top:.7rem;max-width:23rem;line-height:1.5;}
.v10-profile{display:flex;align-items:center;gap:.8rem;margin-top:1.1rem;margin-bottom:.3rem;}
.v10-profile.editing{max-width:20rem;flex-wrap:wrap;row-gap:.5rem;background:rgba(6,14,10,.92);padding:.6rem .8rem;margin-left:-.8rem;border-radius:14px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.v10-avatar{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a5c48,#16281d);border:1.5px solid #caa057;font-size:1.35rem;box-shadow:0 8px 24px rgba(0,0,0,.25);}
.v10-profile-name{font-weight:600;color:var(--paper);font-size:.9rem;}
.v10-profile-note{font-size:.68rem;color:var(--paper3);margin-top:.12rem;}
.v10-continue{margin:1.4rem 1.2rem 1rem;padding:1rem 1.05rem;border-radius:20px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--felt-a) 62%,transparent),color-mix(in srgb,var(--felt-c) 96%,transparent));
  border:1px solid rgba(234,208,138,.35);border-left:3px solid var(--gold);box-shadow:0 14px 35px rgba(0,0,0,.3),0 0 40px -18px rgba(234,208,138,.5);position:relative;
  transition:background .3s ease;}
.v10-continue::after{content:"";position:absolute;width:11rem;height:11rem;border-radius:50%;right:-5rem;top:-5rem;background:rgba(234,208,138,.14);z-index:0;pointer-events:none;}
.v10-continue.resume{border-left-color:#f0cc60;box-shadow:0 14px 35px rgba(0,0,0,.3),0 0 40px -14px rgba(240,204,96,.75);}
.v10-continue.resume .v10-eyebrow{color:#f0cc60;}
.v10-continue-top{display:flex;align-items:center;gap:.7rem;position:relative;z-index:1;}
.v10-game-mark{width:2.9rem;height:2.9rem;border-radius:13px;background:rgba(0,0,0,.25);display:grid;place-items:center;font-size:1.5rem;border:1px solid rgba(234,208,138,.3);box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1);}
.v10-continue-copy{flex:1;min-width:0;}
.v10-eyebrow{font-size:.58rem;text-transform:uppercase;letter-spacing:.16em;color:var(--paper2);font-weight:600;opacity:.8;}
.v10-game-name{font-family:var(--serif);font-size:1.08rem;color:var(--paper);margin-top:.15rem;}
.v10-game-meta{font-size:.66rem;color:var(--paper3);margin-top:.12rem;}
.v10-arrow{width:2.25rem;height:2.25rem;border-radius:50%;border:1px solid rgba(234,208,138,.25);background:rgba(0,0,0,.12);display:grid;place-items:center;color:var(--gold2);font-size:1rem;}
.v10-section{display:flex;align-items:end;justify-content:space-between;margin:1.15rem 1.2rem .6rem;}
.v10-section-title{font-family:var(--serif);font-size:1rem;color:var(--gold2);text-transform:uppercase;letter-spacing:.14em;font-weight:600;}
.v10-section-note{font-size:.6rem;text-transform:uppercase;letter-spacing:.14em;color:var(--paper3);}
/* ─── THE PLAQUE — an engraved nameplate for your table ─── */
.table-plaque{margin:0 1.2rem 1rem;text-align:center;}
.table-plaque:not(.editing){padding:.65rem 1.3rem;border-radius:10px;border:1px solid rgba(212,168,67,.28);
  background:linear-gradient(160deg,rgba(212,168,67,.09),rgba(255,255,255,.02));cursor:pointer;
  transition:background .15s,border-color .15s;}
.table-plaque:not(.editing):hover{border-color:rgba(212,168,67,.5);background:rgba(212,168,67,.13);}
.table-plaque.empty{font-family:var(--sans);font-size:.78rem;color:var(--paper3);border-style:dashed;background:none;}
.plaque-name{font-family:var(--serif);font-size:1rem;letter-spacing:.12em;color:var(--gold2);font-weight:600;}
.plaque-sub{display:block;font-size:.56rem;letter-spacing:.16em;color:var(--paper3);margin-top:.2rem;text-transform:uppercase;}
.table-plaque.editing{display:flex;gap:.5rem;align-items:center;}
.plaque-input{flex:1;min-width:0;background:rgba(8,12,18,.6);border:1px solid rgba(212,168,67,.35);border-radius:8px;color:var(--paper);padding:.55rem .8rem;font-family:var(--serif);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;}
.plaque-input:focus{outline:none;border-color:var(--gold);}
.plaque-input::placeholder{color:rgba(255,255,255,.22);text-transform:none;font-family:var(--sans);letter-spacing:normal;}
.felt-picker{display:flex;align-items:center;gap:.55rem;margin:0 1.2rem 1rem;}
.felt-picker-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--paper3);margin-right:.15rem;}
.felt-swatch{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0;transition:transform .15s,border-color .15s;box-shadow:0 3px 8px rgba(0,0,0,.35);}
.felt-swatch:hover{transform:scale(1.12);}
.felt-swatch.active{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(234,208,138,.3),0 3px 8px rgba(0,0,0,.35);}
.ambient-toggle{margin-left:.3rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--paper3);border-radius:999px;padding:.32rem .8rem;font-size:.68rem;font-family:var(--sans);cursor:pointer;transition:all .15s;}
.ambient-toggle:hover{border-color:rgba(212,168,67,.35);color:var(--paper);}
.ambient-toggle.on{background:rgba(212,168,67,.16);border-color:rgba(212,168,67,.5);color:var(--gold2);}
.v10-section-link{cursor:pointer;color:var(--gold2);transition:color .15s;}
.v10-section-link:hover{color:var(--gold);}
.v10-games{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;padding:0 1.2rem;}
.v10-game-card{min-height:9.2rem;border-radius:18px;padding:.9rem;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09);cursor:pointer;position:relative;transition:transform .18s,border-color .18s,background .18s;display:flex;flex-direction:column;justify-content:space-between;}
.v10-game-card:hover{transform:translateY(-2px);border-color:rgba(234,208,138,.38);}
.v10-game-card:focus-visible{outline:2px solid #eac98a;outline-offset:2px;border-color:rgba(234,208,138,.6);}
/* Zero-specificity fallback (via :where()) so any role="button" element without its own dedicated
   focus style below still gets a visible ring for keyboard users, without ever fighting a more
   specific rule (die, roulette cell, hand card, etc.) that wants its own custom treatment. */
:where([role="button"]):focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:8px;}
.v10-game-card.locked{opacity:.42;cursor:default;}
.v10-game-card.locked:hover{transform:none;}
.v10-card-watermark{position:absolute;right:-.6rem;bottom:-1.3rem;font-size:6rem;line-height:1;opacity:.22;pointer-events:none;transform:rotate(-8deg);filter:saturate(1.4);}
.v10-game-card{border-top:3px solid transparent;}
.v10-gc--maumau{background:linear-gradient(160deg,rgba(56,158,102,.4),rgba(10,28,20,.3));border-top-color:#5fd68a;box-shadow:0 10px 28px -12px rgba(70,200,130,.35);}
.v10-gc--maumau:hover{border-color:rgba(234,208,138,.42);}
.v10-gc--texas,.v10-gc--fivecard{background:linear-gradient(160deg,rgba(212,168,67,.28),rgba(10,26,18,.3));border-top-color:#eac976;box-shadow:0 10px 28px -12px rgba(212,168,67,.35);}
.v10-gc--texas:hover,.v10-gc--fivecard:hover{border-color:rgba(212,168,67,.4);}
.v10-gc--blackjack{background:linear-gradient(160deg,rgba(210,64,84,.34),rgba(30,8,12,.3));border-top-color:#ef7688;box-shadow:0 10px 28px -12px rgba(210,64,84,.35);}
.v10-gc--blackjack:hover{border-color:rgba(224,110,120,.42);}
.v10-gc--battle{background:linear-gradient(160deg,rgba(60,150,224,.32),rgba(8,22,32,.3));border-top-color:#7ec2f2;box-shadow:0 10px 28px -12px rgba(60,150,224,.35);}
.v10-gc--battle:hover{border-color:rgba(110,175,224,.42);}
.v10-gc--yahtzee{background:linear-gradient(160deg,rgba(242,201,76,.32),rgba(28,20,6,.3));border-top-color:#f2c94c;box-shadow:0 10px 28px -12px rgba(242,201,76,.35);}
.v10-gc--yahtzee:hover{border-color:rgba(242,201,76,.42);}
.v10-gc--roulette{background:linear-gradient(160deg,rgba(224,99,122,.32),rgba(30,8,14,.3));border-top-color:#e0637a;box-shadow:0 10px 28px -12px rgba(224,99,122,.35);}
.v10-gc--roulette:hover{border-color:rgba(224,99,122,.42);}
.v10-gc--uno{background:linear-gradient(160deg,rgba(229,71,58,.32),rgba(30,8,10,.3));border-top-color:#e5473a;box-shadow:0 10px 28px -12px rgba(229,71,58,.35);}
.v10-gc--uno:hover{border-color:rgba(229,71,58,.42);}
.v10-card-icon{width:2.75rem;height:2.75rem;display:grid;place-items:center;font-size:1.5rem;line-height:1;background:rgba(0,0,0,.28);border-radius:12px;border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1);position:relative;}
.v10-card-name{font-family:var(--serif);font-size:1rem;color:var(--paper);margin-top:.55rem;position:relative;}
.v10-card-meta{font-size:.62rem;color:var(--paper3);margin-top:.16rem;position:relative;}
.v10-card-tag{align-self:flex-start;font-size:.52rem;text-transform:uppercase;letter-spacing:.12em;color:var(--paper2);margin-top:.5rem;opacity:.7;position:relative;}
.v10-game-card.has-cover{padding:0;aspect-ratio:3/4;min-height:0;background-size:cover;background-position:center;box-shadow:0 10px 28px -12px rgba(0,0,0,.55);}
.v10-game-card.has-cover .cover-tag{position:absolute;left:.6rem;bottom:.6rem;margin:0;opacity:1;background:rgba(8,12,10,.78);padding:.28rem .6rem;border-radius:8px;backdrop-filter:blur(4px);color:var(--gold2);}
.v10-bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;padding:0 1.2rem;margin-top:.9rem;}
.v10-mini{border-radius:17px;padding:.85rem;background:linear-gradient(160deg,rgba(212,168,67,.14),rgba(255,255,255,.025));border:1px solid rgba(234,208,138,.18);border-bottom:2px solid rgba(234,208,138,.35);}
.v10-mini-label{font-size:.56rem;text-transform:uppercase;letter-spacing:.16em;color:var(--paper3);}
.v10-mini-value{font-family:var(--serif);font-size:1.7rem;font-weight:700;color:var(--gold2);margin-top:.25rem;text-shadow:0 0 18px rgba(234,208,138,.35);}
.v10-mini-sub{font-size:.62rem;color:var(--paper3);margin-top:.1rem;}
.v10-actions{display:flex;gap:.55rem;padding:0 1.2rem;margin-top:1rem;}
.v10-actions .btn{flex:1;}
.v10-cta{position:relative;overflow:hidden;}
.v10-cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:v10-shimmer 4.5s ease-in-out infinite;}
@keyframes v10-shimmer{0%{left:-60%;}35%{left:130%;}100%{left:130%;}}
@media(prefers-reduced-motion:reduce){.v10-cta::after{animation:none;display:none;}.home-v10::before{animation:none;}}
@media(min-width:650px){#app{max-width:900px}.v10-games{grid-template-columns:repeat(3,1fr)}.v10-hero{padding-left:2rem;padding-right:2rem;padding-bottom:0}.v10-continue,.v10-actions,.v10-bottom-grid{margin-left:2rem;margin-right:2rem}.v10-games,.v10-section{margin-left:2rem;margin-right:2rem;padding-left:0;padding-right:0}.v10-section{margin-top:1.5rem}}
/* ═══ DESKTOP HOME DASHBOARD (wide screens only — mobile v10 flow above is untouched) ═══ */
/* Materials pass: layered radial grounds instead of flat fills, sphere avatars, ambient glow
   blobs behind icons, gold gradient-text headlines, drop-shadow + inset-highlight pairs,
   pill CTAs with circular gold badges. Everything here is inside the 1100px query, or is a
   base rule for an element that is display:none below 1100px. */
.v10-side{display:none;}
.v10-table-motif{display:none;}
@media(min-width:1100px){
  /* the @media(min-width:650px) block above also matches here and re-caps #app at 900px, which
     was squeezing the dashboard into ~450px of the window. Lift the cap on #app and re-apply the
     old 900px cap to every screen except Home, so only the dashboard gains the extra width. */
  #app{max-width:none;margin:0;}
  #app>.scr:not(#s-home){max-width:900px;width:100%;margin-right:auto;}
  /* ── page ground: layered radials, never a flat panel colour ── */
  #s-home{background:
      radial-gradient(74% 50% at 18% -14%,rgba(42,104,73,.42),transparent 64%),
      radial-gradient(50% 38% at 86% 0%,rgba(201,155,78,.15),transparent 66%),
      radial-gradient(80% 55% at 64% 112%,rgba(18,48,35,.6),transparent 72%),
      radial-gradient(120% 90% at 30% -10%,#0f2019 0%,#0a130e 45%,#05080a 82%);}
  /* ── scrollbars: thin gold rail, never stock OS chrome ── */
  .scr,.scr *{scrollbar-width:thin;scrollbar-color:rgba(201,155,78,.34) transparent;}
  .scr::-webkit-scrollbar,.scr *::-webkit-scrollbar{width:10px;height:10px;}
  .scr::-webkit-scrollbar-track,.scr *::-webkit-scrollbar-track{background:transparent;}
  .scr::-webkit-scrollbar-corner,.scr *::-webkit-scrollbar-corner{background:transparent;}
  .scr::-webkit-scrollbar-thumb,.scr *::-webkit-scrollbar-thumb{border:3px solid transparent;background:linear-gradient(180deg,rgba(240,217,152,.40),rgba(201,155,78,.20));background-clip:padding-box;border-radius:999px;}
  .scr::-webkit-scrollbar-thumb:hover,.scr *::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(246,226,176,.66),rgba(201,155,78,.42));background-clip:padding-box;}

  /* ── grid shell ── */
  .v10-grid{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:18px;align-items:start;padding:18px 22px 30px;}
  .v10-main{min-width:0;display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 48px);}
  .v10-main>*{margin-left:0;margin-right:0;}
  .v10-side{display:flex;flex-direction:column;gap:18px;}
  .home-v10{padding-bottom:0;}

  /* ── shared panel material ── */
  .v10-main .v10-hero,.v10-main .v10-continue,.v10-main .v10-games,.v10-side-card{
    border-radius:18px;border:1px solid rgba(201,155,78,.16);
    box-shadow:0 20px 46px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,235,190,.06);}

  /* ── hero ── */
  .v10-main .v10-hero{position:relative;overflow:hidden;padding:30px 32px;padding-right:360px;min-height:320px;display:flex;flex-direction:column;justify-content:center;margin:0;
    background:
      radial-gradient(90% 120% at 12% 0%,rgba(38,78,56,.72),transparent 62%),
      radial-gradient(70% 110% at 96% 40%,rgba(201,155,78,.13),transparent 66%),
      linear-gradient(180deg,rgba(20,36,27,.86),rgba(7,14,10,.94));}
  .v10-main .v10-hero::before{width:30rem;height:30rem;right:-6rem;top:-13rem;background:radial-gradient(circle,rgba(224,178,92,.30),transparent 66%);}
  .v10-main .v10-hero::after{width:22rem;height:22rem;left:-9rem;top:2rem;background:radial-gradient(circle,rgba(46,140,95,.24),transparent 70%);}
  .v10-main .v10-kicker{font-size:.66rem;letter-spacing:.28em;color:#9db09f;opacity:1;margin-bottom:.4rem;position:relative;}
  .v10-main .v10-title{font-size:3.15rem;line-height:.94;letter-spacing:-.01em;position:relative;text-shadow:0 4px 30px rgba(0,0,0,.55);}
  .v10-main .v10-sub{font-size:.82rem;color:#9db09f;margin-top:.6rem;max-width:19rem;position:relative;}
  .v10-main .v10-profile{margin-top:1.35rem;position:relative;gap:.85rem;}
  .v10-main .v10-avatar{width:3rem;height:3rem;flex:none;background:radial-gradient(circle at 35% 28%,#4d7460 0%,#2a4736 42%,#0f1f16 100%);border:1.5px solid #caa057;
    box-shadow:0 8px 20px rgba(0,0,0,.55),inset 0 2px 5px rgba(255,235,190,.34),inset 0 -5px 12px rgba(0,0,0,.5),0 0 0 4px rgba(201,155,78,.07);}
  .v10-main .v10-profile-name{font-family:var(--serif);font-size:.95rem;color:#f3e7c9;letter-spacing:.02em;}
  .v10-main .v10-profile-note{font-size:.66rem;color:#8a9a8c;}

  /* ── hero table photo (desktop-only element, hidden below 1100px) ── */
  .v10-table-motif{display:block;position:absolute;right:0;top:0;bottom:0;width:min(58%,460px);pointer-events:none;z-index:1;
    background-image:url('assets/hero/table.jpg');background-size:cover;background-position:62% 45%;
    -webkit-mask-image:linear-gradient(to right,transparent,rgba(0,0,0,.5) 16%,#000 34%);
    mask-image:linear-gradient(to right,transparent,rgba(0,0,0,.5) 16%,#000 34%);}

  /* ── resume / continue card → pill-badged CTA ── */
  .v10-main .v10-continue{margin:0;padding:16px 18px;border-left:2px solid rgba(232,201,135,.6);
    background:
      radial-gradient(90% 180% at 6% 0%,rgba(201,155,78,.18),transparent 58%),
      linear-gradient(115deg,color-mix(in srgb,var(--felt-a) 58%,transparent),color-mix(in srgb,var(--felt-c) 96%,transparent) 66%);
    box-shadow:0 18px 42px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,190,.09),0 0 46px -20px rgba(232,201,135,.6);
    transition:background .3s ease;}
  .v10-main .v10-continue::after{width:13rem;height:13rem;right:-5rem;top:-6rem;background:radial-gradient(circle,rgba(232,201,135,.20),transparent 66%);}
  .v10-main .v10-continue-top{gap:.9rem;}
  .v10-main .v10-game-mark{width:3rem;height:3rem;flex:none;border-radius:14px;font-size:1.5rem;border:1px solid rgba(201,155,78,.34);
    background:radial-gradient(120% 120% at 32% 22%,rgba(255,235,190,.18),rgba(0,0,0,.42) 70%);
    box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,235,190,.28);}
  .v10-main .v10-eyebrow{font-size:.58rem;letter-spacing:.2em;color:#c9b78d;opacity:.9;}
  .v10-main .v10-game-name{font-size:1.15rem;color:#f3e7c9;}
  .v10-main .v10-game-meta{font-size:.68rem;color:#8a9a8c;}
  .v10-main .v10-arrow{width:2.4rem;height:2.4rem;flex:none;border:none;font-size:1rem;font-weight:600;color:#1a120a;
    background:linear-gradient(180deg,#f6e2b0,#c99b4e);
    box-shadow:0 8px 18px rgba(201,155,78,.36),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 4px rgba(120,80,20,.35);}

  /* ── section headers → gold gradient-text with hairline rule ── */
  .v10-main .v10-section{margin:6px 0 -4px;align-items:center;gap:16px;}
  .v10-main .v10-section-title{font-size:.86rem;letter-spacing:.24em;
    background:linear-gradient(180deg,#f6e2b0,#c99b4e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  .v10-main .v10-section::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,155,78,.34),transparent);order:1;}
  .v10-main .v10-section-note{order:2;font-size:.58rem;letter-spacing:.18em;color:#9db09f;}
  .v10-main .v10-section--journey,.v10-main .v10-bottom-grid{display:none;}

  /* ── game tiles: one row of five, glow blob behind each icon ── */
  .v10-main .v10-games{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:18px 16px;margin:0;
    background:
      radial-gradient(110% 130% at 50% -20%,rgba(28,50,38,.8),transparent 68%),
      linear-gradient(180deg,rgba(18,32,24,.78),rgba(7,14,10,.92));}
  .v10-main .v10-game-card{min-height:0;border-radius:14px;padding:18px 8px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    border:1px solid rgba(201,155,78,.16);border-top:1.5px solid rgba(201,155,78,.3);
    background:linear-gradient(180deg,rgba(30,48,37,.85),rgba(10,20,15,.92));
    box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,235,190,.05);
    transition:transform .2s var(--ease-smooth),box-shadow .2s,border-color .2s;}
  .v10-main .v10-game-card:hover{transform:translateY(-4px);border-color:rgba(232,201,135,.75);
    box-shadow:0 0 26px rgba(224,178,92,.34),inset 0 0 20px rgba(224,178,92,.12),0 16px 34px rgba(0,0,0,.5);}
  .v10-main .v10-card-watermark,.v10-main .v10-card-tag{display:none;}
  .v10-main .v10-game-card.has-cover{aspect-ratio:3/4;min-height:0;padding:0;background-size:cover;background-position:center;}
  .v10-main .v10-game-card>div{width:100%;}
  .v10-main .v10-card-icon{width:56px;height:56px;margin:0 auto;border:none;border-radius:50%;background:transparent;box-shadow:none;font-size:1.6rem;position:relative;isolation:isolate;}
  .v10-main .v10-card-icon::before{content:"";position:absolute;inset:-14px;border-radius:50%;z-index:-1;
    background:radial-gradient(circle,var(--tile-glow,rgba(201,155,78,.45)),transparent 66%);}
  .v10-main .v10-card-name{font-size:.72rem;letter-spacing:.06em;line-height:1.25;margin-top:.5rem;color:#f3e7c9;}
  .v10-main .v10-card-meta{font-size:.58rem;color:#9db09f;margin-top:.3rem;line-height:1.35;}
  .v10-main .v10-gc--maumau{background:linear-gradient(180deg,rgba(34,74,53,.85),rgba(9,19,14,.93));border-top-color:rgba(95,214,138,.6);--tile-glow:rgba(95,214,138,.6);}
  .v10-main .v10-gc--texas,.v10-main .v10-gc--fivecard{background:linear-gradient(180deg,rgba(62,54,30,.85),rgba(14,17,11,.93));border-top-color:rgba(234,201,118,.65);--tile-glow:rgba(234,201,118,.62);}
  .v10-main .v10-gc--blackjack{background:linear-gradient(180deg,rgba(72,30,38,.82),rgba(18,10,12,.93));border-top-color:rgba(239,118,136,.6);--tile-glow:rgba(239,118,136,.6);}
  .v10-main .v10-gc--battle{background:linear-gradient(180deg,rgba(26,54,76,.85),rgba(8,16,22,.93));border-top-color:rgba(126,194,242,.6);--tile-glow:rgba(126,194,242,.6);}
  .v10-main .v10-gc--yahtzee{background:linear-gradient(180deg,rgba(78,64,20,.85),rgba(20,15,6,.93));border-top-color:rgba(242,201,76,.6);--tile-glow:rgba(242,201,76,.6);}
  .v10-main .v10-gc--roulette{background:linear-gradient(180deg,rgba(74,26,36,.85),rgba(20,8,12,.93));border-top-color:rgba(224,99,122,.6);--tile-glow:rgba(224,99,122,.6);}
  .v10-main .v10-gc--uno{background:linear-gradient(180deg,rgba(74,24,20,.85),rgba(20,8,7,.93));border-top-color:rgba(229,71,58,.6);--tile-glow:rgba(229,71,58,.6);}

  /* ── actions → pills ── */
  .v10-main .v10-actions{margin:2px 0 0;gap:.7rem;}
  .v10-main .v10-foot{padding:0!important;margin-top:auto;}
  .v10-main .v10-actions .btn{white-space:nowrap;font-size:.88rem;padding:.95rem 1.4rem;border-radius:999px;letter-spacing:.02em;}
  .v10-main .v10-actions .btn-gold{box-shadow:0 10px 26px rgba(201,155,78,.3),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(120,80,20,.35);}
  .v10-main .v10-actions .btn-ghost{background:rgba(201,155,78,.08);border:1px solid rgba(201,155,78,.55);color:#f0d998;box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,235,190,.12);}
  .v10-main .v10-actions .btn-ghost:hover{background:rgba(201,155,78,.15);}

  /* ── side panels ── */
  .v10-side-card{padding:20px 22px;
    background:
      radial-gradient(120% 130% at 50% 0%,rgba(28,48,36,.86),transparent 66%),
      linear-gradient(180deg,rgba(18,32,24,.8),rgba(7,14,10,.93));}
  .v10-side-card-title{font-family:var(--serif);font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600;text-align:center;margin-bottom:14px;padding-bottom:12px;
    border-bottom:1px solid rgba(201,155,78,.14);
    background:linear-gradient(180deg,#f6e2b0,#c99b4e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  .v10-tonight-card{padding:18px 14px;border-color:rgba(201,155,78,.34);
    background:
      radial-gradient(120% 150% at 50% -25%,rgba(66,50,16,.65),transparent 70%),
      linear-gradient(180deg,rgba(20,30,22,.8),rgba(5,10,8,.94));
    box-shadow:0 20px 46px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,235,190,.09),0 0 44px -22px rgba(232,201,135,.8);}
  .v10-tonight-card .v10-side-card-title{font-size:.7rem;letter-spacing:.26em;margin-bottom:14px;}
  .v10-tonight-grid{display:flex;flex-wrap:nowrap;justify-content:space-around;gap:4px;}
  .v10-tonight-stat{text-align:center;min-width:3.2rem;}
  .v10-tonight-val{font-family:var(--serif);font-weight:700;font-size:1.7rem;line-height:1;
    background:linear-gradient(180deg,#fbf0cf 0%,#f0d998 42%,#c99b4e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  .v10-tonight-lbl{font-size:.5rem;text-transform:uppercase;letter-spacing:.14em;color:#8a9a8c;margin-top:6px;}
  /* ── moment rows: sphere avatars ── */
  .v10-moment-row{display:flex;align-items:center;gap:.75rem;padding:.72rem 0;border-top:1px solid rgba(201,155,78,.13);}
  .v10-moment-row:first-of-type{border-top:none;padding-top:.15rem;}
  .v10-moment-ico{width:2.2rem;height:2.2rem;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;margin:0;
    background:radial-gradient(circle at 35% 28%,#4d7460 0%,#2a4736 42%,#0f1f16 100%);border:1.5px solid rgba(202,160,87,.8);
    box-shadow:0 6px 15px rgba(0,0,0,.5),inset 0 2px 4px rgba(255,235,190,.3),inset 0 -4px 9px rgba(0,0,0,.45);}
  .v10-moment-body{min-width:0;}
  .v10-moment-txt{font-size:.79rem;color:#efe6d2;line-height:1.35;}
  .v10-moment-meta{font-size:.6rem;color:#8a9a8c;margin-top:.2rem;letter-spacing:.04em;}
  .v10-moment-empty{font-size:.75rem;color:#8a9a8c;padding:.3rem 0 .6rem;}
  .v10-side-link{display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 20px;height:42px;border-radius:999px;
    border:1px solid rgba(201,155,78,.4);background:rgba(201,155,78,.06);

    transition:background .18s,box-shadow .18s;}
  .v10-side-link::after{content:"→";width:30px;height:30px;border-radius:50%;color:#1a120a;display:grid;place-items:center;font-size:.92rem;
    background:linear-gradient(180deg,#f6e2b0,#c99b4e);box-shadow:0 4px 12px rgba(201,155,78,.4),inset 0 1px 0 rgba(255,255,255,.5);}
  .v10-side-link:hover{background:rgba(201,155,78,.13);box-shadow:0 0 24px -6px rgba(232,201,135,.45);}
  .v10-trophy-strip{display:flex;justify-content:center;gap:.5rem;margin-bottom:.7rem;}
  .v10-trophy-chip{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;
    border:1px solid rgba(234,208,138,.34);background:radial-gradient(120% 140% at 50% -10%,rgba(212,168,67,.24),transparent 66%),rgba(255,255,255,.03);

  .v10-trophy-count{text-align:center;font-size:.66rem;color:var(--paper3);margin-bottom:.5rem;letter-spacing:.04em;}
  /* ── "your table" lifetime stats (desktop copy lives in the side column) ── */
  .v10-yt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .v10-side .v10-mini{border-radius:14px;padding:16px 12px 14px;text-align:center;position:relative;overflow:hidden;
    border:1px solid rgba(201,155,78,.2);border-bottom:1px solid rgba(201,155,78,.2);
    background:linear-gradient(180deg,rgba(201,155,78,.12),rgba(8,15,11,.6));
    box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,235,190,.08);}
  .v10-side .v10-mini::before{content:"";position:absolute;left:50%;top:-38px;width:130px;height:90px;transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(circle,rgba(232,201,135,.26),transparent 66%);}
  .v10-side .v10-mini-label{font-size:.5rem;letter-spacing:.18em;color:#8a9a8c;position:relative;}
  .v10-side .v10-mini-value{font-size:2.1rem;line-height:1;margin-top:.35rem;position:relative;text-shadow:none;
    background:linear-gradient(180deg,#fbf0cf 0%,#f0d998 42%,#c99b4e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
  .v10-side .v10-mini-sub{font-size:.6rem;color:#8a9a8c;margin-top:.35rem;position:relative;line-height:1.35;}
}
/* narrow desktop (1100–1359px): not enough room beside the side column for the table motif,
   so the hero goes back to full width and the tiles wrap to three across. */
@media(min-width:1100px) and (max-width:1359px){
  .v10-grid{grid-template-columns:minmax(0,1fr) 336px;gap:16px;padding:16px 18px 26px;}
  .v10-table-motif{display:none;}

  .v10-side-card{padding:18px 18px;}
  .v10-tonight-stat{min-width:2.8rem;}
}

/* player pills */
