<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 1024" width="768" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="22%" r="90%"><stop offset="0" stop-color="#1a6840"/><stop offset=".45" stop-color="#0e4028"/><stop offset="1" stop-color="#04120c"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset=".45" stop-color="#e9c46a"/><stop offset="1" stop-color="#9a6f1f"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e9c46a" stop-opacity=".55"/><stop offset="1" stop-color="#e9c46a" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="768" height="1024" fill="url(#bg)"/>
  <g opacity=".7" fill="#fff"><circle cx="90" cy="110" r="2"/><circle cx="640" cy="80" r="1.6"/><circle cx="700" cy="300" r="2.2"/><circle cx="60" cy="420" r="1.5"/><circle cx="560" cy="170" r="1.4"/><circle cx="200" cy="60" r="1.3"/><circle cx="720" cy="620" r="1.8"/><circle cx="40" cy="760" r="1.6"/></g>
  <ellipse cx="384" cy="430" rx="330" ry="330" fill="url(#glow)"/>
  <!-- ring of six realms -->
  <g transform="translate(384 430)">
    <circle r="250" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle r="236" fill="none" stroke="#e9c46a" stroke-opacity=".3" stroke-width="1.5"/>
    <g font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif" font-size="74" text-anchor="middle">
      <g transform="rotate(0) translate(0 -250) rotate(0)"><circle r="52" fill="#0b2c1e" stroke="#3da5ff" stroke-width="4"/><text y="26">🧭</text></g>
      <g transform="rotate(60) translate(0 -250) rotate(-60)"><circle r="52" fill="#0b2c1e" stroke="#e9c46a" stroke-width="4"/><text y="26">🏛️</text></g>
      <g transform="rotate(120) translate(0 -250) rotate(-120)"><circle r="52" fill="#0b2c1e" stroke="#d946a8" stroke-width="4"/><text y="26">🎭</text></g>
      <g transform="rotate(180) translate(0 -250) rotate(-180)"><circle r="52" fill="#0b2c1e" stroke="#4ade80" stroke-width="4"/><text y="26">🏅</text></g>
      <g transform="rotate(240) translate(0 -250) rotate(-240)"><circle r="52" fill="#0b2c1e" stroke="#f97362" stroke-width="4"/><text y="26">🍷</text></g>
      <g transform="rotate(300) translate(0 -250) rotate(-300)"><circle r="52" fill="#0b2c1e" stroke="#8b5cf6" stroke-width="4"/><text y="26">🔬</text></g>
    </g>
    <!-- the centre: a gold hexagonal crest with the Chaser's mask -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="#05140d" stroke="url(#gold)" stroke-width="7"/>
    <polygon points="0,-108 94,-54 94,54 0,108 -94,54 -94,-54" fill="none" stroke="#e9c46a" stroke-opacity=".4" stroke-width="2"/>
    <text y="42" font-family="Georgia, serif" font-size="128" font-weight="800" text-anchor="middle" fill="url(#gold)">TM</text>
  </g>
  <!-- title -->
  <text x="384" y="800" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="800" text-anchor="middle" letter-spacing="8" fill="#000" opacity=".55" filter="url(#sh)">TABLE MIND</text>
  <text x="384" y="800" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="800" text-anchor="middle" letter-spacing="8" fill="url(#gold)" stroke="#6b4a10" stroke-width="1.2">TABLE MIND</text>
  <text x="384" y="866" font-family="Georgia, serif" font-size="30" text-anchor="middle" letter-spacing="9" fill="#d8cfbd">KNOWLEDGE. STRATEGY. GLORY.</text>
  <line x1="150" y1="900" x2="618" y2="900" stroke="#e9c46a" stroke-opacity=".5"/>
  <text x="384" y="950" font-family="Georgia, serif" font-size="26" text-anchor="middle" letter-spacing="6" fill="#e9c46a" opacity=".85">DAS GROSSE WISSENSDUELL</text>
</svg>
